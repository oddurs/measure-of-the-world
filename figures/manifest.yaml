# --- Appendix C: The Astronomers Royal -------------------------------------

appc-nathaniel-bliss:
  file: src/figures/photos/appc-nathaniel-bliss.jpg
  status: wanted
  subject: "The Reverend Nathaniel Bliss, fourth Astronomer Royal"
  creator: "Unknown artist, British School"
  date: "18th century"
  source_url: "https://commons.wikimedia.org/wiki/File:The_Reverend_Nathaniel_Bliss.jpg"
  license: "public domain (Public Domain Mark 1.0 / PD-old-100)"
  credit_line: "The Reverend Nathaniel Bliss, British School, 18th century. National Maritime Museum, Greenwich (BHC4144). Public domain."
  pixels: "1061x1280"
  notes: >-
    A portrait of Bliss does exist, contrary to what is often assumed. This is
    effectively the only likeness, besides an engraving on a pewter flagon
    reproduced in Maunder 1900 (File:Nathaniel_Bliss.jpg, 323x352).

appc-john-pond:
  file: ""
  status: rejected
  subject: "John Pond, sixth Astronomer Royal"
  creator: ""
  date: ""
  source_url: "https://commons.wikimedia.org/wiki/File:John_Pond.jpg"
  license: "public domain"
  credit_line: ""
  pixels: "325x384"
  notes: >-
    REJECTED ON FACTUAL GROUNDS, not licensing. No authentic portrait of the
    astronomer John Pond is known to exist. The engraving that circulates as him
    (Benjamin Smith after Thomas Parkinson, 1787) is a documented misidentification
    and the Commons file page says so: the sitter is John Pond of Newmarket, a
    livery-stable keeper who compiled the Racing Calendar. Corroborated by a letter
    from Thomas Bradley, Pond's brother-in-law, stating that "no likeness whatever
    exists of my late brother in law Mr Pond except perhaps a small silhouette in
    black paper." Print no portrait and say so in the appendix; the absence is
    itself worth a sentence.

