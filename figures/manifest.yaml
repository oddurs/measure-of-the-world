  date: "1598"
  source_url: "https://commons.wikimedia.org/wiki/File:Mauerquadrant.jpg"
  license: "public domain (Public Domain Mark 1.0)"
  credit_line: "Quadrans muralis sive Tichonicus, from Tycho Brahe, Astronomiae Instauratae Mechanica (Wandsbek, 1598), hand-coloured. Public domain."
  pixels: "3134x4600"
  notes: >-
    Identified by exact SHA-1 match. Caption at src/chapters/03.tex:12 is accurate
    as to work and date. One refinement worth making: this is a HAND-COLOURED
    impression, not the plain 1598 printing, and the caption does not say so. The
    Photoshop 7.0 / 2005 metadata is from whoever scanned it. Copyright is clean.
    A flat reproduction of a 1598 engraving attracts no new copyright. Best
    resolution available for this plate anywhere.

ch03-uraniborg:
  file: src/figures/photos/ch03-uraniborg.jpg
  status: present
  risk: SAFE
  subject: "Plan of Uraniborg and its walled gardens, Hven"
  creator: "Willem Blaeu, after Tycho Brahe"
  date: "c. 1662-1665"
  source_url: "https://commons.wikimedia.org/wiki/File:Uraniborgskiss_45.jpg"
  license: "public domain (Public Domain Mark 1.0)"
  credit_line: "Arcis Uraniburgi ... a Tychone Brahe, hand-coloured engraving from Joan Blaeu, Atlas Maior, vol. 1 (Amsterdam, 1662-65), after Tycho Brahe's woodcut of 1598. Public domain."
  pixels: "1000x821"
  recommended_replacement: ch03-uraniborg-1598
  notes: >-
    Identified by exact SHA-1 match. Copyright is clean. CAPTION ERROR in
    src/chapters/03.tex:21 on two counts. First, the plate is NOT from
    Astronomiae Instauratae Mechanica (1598); it is Willem Blaeu's hand-coloured
    copper engraving in Joan Blaeu's Atlas Maior of c. 1662-65, derived from
    Tycho's 1598 woodcut. Second, the caption describes "the elaborate Renaissance
    structure ... equipped with large instruments", but this image is a bird's-eye
    PLAN of the diamond-shaped rampart and the formal gardens, with the house only
    a small element at the centre; it does not show the observation platforms or
    the instruments. Either rewrite the caption to describe the grounds and credit
    Blaeu, or swap in ch03-uraniborg-1598, which is the actual 1598 plate at
    2643x3609. PRODUCTION PROBLEM — 1000x821 is thin for the 0.6-textwidth plate.

