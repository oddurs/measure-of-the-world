ch02-tompion-clock:
  file: src/figures/photos/ch02-tompion-clock.jpg
  status: present
  risk: NEEDS-SOURCING
  subject: "Longcase clock in the Octagon Room, Royal Observatory Greenwich"
  creator: "Bin im Garten"
  date: "2010-07-28"
  source_url: "https://commons.wikimedia.org/wiki/File:Royal_Observatory,_Greenwich_2010_PD_09.JPG"
  license: "CC BY-SA 3.0"
  credit_line: "Photo: Bin im Garten, CC BY-SA 3.0, via Wikimedia Commons."
  pixels: "1839x2496"
  notes: >-
    Identified by exact SHA-1 match; the Canon PowerShot SX210 IS and the
    2010-07-28 17:02:39 capture timestamp match the Commons record to the second.
    It is a personal photograph, but the photographer released it under CC BY-SA
    3.0, so it IS commercially usable with attribution. Attribution is mandatory
    and currently absent. SUBJECT IDENTIFICATION IS UNVERIFIED and probably wrong.
    The Commons description says only "The Octagon room" and does not identify the
    clock; the uploader filed it under both "Longcase clocks from the United
    Kingdom" and "Tompion clocks at the Royal Observatory, Greenwich". The image
    shows a floor-standing longcase clock in a panelled corner, but Tompion's two
    1676 year-going clocks were WALL-MOUNTED, their dials set high above the
    wainscot with the 13-foot pendulums hanging behind the panelling. So this is
    very unlikely to be one of them; the same Commons category contains a
    "Purpose-Built Case for One of the Original Tompion Movements, about 1737" and
    a "Tompion Clock - Engraved Replica Dial (unknown maker, about 1972)". Verify
    the object with the Observatory before printing the caption at
    src/chapters/02.tex:48, which asserts it is a 1676 Tompion year-going clock
    with a 13-foot pendulum. Consider ch06-tompion-longcase instead, which is a
    documented Tompion under CC0 at 3335x5472.

