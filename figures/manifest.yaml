ch02-john-flamsteed:
  file: src/figures/photos/ch02-john-flamsteed.jpg
  status: present
  risk: SAFE
  subject: "John Flamsteed, first Astronomer Royal"
  creator: "Thomas Gibson"
  date: "1712"
  source_url: "https://commons.wikimedia.org/wiki/File:John_Flamsteed_(Gem%C3%A4lde).jpg"
  license: "public domain (PD-Art, artist died 1751)"
