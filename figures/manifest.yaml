appc-spencer-jones:
  file: ""
  status: wanted
  subject: "Sir Harold Spencer Jones, tenth Astronomer Royal"
  creator: ""
  date: ""
  source_url: ""
  license: ""
  credit_line: ""
  pixels: ""
  notes: >-
    NOT SOURCED. No commercially reusable image found anywhere. Nothing on
    Commons, no portrait on the English Wikipedia article, and the Wellcome
    catalogue holds only books with his foreword. The known Elliott & Fry
    photographs are held by RMG (object 244899) under CC BY-NC-ND, or by Getty and
    Science Photo Library. All unusable. He died in 1960, so UK photographic
    copyright is probably still live unless a pre-1930 image surfaces. Either omit,
    fall back to ch24-astronomers-royal-wall, or budget for a paid licence.

