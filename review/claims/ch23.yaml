- id: ch23-002
  type: date
  status: unverified
  text: "By 1950, the Astronomer Royal, Sir Harold Spencer Jones, is writing memoranda about an uncomfortable reality: the observatory he directs is becoming useless for serious observational astronomy."
  source: ""
  note: ""

- id: ch23-003
  type: quotation
  status: unverified
  text: "( provides the definitive history of Greenwich's institutional crisis. documents the Observatory's adaptation and migration.) This chapter tells the story of light pollution—how a consequence of industrial modernity became the primary driver of scientific institutions' relocation, and how the Royal Greenwich Observatory responded by abandoning its historic home."
  source: ""
  note: ""

- id: ch23-004
  type: date
  status: unverified
  text: "At Greenwich in 1900, the limiting magnitude under good conditions was approximately 5.5 magnitude stars."
  source: ""
  note: ""

- id: ch23-005
  type: date
  status: unverified
  text: "By 1920, as electric lighting proliferated, the limiting magnitude had degraded to magnitude 4.5. By 1950, it was magnitude 3.5. The faintest stars observable had become progressively invisible, not because instruments improved less, but because the sky itself had brightened."
  source: ""
  note: ""

- id: ch23-006
  type: date
  status: unverified
  text: "Suppose London in 1950 emits a total light power of $P = 1 10^ 12 $ watts (a reasonable estimate for a mid-sized city)."
  source: ""
  note: ""

- id: ch23-007
  type: date
  status: unverified
  text: "The Observatory's instruments, which could in 1900 reach magnitude 14 or 15 in favorable conditions (thirty times fainter than the naked eye limit), became useless because the sky itself was too bright."
  source: ""
  note: ""

- id: ch23-008
  type: date
  status: unverified
  text: "The blackout of 1939–1945 provided an accidental experiment."
  source: ""
  note: ""

- id: ch23-009
  type: date
  status: unverified
  text: "By 1948, it was clear that the Observatory's situation was dire."
