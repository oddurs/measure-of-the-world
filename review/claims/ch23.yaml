- id: ch23-013
  type: date
  status: unverified
  text: "The first major telescope at Herstmonceux was the 98-inch Isaac Newton Telescope (INT), completed in 1967."
  source: ""
  note: ""

- id: ch23-014
  type: superlative
  status: unverified
  text: "At the time, it was among the largest optical telescopes in the world."
