  note: ""

- id: ch23-010
  type: date
  status: unverified
  text: "In 1950, Spencer Jones submitted a report to the Admiralty Board: the Greenwich Observatory could no longer serve its primary purpose."
  source: ""
  note: ""

- id: ch23-011
