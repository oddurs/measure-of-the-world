  status: unverified
  text: "La Palma, the northwestern island of the Canaries, is located at $28^ 45'$ North latitude and an elevation of 2,396 meters."
  source: ""
  note: ""

- id: ch23-018
  type: measurement
  status: unverified
  text: "The site is remote, dark, and experiences excellent atmospheric seeing—often better than 1 arcsecond even under routine conditions."
