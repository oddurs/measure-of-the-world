  note: ""

- id: ch23-015
  type: measurement
  status: unverified
  text: "The seeing (the angular width of a point-like star image as distorted by atmospheric turbulence) was typically 1–2 arcseconds at Herstmonceux—much better than Greenwich but not approaching the $0.5–0.7$ arcsecond seeing achievable at the world's best mountain sites."
  source: ""
  note: ""

- id: ch23-016
  type: date
  status: unverified
  text: "The solution, undertaken in 1987, was more radical: to place the INT and other major instruments at an international site in the Canary Islands."
  source: ""
  note: ""

- id: ch23-017
