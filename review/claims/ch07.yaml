- id: ch07-018
  type: measurement
  status: corrected
  text: "At sea, skilled navigators using the method achieved accuracies on the order of 1–2 degrees—worse than the 30-nautical-mile standard, but sufficient for many purposes."
  source: "Royal Observatory Greenwich, Nevil Maskelyne, https://www.royalobservatorygreenwich.org/articles.php?article=1290 ; Nautical Almanac prefaces, https://archive.org/details/nauticalalmanac00admigoog"
  note: "Too pessimistic, and contradicts ch08. Maskelynes own preface says the tables were brought to a sufficient exactness to determine the longitude at sea within a Degree; the 1779 preface gives a typical combined error of about 50 minutes of longitude; Maskelynes St Helena voyage of 1761-62 gave results generally better than 1 degree. Half a degree to one degree, or 30 to 60 nautical miles, is the defensible range. Chapter 8 says plus or minus 0.5 degrees, so the two chapters disagree."

