  type: date
  status: verified
  text: "Timeline: 1828 - Board of Longitude formally dissolved; prizes system discontinued."
  source: "Nautical Almanack Act 1828 (9 Geo. 4 c. 66), https://www.legislation.gov.uk/ukpga/Geo4/9/66"
  note: "Correct. An Act for repealing the Laws now in force relating to the Discovery of the Longitude at Sea, royal assent 15 July 1828."

- id: ch07-031
  type: attribution
  status: corrected
  text: "Henry Gellibrand and others had attempted to map magnetic variation."
  source: "MacTutor, Henry Gellibrand, https://mathshistory.st-andrews.ac.uk/Biographies/Gellibrand/ ; Royal Museums Greenwich, Halleys 1702 world variation chart, https://www.rmg.co.uk/collections/objects/rmgc-object-540213"
  note: "Misattributed. Gellibrand did not map variation: in 1634 he discovered SECULAR variation, that declination changes over time, by comparing his Deptford measurement with Gunters twelve years earlier, and published A Discourse Mathematical on the Variation of the Magneticall Needle in 1635. The isogonic charts were Edmond Halleys, the Atlantic chart of 1701 and the world chart of 1702, the first published maps to use curves of equal magnetic variation. Halley is the right name here, and he is already a character in the chapter."

