- id: ch07-023
  type: date
  status: corrected
  text: "In the summer, with remarkable speed and unusually broad support, Parliament passed the Act; timeline entry 1714 (June): Longitude Act passes with overwhelming parliamentary support."
  source: "Royal Observatory Greenwich, The original copy of the 1714 Longitude Act, https://www.royalobservatorygreenwich.org/articles.php?article=1312"
  note: "The month is wrong. The bill passed the Commons on 3 July 1714, the Lords on 7 July, and received royal assent on 9 July 1714. The timeline entry should read 1714 (July). The bill was introduced on 16 June, which may be the source of the confusion."

- id: ch07-024
  type: measurement
  status: corrected
  text: "William Whiston and Humphry Ditton had submitted a proposal: use signal fires and rockets visible from heights of forty miles to communicate time across the ocean."
  source: "Whiston and Ditton, A New Method for Discovering the Longitude (1714), https://archive.org/details/bim_eighteenth-century_a-new-method-for-discove_whiston-william-ma_1714 ; Royal Museums Greenwich, https://www.rmg.co.uk/stories/time/projectors-pranks-perpetual-motion"
  note: "Wrong on every number. The scheme used unrigged hulls of ships moored at known stations, firing a shell timed to burst at 6,440 feet, the height a body falls in 20 seconds. The pamphlet states such a light would be visible about 100 measured, or 85 geographical miles, that is one whole degree. Forty miles appears nowhere. The distance was recovered from the flash-to-report interval, the bearing from the compass."

- id: ch07-025
  type: measurement
  status: corrected
  text: "The Act established three levels of achievement: 10,000 pounds for accuracy to 60 nautical miles at the end of a 6-week voyage, 15,000 for 40, 20,000 for 30."
  source: "1714 Longitude Act as printed in A Collection of all such Statutes (1755), https://archive.org/details/1714-longitude-act-1755-a-collection-of-all-such-statutes-and-pa ; Royal Observatory Greenwich, Transcripts of the 23 Longitude Acts, https://www.royalobservatorygreenwich.org/articles.php?article=1311"
  note: "The six-week voyage is not in the statute. The phrase six weeks appears nowhere in the 1714 Act, nor anywhere in the transcripts of all 23 Longitude Acts. What the Act requires is that a ship shall thereby actually sail over the Ocean, from Great-Britain to any Port in the West-Indies, as those Commissioners shall choose or nominate for the Experiment, without losing their Longitude beyond the Limits before mentioned, and that the method be tried and found practicable and useful at Sea. Half the reward was tied to keeping ships within eighty geographical miles of the shore. The six weeks is a popular gloss on the typical West Indies passage and should not be presented as a statutory condition. It appears three times in the chapter."

- id: ch07-026
  type: date
  status: corrected
  text: "Timeline: 1730 - Harrison completes H1 (first sea clock); Board provides modest funding."
  source: "Royal Museums Greenwich, Harrisons clocks and the longitude problem, https://www.rmg.co.uk/stories/time/harrisons-clocks-longitude-problem ; Royal Museums Greenwich object record, https://www.rmg.co.uk/collections/objects/rmgc-object-79139"
  note: "Wrong by five years. H1 was built between 1730 and 1735 and Harrison brought it to London in 1735. What happened in 1730 was that Harrison first came to London with his proposal, met Halley, and was sent on to George Graham. The Board provided no funding in 1730; its first payment, 500 pounds, was voted on 30 June 1737 after the Lisbon trial. This contradicts ch09, which says correctly that H1 was completed in 1735."

- id: ch07-027
  type: date
  status: verified
  text: "Timeline: 1736 - H1 tested at sea; performance promising but not meeting full Act requirements."
  source: "Royal Museums Greenwich, Harrisons clocks and the longitude problem, https://www.rmg.co.uk/stories/time/harrisons-clocks-longitude-problem"
  note: "Correct. H1 went out on HMS Centurion in May 1736 and returned on HMS Orford; Harrison corrected the ships landfall by about 60 miles. The Board met on 30 June 1737 and voted 500 pounds. Note the destination was Lisbon, which the chapter does not say and which ch09 gets wrong by adding a Jamaica voyage for H1."

- id: ch07-028
  type: measurement
  status: corrected
  text: "Timeline: 1772 - H5 tested before King George III; error of 4.5 seconds over ten weeks."
  source: "Antiquarian Horological Society, John Harrison, https://antiquarian-horology.com/john-harrison-3-4-1693-24-3-1776/ ; Science Museum Group, https://collection.sciencemuseumgroup.org.uk/objects/co8448183"
  note: "COULD NOT SOURCE the 4.5 seconds. The documented result of the ten weeks of daily observations by George III at Richmond between May and July 1772 is that the watch was accurate to within one third of one second per day. Over ten weeks that is roughly 23 seconds, not 4.5. Either quote the rate or find a source for the total."

- id: ch07-029
  type: measurement
  status: corrected
  text: "Timeline: 1773 - Board finally awards Harrison 4,400 pounds as a gift; Parliament subsequently awards additional 8,750 pounds."
  source: "Royal Observatory Greenwich, Transcripts of the 23 Longitude Acts, https://www.royalobservatorygreenwich.org/articles.php?article=1311 (Act 10 in that transcript, 13 Geo. 3 c. 77 s. XXIX, from Statutes at Large vol. 11 p. 839)"
  note: "The 4,400 pound Board gift could not be sourced and appears to be invented; nothing resembling it appears in the 1773 statute or in the transcripts of the 23 Longitude Acts. The 8,750 pounds is right but the attribution is backwards: it was awarded by Act of Parliament (13 Geo. 3 c. 77, section XXIX, marginal note Not exceeding 8750l. to be paid to Mr. Harrison for his invention of a Time-keeper), over the Boards head, not by the Board. Harrisons lifetime total from all grants was about 23,065 pounds; see Derek Howse, Britains Board of Longitude: The Finances 1714-1828, Mariners Mirror 84 (1998)."

