- id: ch07-001
  type: date
  status: corrected
  text: "In the spring of 1714, the House of Commons was seized by an unusual urgency."
  source: "Royal Observatory Greenwich, The original copy of the 1714 Longitude Act, https://www.royalobservatorygreenwich.org/articles.php?article=1312"
  note: "Loosely right on the season but wrong in emphasis. The Commons Journals record a petition on 25 May 1714, a committee report on 7 June, evidence from Newton, Halley, Cotes and Clarke considered on 11 June, the bill presented 16 June, first reading 17 June, second 22 June, committee of the whole 30 June, report 1 July, third reading and passage 3 July, Lords 7 July, royal assent 9 July 1714. The proceedings were concentrated in a few sittings, not day after day of witnesses."

- id: ch07-002
  type: measurement
  status: corrected
  text: "The Act offered the enormous sum of £20,000—equivalent to roughly twenty years' wages for a skilled tradesman—to anyone who could devise a method to determine longitude at sea to within 30 nautical miles."
  source: "Gregory Clark, The Condition of the Working-Class in England 1209-2004, Table 3, https://faculty.econ.ucdavis.edu/faculty/gclark/papers/Working%20Class.pdf ; Judy Stephenson, LSE Economic History Working Paper 231/2016, https://www.lse.ac.uk/asset-library/information/wp231.pdf"
  note: "BADLY WRONG, by a factor of about 30. A building craftsmans day wage in 1710-19 was 22.1 pence, giving roughly 23 to 28 pounds a year. Twenty thousand pounds is therefore about 700 to 850 years of a skilled tradesmans wages, not twenty. Even at the top London rates of 30 to 42 pence a day it is 450 to 650 years. This also contradicts ch01, which puts the sum at the annual salary of several thousand working people."

- id: ch07-003
  type: date
  status: verified
  text: "This was the Longitude Act of 1714, and it inaugurated a new era in which the British state explicitly offered incentives for technological innovation."
  source: "Royal Observatory Greenwich, Transcripts of the 23 Longitude Acts, https://www.royalobservatorygreenwich.org/articles.php?article=1311 ; 1714 Longitude Act as printed in A Collection of all such Statutes (1755), https://archive.org/details/1714-longitude-act-1755-a-collection-of-all-such-statutes-and-pa"
  note: "Correct. Both statute citations circulate: the Statutes at Large print it as 12 Anne St. 2 c. 15, the Statutes of the Realm as 13 Ann. c. 14. The chapters 12 Anne c. 15 is the Statutes at Large form and matches the printed Act."

- id: ch07-004
  type: attribution
  status: verified
  text: "The Act established three levels of achievement, each with corresponding rewards:"
  source: "1714 Longitude Act as printed in A Collection of all such Statutes (1755), https://archive.org/details/1714-longitude-act-1755-a-collection-of-all-such-statutes-and-pa ; Royal Observatory Greenwich, Transcripts of the 23 Longitude Acts, https://www.royalobservatorygreenwich.org/articles.php?article=1311"
  note: "Correct. The Act gives 10,000 pounds for a method accurate to one degree of a great circle or sixty geographical miles, 15,000 pounds for two thirds of that distance, and 20,000 pounds for one half of the same distance. The chapters 60, 40 and 30 nautical miles are the right equivalents. Note the Act says geographical miles, not nautical miles, and expresses the tiers as fractions of one degree rather than as absolute distances."

- id: ch07-005
  type: measurement
  status: verified
  text: "At the equator, where a degree of longitude spans exactly 60 nautical miles: MATH"
  source: "Definition: one nautical mile is one minute of arc of a great circle; 360 x 60 = 21,600"
  note: "Correct."

- id: ch07-006
  type: measurement
  status: corrected
  text: "For the lunar distance method (the astronomical approach), 30 nautical miles corresponds to requiring the Moon's position to be known to approximately 1 arcsecond precision."
  source: "Arithmetic: 30 nm = 0.5 deg of longitude = 2 min of time; Moon moves 0.549 deg/hour = 33 arcmin/hour"
  note: "WRONG by a factor of about 60. Two minutes of time at the Moons rate of motion corresponds to about 1 ARCMINUTE of lunar position, not 1 arcsecond. Chapter 8 states the arcminute figure correctly, so the two chapters contradict each other. One arcsecond in the Moons position would correspond to about half a nautical mile."

- id: ch07-007
  type: measurement
  status: corrected
  text: "For the chronometer approach, 30 nautical miles at the equator corresponds to a clock error of 2 minutes of time accumulated over a 6-week voyage—an error rate of roughly 0.5 seconds per day."
  source: "Arithmetic: 120 s over 42 days = 2.86 s/day; scripts/verify/derivations.py already checks 3 s/day over six weeks giving 31.5 nautical miles"
  note: "WRONG. Two minutes of time accumulated over six weeks is 2.86 seconds a day, conventionally quoted as three seconds a day. At 0.5 s/day the accumulated error over 42 days would be only 21 seconds, about 5 nautical miles, six times tighter than the Act required. The books own verification script uses 3 s/day for exactly this calculation. Separately, the six-week voyage is not in the Act; see ch07-025."

- id: ch07-008
  type: measurement
  status: unverified
  text: "Parliamentary testimony had established that navigational errors beyond 60 nautical miles posed unacceptable risks to merchant vessels and naval squadrons."
  source: ""
  note: "COULD NOT SOURCE. The 60 geographical mile figure in the Act is one degree of a great circle, a round unit rather than a risk threshold derived from testimony. Nothing in the Commons Journals summary of the 1714 proceedings supports the claim that testimony established this specific number as the limit of acceptable risk."

- id: ch07-009
  type: measurement
  status: corrected
  text: "The Moon moves approximately 0.5 degrees per hour through the celestial sphere."
  source: "Arithmetic: 360 deg / 27.3217 days sidereal month = 0.549 deg/hour; NASA Moon Fact Sheet"
  note: "The Moon moves 0.55 degrees an hour, about 33 arcminutes or roughly one lunar diameter, not 0.5. This books ch10 uses 0.55 correctly, so ch07 and ch08 contradict ch10. The 10 per cent error propagates into the arcsecond/arcminute claim in ch07-006 and into the error budget in ch08."

- id: ch07-010
  type: measurement
  status: unverified
  text: "Its drawback is computational burden: a complete calculation from raw sextant reading to longitude determination required 30 minutes of mental arithmetic using logarithms."
  source: "Royal Observatory Greenwich, Nevil Maskelyne, https://www.royalobservatorygreenwich.org/articles.php?article=1290"
  note: "COULD NOT SOURCE the 30 minute figure. What is documented is that before the Nautical Almanac Maskelyne himself took up to four hours over a lunar; after 1767 Maskelyne described the remaining work as an operation equal to that of an azimuth. The 30 minutes is widely repeated but no primary or scholarly attribution was found. Note the same figure recurs three times in ch08."

- id: ch07-011
  type: quotation
  status: unverified
  text: "Jupiter's Moons: When Galileo discovered the four large moons of Jupiter orbiting the planet, he recognized them as a celestial clock: the moons undergo regular eclipses, and the times of these eclipses depend only on Jupiter's true position, not on the observer's location."
  source: ""
  note: "The physics is garbled. What makes a Jovian satellite eclipse useful is that it is an event at Jupiter, so all observers on Earth see it at essentially the same instant apart from light time; what differs is the local clock time at which each observer sees it. Saying the times depend only on Jupiters true position, not on the observers location conflates these. The historical attribution to Galileo is sound but no source was checked for it here."

- id: ch07-012
  type: measurement
  status: corrected
  text: "Magnetic variation changes with location—in London it might be 12 degrees west of true north, while in Jamaica it might be 3 degrees east."
  source: "gufm1 historical field model via NOAA/NCEI declination calculator, https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml (Jackson, Jonkers and Walker 2000)"
  note: "London is roughly right for the 1720s but Jamaica is wrong. gufm1 gives London 7.5 deg W in 1700, 10.3 deg W in 1714 and 11.8 deg W in 1720; Kingston, Jamaica gives 5.0 deg E in 1700 and 5.3 deg E in 1714. Jamaica should be about 5 degrees east, not 3."

- id: ch07-013
  type: measurement
  status: verified
  text: "The Chronometer (Mechanical Clock): A sufficiently accurate clock, compared against a reference clock set to Greenwich time before departure, could directly yield longitude: the time difference multiplied by 15 degrees per hour gives the longitude difference."
  source: "Earth rotates 360 degrees in 24 hours, so 15 degrees per hour"
  note: "Correct."

- id: ch07-014
  type: date
  status: verified
  text: "The Board of Longitude, established by the 1714 Act, consisted of astronomers, naval officers, mathematicians, and royal officials."
  source: "1714 Longitude Act as printed in A Collection of all such Statutes (1755), https://archive.org/details/1714-longitude-act-1755-a-collection-of-all-such-statutes-and-pa ; Royal Observatory Greenwich, Transcripts of the 23 Longitude Acts, https://www.royalobservatorygreenwich.org/articles.php?article=1311"
  note: "Correct, and the Astronomer Royal was indeed ex officio: the Act names the Royal Astronomer of Greenwich among the standing commissioners, together with the Lord High Admiral or First Commissioner of the Admiralty, the Speaker of the Commons, the First Commissioner of the Navy, the First Commissioner of Trade, the Admirals of the Red, White and Blue Squadrons, the Master of Trinity House, the President of the Royal Society, and the Savilian, Lucasian and Plumian Professors. Quorum was five."

