- id: ch03-016
  type: quotation
  status: corrected
  text: "Most showed improvements of a factor of five to ten in precision compared to Tycho; Flamsteed's typical errors were in the range of ten to twenty arc-seconds, compared to Tycho's one to three arc-minutes."
  source: "Tycho's accuracy 'approaching one arcminute', University of Oxford, 'Hven, 1576-97: Tycho Brahe's observatory', https://www.cabinet.ox.ac.uk/hven-1576-97-tycho-brahes-observatory ; Flamsteed catalogue accuracy, Royal Observatory Greenwich article 1045"
  note: "Both halves overstated. Tycho's positional accuracy approached one arcminute; '1 to 3 arcminutes' inflates his error, and it makes Flamsteed's gain look larger than it was. 10-20 arcseconds against 60 arcseconds is a factor of about 4, not 'five to ten'. See ch02-018: the book gives five different figures for the same ratio across chapters 2, 3, 4 and 5."

