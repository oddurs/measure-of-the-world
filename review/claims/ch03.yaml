- id: ch03-001
  type: date
  status: unverified
  text: "On the afternoon of 22 June 1675, with the royal warrant signed and the site selected, John Flamsteed stood in the empty rooms of Flamsteed House and confronted a practical reality: he possessed almost nothing with which to observe the heavens."
  source: ""
  note: ""

- id: ch03-002
  type: superlative
  status: unverified
  text: "What he lacked was an instrument of his own design—something that would allow him to measure stellar positions with unprecedented accuracy, constrained only by the resolution of his eye and the steadiness of his hand."
  source: ""
  note: ""

- id: ch03-003
  type: date
  status: unverified
  text: "Tycho, observing from his private observatory Uraniborg on the Danish island of Hven from 1576 until his death in 1601, had measured the positions of approximately one thousand bright stars using a large mural quadrant mounted in the north-south meridian plane (the vertical plane running due north and south through the zenith, the point directly overhead)."
  source: ""
  note: ""

- id: ch03-004
  type: date
  status: unverified
  text: "But by 1675, Tycho's positions were known to be imperfect."
  source: ""
  note: ""

- id: ch03-005
  type: quotation
  status: unverified
  text: "And the accumulation of observations over decades had revealed systematic changes in stellar positions—effects like precession (the slow drift of the reference zero point of right ascension, the celestial coordinate system's starting position, at roughly 50 arc-seconds per year) and aberration (the apparent shift of star positions due to Earth's orbital motion, a phenomenon not fully understood until Bradley's work in the 1720s) that Tycho's measurements did not account for."
  source: ""
  note: ""

- id: ch03-006
  type: date
  status: unverified
  text: "Between 1689 and 1691, working with his principal assistant Abraham Sharp (one of the finest craftsmen-astronomers of the age), Flamsteed designed and constructed a new instrument: a mural arc (a quarter-circle of graduated metal) with a radius of nearly seven feet, mounted permanently in the meridian plane of Greenwich."
  source: ""
  note: ""

- id: ch03-007
  type: quotation
  status: unverified
  text: "But Flamsteed's design and the precision he achieved with it represented a major advance. , Chapter 4, provides a detailed technical description with reproductions of Flamsteed's working drawings.)"
  source: ""
  note: ""

- id: ch03-008
  type: quotation
  status: unverified
  text: "From the clock time, Flamsteed could calculate the star's right ascension (the celestial coordinate measuring the star's position east-west along the celestial equator, analogous to longitude on Earth) with a precision limited primarily by the clock's accuracy and the observer's reaction time, not by the resolution of an engraved scale."
  source: ""
  note: ""

- id: ch03-009
  type: quotation
  status: unverified
  text: "Thus, two coordinates could be obtained from a single observation: one limited by the clock's precision, the other by the arc's graduations and the eye's ability to read them."
  source: ""
  note: ""

- id: ch03-010
  type: quotation
  status: unverified
  text: "Each was a large long-case clock with a thirteen-foot pendulum, regulated by Huygens's principle of isochronous oscillation (the property that the pendulum's period remains constant regardless of oscillation amplitude, enabling consistent timekeeping)."
  source: ""
  note: ""

- id: ch03-011
  type: quotation
  status: unverified
  text: "( , pp. 45–60; also , the National Maritime Museum's conservation report on Tompion's clocks at Greenwich.)"
  source: ""
  note: ""

- id: ch03-012
  type: quotation
  status: unverified
  text: "A pendulum's period of oscillation—the time required for one complete swing—depends, to first approximation, on the pendulum's length and the gravitational acceleration: $T = 2 L/g $."
  source: ""
  note: ""

- id: ch03-013
  type: quotation
  status: unverified
  text: "Each clock at Greenwich had been adjusted and set to sidereal time (time measured by the stars' apparent rotation around the celestial pole, which runs at a constant rate, unlike the varying length of solar days due to Earth's elliptical orbit and axial tilt)."
  source: ""
  note: ""

- id: ch03-014
  type: attribution
  status: unverified
  text: "He established a routine: on clear nights, he would observe stars as they crossed the meridian, recording clock times and arc readings."
  source: ""
  note: ""

- id: ch03-015
  type: superlative
  status: unverified
  text: "The first years of observations revealed the power of his method."
  source: ""
  note: ""

- id: ch03-016
  type: quotation
  status: unverified
  text: "Most showed improvements of a factor of five to ten in precision compared to Tycho; Flamsteed's typical errors were in the range of ten to twenty arc-seconds, compared to Tycho's one to three arc-minutes."
  source: ""
  note: ""

- id: ch03-017
  type: quotation
  status: unverified
  text: "( , pp. 95–105, reproduces Flamsteed's own comparison of his early observations with Tycho's."
  source: ""
  note: ""

- id: ch03-018
  type: date
  status: unverified
  text: "Flamsteed's systematic program, ultimately consuming observation from 1676 to his death in 1719, would eventually produce positions for nearly 3,000 stars, many observed multiple times to check for systematic errors or to detect any changes in position (such as proper motion, though Flamsteed did not detect this effect)."
  source: ""
  note: ""

- id: ch03-019
  type: measurement
  status: unverified
  text: "Due to the precession of the Earth's spin axis, it moves slowly westward at a rate of roughly 50 arc-seconds per year."
  source: ""
  note: ""

- id: ch03-020
  type: superlative
  status: unverified
  text: "The mural arc and the transit method, supported by Tompion's precise clocks and enabled by careful reduction procedures, were producing a catalog of star positions of unprecedented accuracy."
  source: ""
  note: ""

- id: ch03-021
  type: quotation
  status: unverified
  text: "The next chapter traces Flamsteed's steady progress through the first decades of the 18th century, the accumulation of observations, the computational challenges of reducing them into a coherent catalog, and the bitter controversy with Isaac Newton and Edmond Halley over the publication of Flamsteed's work before he deemed it complete."
  source: ""
  note: ""
