- id: ch03-018
  type: date
  status: verified
  text: "Flamsteed's systematic program, ultimately consuming observation from 1676 to his death in 1719, would eventually produce positions for nearly 3,000 stars, many observed multiple times to check for systematic errors or to detect any changes in position (such as proper motion, though Flamsteed did not detect this effect)."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045 ; Flamsteed died 31 December 1719"
  note: "Supported. Flamsteed died on 31 December 1719 and the last mural-arc observation was on 27 December 1719; the printed catalogue holds 2,935 stars, so 'nearly 3,000' is fair; over 28,000 observations were made with the arc alone. The parenthetical about proper motion is right for Flamsteed, whose data Halley later used to detect it."

