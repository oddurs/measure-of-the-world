- id: ch03-101
  type: measurement
  status: corrected
  text: "The human eye, under good light conditions, can resolve features separated by roughly one arc-minute---about the angular width of a grain of wheat held at arm's length."
  source: "One arcminute subtended at arm's length, about 60 centimetres, corresponds to 0.17 millimetres; a grain of wheat is roughly 3 millimetres across, which subtends about 17 arcminutes at the same distance"
  note: "The resolution figure of about one arcminute is right; the illustration is wrong by a factor of roughly twenty. One arcminute at arm's length is about a sixth of a millimetre, the thickness of a sheet of paper seen edge-on, not the width of a grain of wheat. Chapter 4 gives a different and much worse figure for the same quantity, claiming the eye 'could resolve perhaps one or two arcseconds'; the two chapters need reconciling on the correct value."

- id: ch03-102
  type: attribution
  status: corrected
  text: "He had inherited some transit instruments from earlier observers, useful but not the precision instrument he envisioned."
  source: "Royal Observatory Greenwich, 'Private Patronage', https://www.royalobservatorygreenwich.org/articles.php?article=961 ; Royal Museums Greenwich, 'The founding of the Royal Observatory'"
  note: "There were no earlier observers and nothing to inherit. Greenwich was a new foundation on the site of the old castle; the warrant of 22 June 1675 made no provision for instruments at all. Everything Flamsteed had at the start came from Jonas Moore's own pocket in 1676, or from his own purse thereafter. The first true transit instrument at Greenwich came much later."

- id: ch03-103
  type: measurement
  status: unverified
  text: "The arc was finely graduated to perhaps one quarter of an arc-minute, and Tycho's skilled assistants could read it to interpolations placing uncertainty at roughly one arc-minute."
  source: ""
  note: "Could not source the quarter-arcminute graduation. The reading uncertainty of about one arcminute is supported. Tycho's instruments used transversal dot scales, which is the mechanism by which sub-division readings were obtained, and that is the fact worth stating; a page reference to Chapman, Dividing the Circle, chapter 4, or to Dreyer would settle it."

- id: ch03-104
  type: measurement
  status: unverified
  text: "Tompion's clocks achieved an accuracy of roughly ten to fifteen seconds per day---more than a hundred times better than the foliot and verge escapement clocks that had preceded them."
  source: "Royal Museums Greenwich, 'Year-Going Clock', https://www.rmg.co.uk/collections/objects/rmgc-object-202113 ; Royal Observatory Greenwich, 'Decoding Flamsteed', https://www.royalobservatorygreenwich.org/articles.php?article=1381"
  note: "The book gives four incompatible figures for the same two clocks: ten to fifteen seconds a day here and in chapter 2, 'a few seconds per day' in chapter 4, and plus or minus 5 seconds in chapter 6's table. Royal Museums Greenwich claims two seconds a day. Flamsteed's own records, as analysed in the Royal Observatory Greenwich study of his clock work, show one clock losing 8 seconds at a winding on 9 October 1676 and the two Octagon Room clocks differing from each other by between 6 seconds and over a minute between October and December 1676, which suggests the day-to-day performance was worse than any of these figures. Pick one figure, cite it, and use it in all four places. The hundredfold comparison with verge clocks is of the right order but also uncited."

- id: ch03-105
  type: measurement
  status: verified
  text: "The effect increases dramatically near the horizon, reaching approximately 35 arc-minutes at the horizon itself."
  source: "Standard mean atmospheric refraction at the horizon, about 34 to 35 arcminutes"
  note: "Correct, and consistent with chapter 8, which also gives about 35 arcminutes at the horizon. Chapter 4's refraction figure caption contradicts both, claiming refraction near the horizon merely 'exceeds five arcminutes'. Chapter 4 is the one that needs fixing."
