- id: ch01-004
  type: quotation
  status: verified
  text: "The declination $ $ is the Sun's angular distance north ($+$) or south ($-$) of the celestial equator, measured in degrees; at the moment of meridian transit (the instant when the Sun crosses the observer's meridian, also called true solar noon), the relationship is:"
  source: "Standard meridian-altitude latitude relation; consistent with the transit geometry set out in Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045"
  note: "The formula phi = delta + (90 deg - h_sun) is correct, but ONLY when the Sun transits south of the observer's zenith. North of the zenith the sign of the zenith distance reverses and the formula becomes phi = delta - (90 deg - h_sun). The chapter states the relation without that restriction. Recommend adding the caveat."

