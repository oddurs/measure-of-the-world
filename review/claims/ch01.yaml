- id: ch01-101
  type: measurement
  status: corrected
  text: "A careful observer ... can achieve latitude accurate to within one degree, the apparent diameter of the full Moon."
  source: "Mean apparent angular diameter of the Moon, about 31 arcminutes, ranging roughly 29.4 to 33.5 arcminutes"
  note: "The Moon is about HALF a degree across, not one degree. Either change the comparison to half a degree of latitude, or keep one degree and compare it to twice the Moon's diameter."

- id: ch01-102
  type: measurement
  status: corrected
  text: "Polaris, which lies within about 1 degree of the true pole in the epoch of the 17th century"
  source: "Computed by precessing the Polaris J2000 position (02h 31m 49.09s, +89d 15m 50.8s, proper motion 44.48 and -11.85 milliarcseconds per year) with the IAU 1976 precession angles; cross-checked against the known 1900.0 declination of +88d 46m, which the same computation reproduces"
  note: "Wrong by a factor of about two and a half. Polaris was 2 deg 52 arcmin from the pole in 1600, 2 deg 27 arcmin in 1675, 2 deg 18 arcmin in 1700 and 2 deg 16 arcmin at the time of the Scilly wreck in 1707. It did not come within one degree of the pole until the late nineteenth century. This matters: the Polaris correction a seventeenth-century navigator had to apply was of order two and a half degrees, which is the whole reason regiment-of-the-pole-star tables existed."

- id: ch01-103
  type: measurement
  status: corrected
  text: "Delta lambda = integral of v cos(theta) dtau (eastward component); Delta phi = integral of v sin(theta) dtau (northward component)"
  source: "Standard plane-sailing relations: with heading measured clockwise from north, northing = v cos(theta) and easting = v sin(theta); departure converts to difference of longitude by dividing by the cosine of the latitude"
  note: "The two components are SWAPPED. A compass heading is measured clockwise from north, so the northward component is v cos(theta) and the eastward component is v sin(theta), the reverse of what the chapter prints. There is a second error: the left-hand side of the first equation is Delta lambda, an ANGLE, but the right-hand side is a distance. Departure must be divided by cos(phi) to become a difference of longitude. As printed the equations are dimensionally inconsistent."

- id: ch01-104
  type: attribution
  status: corrected
  text: "The court of inquiry that followed found nobody obviously at fault ... The court of inquiry concluded that no one was obviously at fault."
  source: "Scilly naval disaster of 1707: only the officers of HMS Firebrand faced a court martial, a formality, and were acquitted; the commanding officers of Association, Eagle and Romney all died"
  note: "There was no court of inquiry into the disaster. The only proceeding was the pro forma court martial of the surviving Firebrand officers, who were acquitted. No inquiry was held into the other three ships because their commanders had drowned. The claim appears twice in chapter 1, in the opening vignette and in item 5 of the disaster list, and both need rewriting."

