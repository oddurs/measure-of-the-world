- id: ch01-106
  type: date
  status: corrected
  text: "1591: the Sao Thome. Portuguese galleon bound for India struck the coast near Sumatra and sank. The crew believed themselves to be six hundred nautical miles to the east. The ship carried nine hundred and forty-four people; fewer than two hundred survived."
  source: "The nau Sao Thome, captained by Dom Paulo de Lima, foundered off the Terra dos Fumos, southern Mozambique, in March 1589; the wreck narrative was written by Diogo do Couto in 1611 and printed in the Historia Tragico-Maritima"
  note: "Four errors in one entry. The year was 1589, not 1591. The ship was HOMEWARD BOUND from India, not bound for India. She was lost off south-east Africa, off southern Mozambique near the Natal-Tongaland coast, not near Sumatra. And the survivors who eventually reached Mozambique Island in July 1593, ninety-one Portuguese and sixty-five Asian slaves, do not match the figures given. The complement of 944 and the 600-nautical-mile misreckoning could not be sourced at all."

- id: ch01-107
  type: date
  status: corrected
  text: "1615: the Eendracht. Dutch East Indiaman, separated from her convoy in the Indian Ocean, made unexpected landfall on the coast of Western Australia. The ship was lost, but the accidental discovery added an entire continent to European geographic knowledge."
  source: "Dirk Hartog and the Eendracht: landfall at what is now Dirk Hartog Island, Shark Bay, on 25 October 1616; the ship reached Batavia on 14 December 1616. Western Australian Museum and National Museum of Australia accounts of the 1616 landing and the Hartog plate"
  note: "The ship was NOT lost. Dirk Hartog's Eendracht made landfall on 25 October 1616, left the inscribed pewter plate at Cape Inscription, then sailed on and reached Batavia safely on 14 December 1616. The date is also wrong: 1616, not 1615 (1615 is the year the ship was built and Hartog appointed her master). Since the ship survived, the entry does not belong in a catalogue of maritime losses at all, though it is a good illustration of longitude error."

- id: ch01-108
  type: date
  status: corrected
  text: "1656: the Tryall. English East Indiaman struck rocks off Western Australia, having misjudged her longitude severely. Forty men survived on a desolate island; only a handful were ever rescued."
  source: "Tryall, English East India Company, wrecked on the Tryal Rocks off the Montebello Islands, Western Australia, on the evening of 25 May 1622 under Captain John Brooke; Western Australian Museum maritime archaeology record"
  note: "Wrong year and wrong outcome. The Tryall was wrecked on 25 May 1622, not 1656; she is Australia's oldest known shipwreck. More than ninety men died, but the survivors were not marooned: Brooke and nine men took the skiff, the factor Thomas Bright and thirty-five others took the longboat and spent seven days on the Montebello Islands before sailing to Java, and forty-four survivors reached Bantam on 21 June 1622. 'Only a handful were ever rescued' is false."

- id: ch01-109
  type: date
  status: corrected
  text: "1691. A squadron of English ships, attempting to make port at Plymouth in fog, struck rocks near the English coast. Five ships lost; the incident provoked outrage in Parliament and naval circles."
  source: "Loss of HMS Coronation off Rame Head and HMS Harwich off Mount Edgcumbe, 3 September 1691, in a south-south-east gale while the fleet bore up for Plymouth Sound; about 900 killed"
  note: "Two ships were lost, not five. On 3 September 1691 the Coronation was dismasted and wrecked off Rame Head with about 600 dead and roughly twenty survivors, and the Harwich was wrecked off Mount Edgcumbe; eleven ships of the line were driven ashore under Mount Edgcumbe but only the Harwich was a total loss. The cause was a full gale, not fog, and not a longitude error: the fleet bore up for Plymouth Sound precisely because it knew it was near the Eddystone. This entry does not support the chapter's thesis and should either be recast honestly as a storm loss or removed."
