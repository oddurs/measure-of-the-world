- id: ch01-001
  type: date
  status: verified
  text: "The fog rolled across the Atlantic in October 1707, thick as wool. hms Association, the flagship of Admiral Sir Cloudesley Shovell, cut through black water with the English fleet returning from Gibraltar—weeks at sea, the navigators' calculations checked and rechecked, the officers confident they had a safe margin west of the Scilly Isles."
  source: "Royal Museums Greenwich, collection object RMGC-140657 'Sir Cloudesly Shovel in the Association with the Eagle, Rumney and the Firebrand, Lost on the Rocks of Scilly, October 22, 1707', https://www.rmg.co.uk/collections/objects/rmgc-object-140657"
  note: "Date, flagship, admiral and the return from Gibraltar after the Toulon expedition all check out. The ships struck at about 8 p.m. on 22 October 1707 (Old Style). Note that modern scholarship attributes the fleet's error principally to LATITUDE, not longitude: the surviving log evidence has the fleet 'much to ye Northward of what was expected', compounded by charts placing Scilly up to 15 nautical miles north of its true position. The chapter's framing of the wreck as a pure longitude failure overstates the case."

- id: ch01-002
  type: date
  status: corrected
  text: "(The most detailed account of the disaster is from the Weekly Journal of 3 November 1707 and the court of inquiry transcript, preserved in Admiralty Records."
  source: "Library of Congress catalogue record for 'The Weekly Journal, or, Saturday's Post' (London, 1716-1725), https://www.loc.gov/item/2014218664/ ; Wikipedia/DNB on Nathaniel Mist (lead only, confirmed by LoC holdings)"
  note: "FABRICATED SOURCE. Two errors. (1) No 'Weekly Journal' existed in 1707. The Weekly Journal, or Saturday's Post was founded by Nathaniel Mist on 15 December 1716, nine years after the wreck; it became Mist's Weekly Journal in May 1725. There can be no issue of 3 November 1707. (2) There was no general court of inquiry. Only the officers of the Firebrand were court-martialled, as a formality, and were acquitted; the commanding officers of the other three lost ships all died, so no inquiry into them was held. The footnote should be replaced with the surviving Admiralty and log evidence, e.g. the sources catalogued by Royal Museums Greenwich, and with W. E. May's study of the last voyage."

