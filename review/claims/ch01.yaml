- id: ch01-006
  type: date
  status: verified
  text: "In 1714, less than seven years after Shovell's death, Parliament passed the Longitude Act, offering a prize of £20,000—a sum equivalent to the cost of a large warship or the annual salary of several thousand working people—to anyone who could devise a method of determining longitude at sea to within thirty nautical miles."
  source: "Royal Observatory Greenwich, 'Transcripts of the 23 Longitude Acts', https://www.royalobservatorygreenwich.org/articles.php?article=1311"
  note: "The 20,000 pound top prize and the half-degree threshold are correct. The Act set three tiers: 10,000 pounds for one degree of a great circle (sixty geographical miles), 15,000 pounds for two thirds of that distance, and 20,000 pounds for one half of it, i.e. thirty geographical miles. Half the money was payable only after a trial voyage to the West Indies. The chapter quotes the top tier alone, which is defensible but reads as if a single threshold applied; consider naming the tiers."

- id: ch01-007
  type: date
  status: corrected
  text: "(The Longitude Act of 1714 (12 Anne c. 15) established the Board of Longitude in perpetuity."
  source: "Royal Observatory Greenwich, 'Longitude Acts', https://www.royalobservatorygreenwich.org/articles.php?article=1309 (Board 'dissolved by Act of Parliament in 1828')"
  note: "'In perpetuity' is wrong. The Board of Longitude was dissolved by Act of Parliament in 1828. The 1714 Act named 24 commissioners rather than constituting a standing body, and the commissioners did not meet formally until 1737. On the citation: the Act is traditionally cited 12 Anne, Stat. 2, c. 15 and under modern short-title practice 13 Ann. c. 14; 12 Anne c. 15 without the statute number is incomplete."

- id: ch01-008
  type: quotation
  status: verified
  text: "The astronomers believed the answer lay in the heavens—that careful observation of the Moon's motion against the stars, or the motion of Jupiter's moons, could provide a time signal that would propagate across the ocean in the form of ephemerides and tables."
  source: "Royal Observatory Greenwich, 'Longitude Acts', https://www.royalobservatorygreenwich.org/articles.php?article=1309 ; Royal Museums Greenwich, 'The founding of the Royal Observatory', https://www.rmg.co.uk/stories/space-astronomy/curatorial/founding-royal-observatory"
  note: "The two astronomical proposals, lunar distance and the eclipses of Jupiter's satellites, are correctly described. The Greenwich foundation was itself prompted by the Sieur de St Pierre's lunar proposal of December 1674."

- id: ch01-009
  type: date
  status: verified
  text: "The Royal Observatory at Greenwich, founded in 1675 by Charles II, had been established in part to lay the groundwork for astronomical solutions."
  source: "Royal Observatory Greenwich, 'Royal Warrants', https://www.royalobservatorygreenwich.org/articles.php?article=909 ; warrant text at https://www.royalobservatorygreenwich.org/articles.php?article=977"
  note: "Founded 1675 by Charles II is correct. The founding instrument is the warrant of 22 June 1675 authorising construction; its stated purpose is 'the finding out of the longitude of places for perfecting navigation and astronomy'."

- id: ch01-010
  type: quotation
  status: corrected
  text: "(Charles II's warrant of 4 March 1675 is the founding document; excerpts appear in Howse, Greenwich Observatory: A History, vol. 1. Flamsteed's *Historia Coelestis Britannica* (1725) was the first major output to feed the astronomical solution to longitude.) The observations that would enable lunar distance tables were only just beginning to accumulate, gathered by John Flamsteed with laborious care."
  source: "Royal Observatory Greenwich, 'Royal Warrants', https://www.royalobservatorygreenwich.org/articles.php?article=909 ; text of the building warrant, https://www.royalobservatorygreenwich.org/articles.php?article=977"
  note: "Two errors. (1) The warrant of 4 March 1675 is NOT the founding document: it appointed Flamsteed 'our astronomical observator' and authorised his salary. The founding document is the SECOND warrant, of 22 June 1675, which ordered a small observatory to be built in Greenwich Park. Chapter 2 states this correctly, so chapter 1 contradicts chapter 2. (2) Calling the Historia Coelestis Britannica of 1725 'the first major output' is doubtful: Halley's unauthorised 'Historia Coelestis' of 1712 appeared first, and Flamsteed's observations had been circulating in manuscript for decades."

