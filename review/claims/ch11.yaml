- id: ch11-005
  type: attribution
  status: corrected
  text: "He measured star positions using the meridian method, identical to Flamsteed's technique: determining when each star crossed the meridian and recording its altitude above the horizon."
  source: "Verbunt and van Gent, Early star catalogues of the southern sky, A and A 530 (2011) A93"
  note: "MUST FIX. Halley did not use Flamsteed's meridian method. Persistent bad weather stopped him making the planetary observations he needed to fix the obliquity, so he fell back on measuring the ANGULAR DISTANCE of each southern star from stars in Tycho Brahe's catalogue, keeping Brahe's ecliptic positions. That is a different technique with a different error structure, and it is why his catalogue's errors are dominated by errors in Brahe's reference stars."

- id: ch11-006
  type: date
  status: corrected
  text: "The Catalogus Stellarum Australium, published in 1679, contained 341 stars observed with sufficient precision to fix their positions to within a minute of arc."
  source: "Verbunt and van Gent, Early star catalogues of the southern sky, A and A 530 (2011) A93"
  note: "The 341 stars and the 1679 publication are right. The accuracy claim is not: comparison against Hipparcos gives error distributions about 3 ARCMINUTES wide, made up of a systematic sextant deviation rising to 2 arcmin at 60 degrees plus random errors of 0.7 arcmin. Within a minute of arc describes only the random component. SEPARATE MUST-FIX IN THE SAME PARAGRAPH: the chapter says the most brilliant southern stars were absent from his sample, victims of cloud cover. That is backwards. The bad weather made Halley SKIP the faint stars of Piscis Austrinus and all of Indus precisely so as to keep the brighter, more important stars. Canopus, Achernar, Alpha Centauri and Fomalhaut are all in the catalogue. Also: he observed for just over a year, roughly February 1677 to February 1678, not a nine-month sojourn."

