- id: ch11-011
  type: date
  status: corrected
  text: "It would not be fully exploited until the transits of Venus in 1761 and 1769, more than eighty years later."
  source: "Halley, Methodus singularis, Philosophical Transactions 29 (1716), 454-464; Halley, De visibili conjunctione inferiorum planetarum cum Sole, Philosophical Transactions 17 (1691), 511-522"
  note: "The interval is right measured from 1677 (84 years), but the footnote it hangs on cites Halley1693 for the method paper, and there is no 1693 method paper. Halley set out the transit method in a paper read to the Society on 23 September 1691 and published it in refined form in 1716 as Methodus singularis, Philosophical Transactions 29, 454-464. MUST FIX the bibliography entry Halley1693 (A Method of Determining the Parallax of the Sun, Phil Trans 18, 1-14), which is fabricated: those volume and page numbers belong to no such paper."

- id: ch11-012
  type: date
  status: corrected
  text: "Halley's observation of Mercury's transit in 1677 confirmed the feasibility of the method."
  source: "Transit of Venus historical record of the 1677 Mercury transit; Halley, Methodus singularis (1716)"
  note: "MUST FIX, the opposite of what happened. The 1677 Mercury transit did not confirm the feasibility of the method. Halley was disappointed: only Richard Towneley at Burnley made another usable observation, and Gallet at Avignon recorded merely that the transit had occurred. The solar parallax of 45 arcseconds that came out of the comparison was one Halley did not accept. The episode taught him that the method needed many coordinated observers, which is the argument he made in 1691 and 1716."

