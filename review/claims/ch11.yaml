  note: ""

- id: ch11-019
  type: date
  status: unverified
  text: "He estimated that Jupiter's perturbation could delay the 1757 return by as much as several months."
  source: ""
  note: ""

- id: ch11-020
  type: date
  status: unverified
  text: "Halley's prediction: the comet would return around 1758, give or take a few months."
  source: ""
  note: ""

- id: ch11-021
  type: date
  status: unverified
  text: "He published this prediction in 1705, in a paper that amounted to a challenge to future astronomers."
  source: ""
  note: ""

- id: ch11-022
  type: date
  status: unverified
  text: "When the comet returned in December 1758—nearly precisely as he had foreseen—Halley had been deceased for fourteen years."
  source: ""
  note: ""

- id: ch11-023
  type: date
  status: unverified
  text: "Between 1698 and 1700, he commanded the naval vessel HMS Paramour on two voyages dedicated to measuring magnetic variation at numerous ocean locations."
