  note: "No source found that assigns 150-plus observers at 77 locations to the 1761 and 1769 transits jointly. Figures of that order are usually quoted for 1769 alone; 1761 is generally given as roughly 120 observers at about 60 stations. Split the two transits or drop the numbers."

- id: ch11-034
  type: superlative
  status: unverified
  text: "The coordination of this observational campaign—the first truly international scientific project—represented an unprecedented institutional achievement."
