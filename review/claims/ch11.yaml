  note: ""

- id: ch11-026
  type: superlative
  status: unverified
  text: "Using these records—which gave the number of deaths by age for a large population—Halley constructed the first life table: a systematic table showing, for each age, the fraction of a birth cohort that could be expected to survive to that age."
  source: ""
  note: ""

- id: ch11-027
  type: date
  status: unverified
  text: "Edmond Halley died in 1742 at age eighty-five, having served as Astronomer Royal and superintendent of the Royal Observatory."
  source: ""
  note: ""

- id: ch11-028
  type: superlative
  status: unverified
  text: "His contributions spanned from the discovery of stellar proper motion (comparing ancient star catalogs with his own observations, he noticed that some bright stars had shifted positions slightly—the first demonstration that stars are not fixed) to foundational work in oceanography, magnetism, and actuarial mathematics."
  source: ""
  note: ""

- id: ch11-029
  type: date
  status: unverified
  text: "This ambition would be realized in the great international collaborations of 1761 and 1769, when astronomers from every scientific nation coordinated observations of Venus's transit from locations spanning the globe."
