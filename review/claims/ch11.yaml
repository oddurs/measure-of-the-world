- id: ch11-001
  type: date
  status: corrected
  text: "In November 1676, the nineteen-year-old Edmond Halley boarded a ship bound for the South Atlantic."
  source: "Verbunt and van Gent, Early star catalogues of the southern sky, Astronomy and Astrophysics 530 (2011) A93, https://arxiv.org/abs/1104.0946; Ian Ridpath, Star Tales, Edmond Halley's southern star catalogue, http://www.ianridpath.com/startales/halley.html"
  note: "MUST FIX. Halley was TWENTY, not nineteen. He was born on 29 October 1656 and sailed from London in late October or early November 1676, so he had just turned twenty. Verbunt and van Gent state it plainly: Halley was 20 years and a bachelor student when he left."

- id: ch11-002
  type: date
  status: corrected
  text: "Born in 1656, the son of a wealthy London merchant, he possessed both mathematical training and the means to pursue it."
  source: "Ian Ridpath, Star Tales, Edmond Halley's southern star catalogue; Alan Cook, Edmond Halley: Charting the Heavens and the Seas (Oxford: Clarendon Press, 1998)"
  note: "Born 1656, correct. His father was a wealthy soap-boiler and salter in London rather than a merchant in the general sense; he paid for the St Helena instruments. Worth making specific."

- id: ch11-003
  type: date
  status: corrected
  text: "Accompanied by a servant and equipped with the finest instruments available—including a telescope and a precision pendulum clock—Halley was to observe the transit of Mercury predicted for 1677 and to construct a catalog of southern stars for comparison with Flamsteed's northern measurements."
  source: "Ian Ridpath, Star Tales, Edmond Halley's southern star catalogue"
  note: "The instrument list is wrong. Halley took a large sextant with telescopic sights, a smaller quadrant and several refracting telescopes, all bought by his father. No precision pendulum clock is recorded. The transit of Mercury was indeed one of three 1677 events (a solar eclipse, a lunar eclipse and the transit) he went south partly to catch."

- id: ch11-004
  type: date
  status: verified
  text: "(Flamsteed's catalog of northern stars, the Historia Coelestis Britannica, would not be published until 1725, but by 1676 Flamsteed had completed his observations and shared results with interested Fellows of the Society."
  source: "John Flamsteed, Historia Coelestis Britannica (London, 1725)"
