- id: ch11-001
  type: date
  status: unverified
  text: "In November 1676, the nineteen-year-old Edmond Halley boarded a ship bound for the South Atlantic."
  source: ""
  note: ""

- id: ch11-002
  type: date
  status: unverified
  text: "Born in 1656, the son of a wealthy London merchant, he possessed both mathematical training and the means to pursue it."
  source: ""
  note: ""

- id: ch11-003
  type: date
  status: unverified
  text: "Accompanied by a servant and equipped with the finest instruments available—including a telescope and a precision pendulum clock—Halley was to observe the transit of Mercury predicted for 1677 and to construct a catalog of southern stars for comparison with Flamsteed's northern measurements."
  source: ""
  note: ""

- id: ch11-004
  type: date
  status: unverified
  text: "(Flamsteed's catalog of northern stars, the Historia Coelestis Britannica, would not be published until 1725, but by 1676 Flamsteed had completed his observations and shared results with interested Fellows of the Society."
  source: ""
  note: ""

- id: ch11-005
  type: attribution
  status: unverified
  text: "He measured star positions using the meridian method, identical to Flamsteed's technique: determining when each star crossed the meridian and recording its altitude above the horizon."
  source: ""
  note: ""

- id: ch11-006
  type: date
  status: unverified
  text: "The Catalogus Stellarum Australium, published in 1679, contained 341 stars observed with sufficient precision to fix their positions to within a minute of arc."
  source: ""
  note: ""

- id: ch11-007
  type: measurement
  status: unverified
  text: "A modern reanalysis comparing Halley's positions with modern star catalogs shows systematic accuracy within 1–2 arcminutes for his best observations.)"
  source: ""
  note: ""

- id: ch11-008
  type: date
  status: unverified
  text: "Among Halley's observations at St. Helena was a transit of Mercury in November 1677—an event he captured with careful measurement of timing and geometry."
  source: ""
  note: ""

- id: ch11-009
  type: quotation
  status: unverified
  text: "If two observers simultaneously measure the transit from widely separated locations, and if they accurately record the times at which the planet enters and exits the Sun's disk, then the parallactic shift—the difference in the event's geometry as viewed from different locations—reveals the planet's distance."
  source: ""
  note: ""

- id: ch11-010
  type: quotation
  status: unverified
  text: "If the two positions are separated by a baseline $B = |AB|$ (comparable to Earth's radius), the baseline produces an apparent shift in the planet's position across the solar disk."
  source: ""
  note: ""

- id: ch11-011
  type: date
  status: unverified
  text: "It would not be fully exploited until the transits of Venus in 1761 and 1769, more than eighty years later."
  source: ""
  note: ""

- id: ch11-012
  type: date
  status: unverified
  text: "Halley's observation of Mercury's transit in 1677 confirmed the feasibility of the method."
  source: ""
  note: ""

- id: ch11-013
  type: date
  status: unverified
  text: "But the next Venus transit would not occur until 1761—decades after his death."
  source: ""
  note: ""

- id: ch11-014
  type: date
  status: unverified
  text: "In 1682, a bright comet appeared in the sky—the comet now bearing his name."
  source: ""
  note: ""

- id: ch11-015
  type: date
  status: unverified
  text: "Halley selected three good observations from different nights during the comet's 1682 apparition and applied the methods of orbital mechanics."
  source: ""
  note: ""

- id: ch11-016
  type: quotation
  status: unverified
  text: "With the orbital elements in hand, Halley could compute the orbital period using Kepler's third law: MATH where $G$ is the gravitational constant and $M_ $ is the Sun's mass."
