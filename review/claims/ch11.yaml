  text: "To illustrate the method of transit parallax and its application to determining the solar distance, consider the Venus transit of 1761."
  source: "Sigismondi and Oliveira, Transits of Venus and the Astronomical Unit; recomputed"
  note: "MUST FIX, the whole worked example is invented. Two specific breakages. First, Tobolsk at 68.2 degrees east is 4h 33m ahead of Greenwich, not 3h, so a local contact at 08:41:06 is 04:08 GMT, not 05:41:06, and the 19.3-minute difference the example is built on is an artefact of the wrong conversion. Second, contact-time differences between stations in a real Venus transit are minutes, not nineteen minutes. Either rebuild the example from published 1761 contact timings or drop it."

- id: ch11-031
  type: superlative
  status: unverified
  text: "Halley predicted (and his intellectual successors confirmed) that integration of data from many such observations, distributed across the globe, would yield a measurement of $ _ $ to unprecedented precision."
  source: ""
  note: "Vague and unfalsifiable as written. In fact the 1761 results did NOT converge: derived parallaxes ranged from about 8.3 to 10.6 arcseconds, which is why the 1769 transit was mounted."

- id: ch11-032
  type: date
  status: corrected
  text: "The actual 1761 transit observations, conducted by expeditions to locations including Nortonshire (England), Tobolsk, and Nandi Island (Polynesia), yielded a solar parallax of approximately $8.76$ arcseconds, corresponding to an astronomical unit of: MATH remarkably close to the modern value of $3.496 10^9$ km (or $1.496 10^ 11 $ m in SI units)."
  source: "Sigismondi and Oliveira, Transits of Venus and the Astronomical Unit; recomputed; modern solar parallax 8.794148 arcsec and 1 AU = 1.495979e8 km"
  note: "THE WORST ERROR IN CHAPTER 11, four separate faults in one sentence. (1) Nortonshire is not an English county and never was; there is no such place. (2) There was no 1761 station called Nandi Island in Polynesia; the actual 1761 stations include St Helena (Maskelyne), the Cape of Good Hope (Mason and Dixon), Tobolsk (Chappe d'Auteroche), Rodrigues (Pingre), Madras and St John's Newfoundland (Winthrop). Given that verification of the appendices turned up a person who does not exist, two places that do not exist should be treated as the same defect. (3) 206265/8.76 = 23,546 is a number of EARTH RADII, not astronomical units; calling the astronomical unit 23,540 AU is self-referentially absurd. (4) 23,546 Earth radii is 1.50e8 km, and the modern AU is 1.496e8 km, so the chapter's modern value of 3.496e9 km is wrong by a factor of 23.4 and contradicts its own parenthesis in the same line, which gives 1.496e11 m. The identical unit error appears earlier in the chapter (206265/8.8 approx 23,440 AU approx 3.5e9 km). The formula above them, d_sun = 1 AU / sin(pi_sun), is also wrong: the correct relation is d_sun = R_Earth / sin(pi_sun). Fix all of it. Also: the 8.76 arcsec figure is not the 1761 result; the 1761 analyses scattered between about 8.3 and 10.6 arcseconds, and 8.78 comes from Hornsby's 1771 reduction of the 1769 transit."

