- id: ch11-018
  type: quotation
  status: corrected
  text: "He noted that Jupiter's mass is roughly $1/1000$ of the Sun's mass, and that the gravitational force on the comet from Jupiter (when at moderate distance) is therefore comparable in magnitude to the solar force when the comet is at a particular configuration."
  source: "standard planetary masses; Jupiter is 1/1047 of the solar mass"
  note: "The mass ratio is right (roughly 1/1000). The physics that follows is not: Jupiter's pull on the comet is never comparable in magnitude to the Sun's at any point on this orbit. At the comet's closest approach to Jupiter the ratio is of order a few parts in a thousand. That is enough to shift the period by a year or more over 76 years, which is the real point, and the chapter should make that point instead."

- id: ch11-019
  type: date
  status: corrected
  text: "He estimated that Jupiter's perturbation could delay the 1757 return by as much as several months."
  source: "Ian Ridpath, The Comet returns; MacTutor History of Mathematics, Nicole-Reine Lepaute, https://mathshistory.st-andrews.ac.uk/Biographies/Lepaute/"
  note: "MUST FIX, and the footnote with it. The year should be 1758, not 1757. More seriously, the footnote credits the later refinement to Delaunay and Adams a century later. The perturbation calculation was done BEFORE the return, in 1757-58, by Alexis Clairaut with Jerome Lalande and Nicole-Reine Lepaute, who worked from dawn to dusk for six months and found a delay of 518 days from Jupiter and 100 days from Saturn, predicting perihelion on 13 April 1759. The comet reached perihelion on 13 March 1759, a month early. Delaunay and Adams worked on lunar theory and Neptune respectively and have no place here. This is the single most consequential misattribution in the chapter."

