- id: ch08-014
  type: quotation
  status: verified
  text: "1. Compute the refraction for the Moon's measured altitude: $R_ moon (h_ moon )$ 2. Compute the refraction for the star's measured altitude: $R_ star (h_ star )$ 3. If the parallax correction was applied using altitude-based tables, the refraction has been partially accounted for."
  source: "Standard clearing theory; Maskelynes combined tables"
  note: "The procedure described is right in outline. The refraction values the chapter then uses are wrong; see ch08-041."

- id: ch08-015
  type: measurement
  status: corrected
  text: "The tables are organized by Greenwich time, typically every 3 hours."
  source: "Royal Observatory Greenwich, The Nautical Almanac, https://www.royalobservatorygreenwich.org/articles.php?article=935 ; Nautical Almanac prefaces, https://archive.org/details/nauticalalmanac00admigoog"
  note: "Right for the Nautical Almanac, wrong for Mayers tables, and inconsistent with the rest of the chapter. The Almanac tabulated lunar distances at three-hourly intervals of Greenwich time. Mayers tables had no such interval (see ch08-012). The chapter states three different intervals for the same tables: every 12 hours here in the Mayer section, every 3 hours in this sentence and in the error analysis, and every 30 minutes in the worked-example extract, tab:mayer-example."

- id: ch08-016
  type: quotation
  status: verified
  text: "Table accuracy: Mayer's tables are accurate to about $1'$ in lunar position."
  source: "Nautical Almanac prefaces, https://archive.org/details/nauticalalmanac00admigoog"
  note: "Defensible. Maskelyne states the improved tables gave the Moons longitude within 45 seconds of a degree, that is 45 arcseconds, and the Commissioners claimed longitude within one degree. About 1 arcminute is a fair round figure for the tables as used."

- id: ch08-017
  type: quotation
  status: verified
  text: "At the rate of Moon's motion ($ 0.5^ / hour = 30'/ hour $), a $1'$ error in lunar distance corresponds to about $2$ minutes of time error, or $0.5^ $ of longitude, or roughly $30$ nautical miles at the equator."
  source: "Arithmetic"
  note: "The chain is internally consistent as written: 1 arcmin at 30 arcmin/hour is 2 minutes of time, 0.5 degrees of longitude, 30 nautical miles. On the correct lunar rate of 33 arcmin/hour it becomes 1.8 minutes of time and 27 nautical miles. Keep the chain but fix the rate."

- id: ch08-018
  type: measurement
  status: corrected
  text: "Interpolation error: The tables give lunar distance every 3 hours; the navigator must interpolate to find the exact Greenwich time."
  source: "Royal Observatory Greenwich, The Nautical Almanac, https://www.royalobservatorygreenwich.org/articles.php?article=935"
  note: "The three-hour interval is right for the Nautical Almanac but contradicts the chapters own statements of 12 hours and of 30 minutes; see ch08-015. The chapter should settle on the Almanacs three hours and stop calling the tables Mayers."

- id: ch08-019
