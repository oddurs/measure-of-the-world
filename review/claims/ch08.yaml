- id: ch08-001
  type: date
  status: unverified
  text: "The evening of July 21, 1770, somewhere in the Atlantic west of Ireland."
  source: ""
  note: ""

- id: ch08-002
  type: quotation
  status: unverified
  text: "He steadies his eye at the sextant's eyepiece and brings the Moon's image down, slowly, until its limb just touches the star."
  source: ""
  note: ""

- id: ch08-003
  type: measurement
  status: unverified
  text: "The Moon completes one circuit of the zodiac—$360^ $ of arc—in approximately 27.3 days ."
  source: ""
  note: ""

- id: ch08-004
  type: superlative
  status: unverified
  text: "It is the only celestial body that advances noticeably on a navigator's timescale."
  source: ""
  note: ""

- id: ch08-005
  type: measurement
  status: unverified
  text: "For the Moon, the horizontal parallax is approximately 57.3 arcmin (about one degree)."
  source: ""
  note: ""

- id: ch08-006
  type: superlative
  status: unverified
  text: "Refraction is most pronounced near the horizon, where light rays pass through the greatest thickness of atmosphere, and vanishes at the zenith."
  source: ""
  note: ""

- id: ch08-007
  type: measurement
  status: unverified
  text: "At the horizon ($h = 0^ $), refraction amounts to approximately $35'$ (35 arcminutes)—more than half a degree."
  source: ""
  note: ""

- id: ch08-008
  type: quotation
  status: unverified
  text: "However, the parallax correction—which applies to the Moon but not to the star—must be paired with a refraction correction to put the Moon's position on the same footing as the star's."
  source: ""
  note: ""

- id: ch08-009
  type: quotation
  status: unverified
  text: "The Moon's motion is complex, perturbed by the Sun's gravity, subject to multiple periodic inequalities, and difficult to predict from first principles."
  source: ""
  note: ""

- id: ch08-010
  type: date
  status: unverified
  text: "The result was the *Tabulae Motuum Solis et Lunae* (Tables of the Motions of the Sun and Moon), published in 1770, after his death."
  source: ""
  note: ""

- id: ch08-011
  type: measurement
  status: unverified
  text: "With such tables, a navigator could compute the lunar distance to the precision of a few arcminutes, yielding a longitude accurate to within 30 nautical miles or better—a remarkable improvement over dead reckoning."
  source: ""
  note: ""

- id: ch08-012
  type: date
  status: unverified
  text: "They specified the Moon's position every 12 hours of Greenwich time, for the years 1750 to 1800."
  source: ""
  note: ""

- id: ch08-013
  type: attribution
  status: unverified
  text: "The observed distance includes the Moon at its apparent position (affected by parallax) and the star at its true position (parallax is negligible for a distant star)."
  source: ""
  note: ""

- id: ch08-014
  type: quotation
  status: unverified
  text: "1. Compute the refraction for the Moon's measured altitude: $R_ moon (h_ moon )$ 2. Compute the refraction for the star's measured altitude: $R_ star (h_ star )$ 3. If the parallax correction was applied using altitude-based tables, the refraction has been partially accounted for."
  source: ""
  note: ""

- id: ch08-015
  type: measurement
  status: unverified
  text: "The tables are organized by Greenwich time, typically every 3 hours."
  source: ""
  note: ""

- id: ch08-016
  type: quotation
  status: unverified
  text: "Table accuracy: Mayer's tables are accurate to about $1'$ in lunar position."
  source: ""
  note: ""

- id: ch08-017
  type: quotation
  status: unverified
  text: "At the rate of Moon's motion ($ 0.5^ / hour = 30'/ hour $), a $1'$ error in lunar distance corresponds to about $2$ minutes of time error, or $0.5^ $ of longitude, or roughly $30$ nautical miles at the equator."
  source: ""
  note: ""

- id: ch08-018
  type: measurement
  status: unverified
  text: "Interpolation error: The tables give lunar distance every 3 hours; the navigator must interpolate to find the exact Greenwich time."
  source: ""
  note: ""

- id: ch08-019
  type: measurement
  status: unverified
  text: "The calculation took 30 minutes under the best conditions—an eternity in a ship's officer's working day."
  source: ""
  note: ""

- id: ch08-020
  type: quotation
  status: unverified
  text: "That simplicity—that shift of labor from the navigator's brain to the chronometer's mechanism—would win in the end."
  source: ""
  note: ""

