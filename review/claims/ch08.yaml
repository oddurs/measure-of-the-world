- id: ch08-001
  type: date
  status: corrected
  text: "The evening of July 21, 1770, somewhere in the Atlantic west of Ireland."
  source: "Recomputed with a truncated Meeus ELP-2000/82 lunar theory validated against Meeus Astronomical Algorithms example 47.a (agrees to 1e-5 deg) and against the published time of the 2024-01-25 full moon (agrees to 2 minutes)"
  note: "IMPOSSIBLE SCENE. At 1770 July 21 18:30 UT the Moon was 13.0 degrees from the Sun, a waning crescent about 21 hours before new moon (new moon fell on 1770 July 22 at about 16h UT; the nearest full moon was 1770 July 7). The chapter says two days past full. The Moon-Regulus distance at that instant was 40.5 degrees and closing at 0.63 deg/hour, not 87 deg 22 arcmin and opening. At latitude 45 N and longitude 1 deg 07 arcmin E, the position the chapter itself derives, the Sun was still 9.5 degrees above the horizon at 18:34 local, the Moon was on the horizon at -0.4 degrees and Regulus, only 1.9 hours of right ascension from the Sun, was invisible in daylight. Even taking the stated setting west of Ireland (53 N, 12 W) the Sun is 19.7 degrees up. The whole worked example needs rebuilding around a date and a star that actually work. Note also that the scene is set west of Ireland while the calculation ends 1 deg 07 arcmin EAST of Greenwich, which is in southern England, and gives latitude 45 N, which is south of Bordeaux rather than west of Ireland."

- id: ch08-002
  type: quotation
  status: verified
  text: "He steadies his eye at the sextant's eyepiece and brings the Moon's image down, slowly, until its limb just touches the star."
  source: "Standard lunar-distance practice; Nevil Maskelyne, The British Mariners Guide, London 1763, https://archive.org/details/bim_eighteenth-century_the-british-mariners-gu_maskelyne-nevil_1763"
  note: "Correct practice: the observed distance is taken to the Moons bright limb and then reduced to the centre using the semi-diameter. But the chapters clearing procedure never applies that semi-diameter correction, even though table tab:mayer-data lists the semi-diameter as one of the four tabulated quantities. The omitted step is worth about 15 arcminutes."

- id: ch08-003
  type: measurement
  status: corrected
  text: "The Moon completes one circuit of the zodiac—$360^ $ of arc—in approximately 27.3 days ."
  source: "Arithmetic; NASA Moon Fact Sheet, https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
  note: "The sidereal month of 27.3 days is right (27.3217 days). The arithmetic that follows is not: 360 deg / (27.3 x 24 h) = 0.549 deg/hour, which rounds to 0.55, not 0.5. The printed equation asserts a value its own left-hand side does not give. The 10 per cent shortfall propagates through the error budget later in the chapter and contradicts ch10, which uses 0.55."

- id: ch08-004
  type: superlative
  status: corrected
  text: "It is the only celestial body that advances noticeably on a navigator's timescale."
  source: "Arithmetic"
  note: "Overstated. The Sun advances about 1 degree a day against the stars and the inner planets move by degrees over days, both noticeable on a voyage. The defensible claim is that the Moon is by far the fastest, at about 13 degrees a day, and the only body whose motion is fast enough to serve as a clock over hours rather than weeks."

- id: ch08-005
  type: measurement
  status: corrected
  text: "For the Moon, the horizontal parallax is approximately 57.3 arcmin (about one degree)."
  source: "NASA Moon Fact Sheet, https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
  note: "The mean equatorial horizontal parallax is 57.04 arcmin, ranging from about 54.1 arcmin at apogee to 60.4 arcmin at perigee. 57.3 arcmin is not the mean and looks like a slip for 57.2958, the number of degrees in a radian. About one degree is also misleading: 57 arcmin is 0.95 degrees, and the whole point of the section is that arcminutes matter."

