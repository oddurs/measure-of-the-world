- id: ch08-010
  type: date
  status: verified
  text: "The result was the *Tabulae Motuum Solis et Lunae* (Tables of the Motions of the Sun and Moon), published in 1770, after his death."
  source: "Tobias Mayer, Tabulae Motuum Solis et Lunae Novae et Correctae, London 1770, ed. Nevil Maskelyne, https://archive.org/details/bim_eighteenth-century_tabulae-motuum-solis-et-_mayer-tobias_1770"
  note: "Correct. Full title Tabulae Motuum Solis et Lunae Novae et Correctae, London, printed by W. and J. Richardson for the Commissioners of Longitude, 1770; Mayer died in 1762. The chapter omits two facts worth adding: the editor was Nevil Maskelyne, whose preface is signed Greenwich, 23 February 1770, and the Board awarded Mayers widow 3,000 pounds in May 1765, with 300 pounds to Leonhard Euler for the underlying theorems."

- id: ch08-011
  type: measurement
  status: corrected
  text: "With such tables, a navigator could compute the lunar distance to the precision of a few arcminutes, yielding a longitude accurate to within 30 nautical miles or better—a remarkable improvement over dead reckoning."
  source: "Nautical Almanac prefaces, https://archive.org/details/nauticalalmanac00admigoog ; Royal Observatory Greenwich, Nevil Maskelyne, https://www.royalobservatorygreenwich.org/articles.php?article=1290"
  note: "Overstated. The Commissioners own claim in the first Nautical Almanac was that the tables determined the longitude at sea within a Degree, that is 60 nautical miles. The 1779 preface gives an explicit budget: a 45 arcsecond table error plus a 1 arcminute observing error produces at a medium only an Error of 50 Minutes of Longitude, about 50 nautical miles. Within 30 nautical miles or better is not what the period sources claim."

- id: ch08-012
  type: date
  status: corrected
  text: "They specified the Moon's position every 12 hours of Greenwich time, for the years 1750 to 1800."
  source: "Tobias Mayer, Tabulae Motuum Solis et Lunae Novae et Correctae, London 1770, ed. Nevil Maskelyne, https://archive.org/details/bim_eighteenth-century_tabulae-motuum-solis-et-_mayer-tobias_1770 ; Nevil Maskelyne, The British Mariners Guide, London 1763, https://archive.org/details/bim_eighteenth-century_the-british-mariners-gu_maskelyne-nevil_1763 ; Royal Observatory Greenwich, The Nautical Almanac, https://www.royalobservatorygreenwich.org/articles.php?article=935"
  note: "Wrong in kind, not just in interval. Mayers tables were tables of mean motions and equations, with arguments in anomaly, elongation and so on, from which a computer calculated the Moons place for any instant. They were not a time-indexed ephemeris, contained no pre-computed lunar distances, and had no 12-hour interval and no 1750 to 1800 date range. The twelve hours appears to come from Maskelynes proposal in the British Mariners Guide (1763) that the Moons longitude and latitude be computed for every twelve hours in the year. The Nautical Almanac from 1767 tabulated lunar distances every three hours."

- id: ch08-013
  type: attribution
  status: verified
  text: "The observed distance includes the Moon at its apparent position (affected by parallax) and the star at its true position (parallax is negligible for a distant star)."
