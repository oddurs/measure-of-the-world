- id: ch08-045
  type: measurement
  status: unverified
  text: "inferior to a good chronometer, which can achieve accuracy of plus or minus 5 arcmin of arc or better"
  source: ""
  note: "Units muddle. A chronometers accuracy is a time error, and 5 arcminutes of longitude is 5 nautical miles at the equator, which is roughly what a good chronometer gave. Say 5 nautical miles, or give the time error, rather than arcminutes of arc."

- id: ch08-046
  type: measurement
  status: verified
  text: "Longitude east of Greenwich = 4.45 min x 0.25 deg/min = 1.11 deg = 1 deg 7 arcmin; distance 1.11 x 60 x cos(45 deg) = 47 nm."
  source: "Arithmetic"
  note: "This last stretch of arithmetic is correct: 4m 27s is 4.45 minutes, 1.1125 degrees, 1 deg 06.75 arcmin, and 47.2 nautical miles of departure at latitude 45. It is the only part of the worked example that survives checking, and it rests on inputs that do not."
