- id: ch08-038
  type: measurement
  status: corrected
  text: "R(h) approx 58.3 arcsec tan((90 deg - h)/7.5)"
  source: "src/chapters/04.tex line 53 and src/appendices/appendix-a.tex line 96, both of which use R = 58.3 arcsec cot(h); scripts/verify/derivations.py checks that formula"
  note: "The formula is corrupted. The standard form, used correctly twice elsewhere in this book, is R = 58.3 arcsec tan(z) = 58.3 arcsec cot(h). Dividing the zenith distance by 7.5 has no basis. At h = 35 degrees the printed formula gives 7.5 arcseconds; the correct value is 83 arcseconds, eleven times larger. The sentence that follows the formula, claiming it captures the essential behaviour, is therefore false as printed."

- id: ch08-039
  type: measurement
  status: corrected
  text: "Delta rho_par = HP(sin h_moon - sin h_star cos alpha)"
  source: "Internal inconsistency with the chapters own p_alt = HP cos h; standard first-order clearing theory"
  note: "Inconsistent with the chapters own parallax equation. Six paragraphs earlier the chapter states, correctly, that the parallax in altitude is HP cos h, largest at the horizon and zero at the zenith. This formula uses sin h_moon, which is largest at the ZENITH. The first-order correction to the distance is the Moons parallax in altitude times the cosine of the angle at the Moon between its vertical circle and the great circle to the star, so it must go as cos h_moon. The chapter also calls the formula an approximation valid for small distances (a few degrees) and then applies it at 87 degrees."

- id: ch08-040
  type: measurement
  status: corrected
  text: "The parallax correction is 23.5 arcmin. This is substantial: nearly half a degree."
  source: "Arithmetic"
  note: "The arithmetic inside the brackets is right but the gloss is not: 23.5 arcmin is 0.39 degrees, and calling it nearly half a degree stretches it. Compare the earlier example, where 49.4 arcmin is described as of order the width of the full Moon, which is 31 arcmin. The two glosses are inconsistent with each other. The underlying figure is wrong anyway because the formula is wrong; see ch08-039."

- id: ch08-041
  type: measurement
  status: corrected
  text: "Refraction at h_moon = 35 degrees is approximately 2.5 arcmin. Refraction at h_star = 28 degrees is approximately 3.1 arcmin."
  source: "R = 58.3 arcsec cot(h), the formula used in ch04 and appendix A"
  note: "Both are too large by about 70 per cent. At 35 degrees R = 1.4 arcmin; at 28 degrees R = 1.8 arcmin. The relative ordering, star lower so refraction greater, is right."

- id: ch08-042
  type: measurement
  status: corrected
  text: "t_Greenwich = 18:30 + (86.975 - 86.98)/0.498 x 30 min, approx 18:30 - 0.3 min, approx 18:29:48"
  source: "Arithmetic"
  note: "Dimensionally wrong and internally inconsistent. Dividing degrees by degrees per hour already gives hours; multiplying by 30 minutes as well is an error. The correct interpolation on the chapters own table is (86.975 - 86.98)/0.498 = -0.010 hour = -0.60 minutes, giving 18:29:24. The chapter computes -0.3 minutes and then writes 18:29:48, which is -0.2 minutes, so even its own two answers disagree."

- id: ch08-043
  type: measurement
  status: corrected
  text: "Figure caption: Combined root-sum-square error of approximately 4 arcminutes translates to roughly 30 nautical miles of longitude uncertainty."
  source: "Arithmetic, using the chapters own conversion in the error analysis section"
  note: "Contradicts the chapter text. The chapter establishes that 1 arcminute of lunar distance corresponds to 30 nautical miles, so 4 arcminutes corresponds to about 120 nautical miles. Either the caption or the 4 arcminute budget is wrong; the surrounding prose then claims plus or minus 30 nautical miles again, which only follows from a 1 arcminute error."

- id: ch08-044
