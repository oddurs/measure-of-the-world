  status: unverified
  text: "Detailed descriptions are in and the National Maritime Museum's own collections documentation, which is publicly available online.) H5, completed in 1772, is also original."
  source: ""
  note: ""

- id: ch24-015
  type: date
  status: unverified
  text: "The Airy transit circle, the instrument that defined the Prime Meridian from 1884 to 1954, is displayed in a small pavilion on the grounds."
  source: ""
  note: ""

- id: ch24-016
  type: date
  status: unverified
  text: "(The transit circle was preserved in situ (in the Meridian Building) until 1990."
  source: ""
  note: ""

- id: ch24-017
  type: date
  status: unverified
  text: "The original was removed in 1882 and is no longer displayed."
  source: ""
  note: ""

- id: ch24-018
  type: date
  status: unverified
  text: "The National Maritime Museum, which administers the Greenwich site since 1953, faces a curatorial challenge: how to present this history to audiences ranging from schoolchildren to astronomers and historians?"
  source: ""
  note: ""

- id: ch24-019
  type: date
  status: unverified
  text: "The current permanent exhibition (opened 2021) attempts something more ambitious: to present Greenwich as a site where precision measurement, standardization, and global coordination were laboriously constructed."
  source: ""
  note: ""

- id: ch24-020
  type: date
  status: unverified
  text: "The original time ball was installed in 1833 by Astronomer Royal John Pond, with the assistance of the horologist John Arnold."
  source: ""
  note: ""

- id: ch24-021
  type: date
  status: unverified
  text: "The ball was operated continuously until 1939, when it was removed for wartime reasons."
  source: ""
  note: ""

- id: ch24-022
  type: measurement
  status: unverified
  text: "That convention has been extraordinarily useful—enabling global commerce, navigation, telecommunications, and scientific research for 140 years and counting."
  source: ""
  note: ""

- id: ch24-023
  type: date
  status: unverified
  text: "Flamsteed House, built to Wren's design in 1675, is remarkable not merely for its role in science but as a piece of architecture."
  source: ""
  note: ""

- id: ch24-024
  type: date
  status: unverified
  text: "The Yerkes Observatory in Wisconsin, built in 1897 and housing one of the world's largest refractors, was operated until 2018 and has since been closed to research."
  source: ""
  note: ""

- id: ch24-025
  type: date
  status: unverified
  text: "(These proposals are outlined in a 2022 strategic plan produced by the National Maritime Museum, though they have not yet progressed to the implementation stage due to funding constraints.)"
  source: ""
  note: ""

- id: ch24-026
  type: measurement
  status: unverified
  text: "Yet this arbitrary convention has structured the world for 140 years."
  source: ""
  note: ""

