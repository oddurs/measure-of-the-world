- id: ch24-001
  type: measurement
  status: unverified
  text: "A discrepancy of 100 meters, resolved in an instant by satellite: the line beneath her feet and the line defined by the modern world are not the same."
  source: ""
  note: ""

- id: ch24-002
  type: date
  status: unverified
  text: "The instruments that drove its construction in 1675 and sustained its scientific mission into the 1980s are gone—relocated to La Palma, La Silla, or retired entirely."
  source: ""
  note: ""

- id: ch24-003
  type: date
  status: unverified
  text: "Flamsteed House, Wren's 1675 structure, remains the architectural anchor."
  source: ""
  note: ""

- id: ch24-004
  type: superlative
  status: unverified
  text: "Its Octagon Room, where Flamsteed made the earliest observations, is preserved as it was historically reconstructed—though the original observing arrangements have been replaced with interpretive displays."
  source: ""
  note: ""

- id: ch24-005
  type: date
  status: unverified
  text: "The Airy transit circle, the instrument that defined the meridian from 1884 to the modern era, stands nearby in a small pavilion."
  source: ""
  note: ""

- id: ch24-006
  type: measurement
  status: unverified
  text: "They are offset by approximately 102 meters to the east."
  source: ""
  note: ""

- id: ch24-007
  type: measurement
  status: unverified
  text: "The brass strip, upon which millions of tourists stand, defines the astronomical position; the satellite-based geodetic framework places the true (in the modern sense) zero meridian about 100 meters away."
  source: ""
  note: ""

- id: ch24-008
  type: date
  status: unverified
  text: "The 1884 International Meridian Conference established this location—the Airy transit circle's position—as the Prime Meridian for the entire world."
  source: ""
  note: ""

- id: ch24-009
  type: measurement
  status: unverified
  text: "The Prime Meridian in the modern geodetic framework (ITRF) is defined not by a physical instrument but by a mathematical convention: it is the meridian that is 5.3$ $ west of the meridian defined by the Greenwich Mean Observatory when measured at the equator, or equivalently, approximately 102 meters west in local coordinates."
  source: ""
  note: ""

- id: ch24-010
  type: measurement
  status: unverified
  text: "(The exact offset is 5.31$ $ (ITRF-based), which corresponds approximately to 102 meters at Greenwich's latitude of 51.5°.)"
  source: ""
  note: ""

- id: ch24-011
  type: measurement
  status: unverified
  text: "At Greenwich, this deflection is roughly 5.3 arc-seconds in the east-west direction, corresponding to 102 meters at Greenwich's latitude."
  source: ""
  note: ""

- id: ch24-012
  type: measurement
  status: unverified
  text: "When she stands on the brass strip at Greenwich, her phone's longitude reading is approximately $0.0015^ $ West (about 102 meters, as we calculated)."
  source: ""
  note: ""

- id: ch24-013
  type: date
  status: unverified
  text: "H4 is original, the actual chronometer that Harrison completed in 1759."
  source: ""
  note: ""

- id: ch24-014
