  status: unverified
  text: "When Woolley retired in 1971 the two roles were separated: the title of Astronomer Royal became an honorary appointment held by a distinguished astronomer who need not be connected with the Observatory, while the Royal Greenwich Observatory was led by a separate Director (Margaret Burbidge, 1972–1973; Alan Hunter, 1973–1975; Francis Graham-Smith, 1975–1981; Alec Boksenberg, 1981–1995; Jasper Wall, 1995–1998)."
  source: ""
  note: ""

- id: appc-019
