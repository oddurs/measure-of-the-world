- id: ch05-001
  type: date
  status: corrected
  text: "In the spring of 1712, John Flamsteed was informed that Isaac Newton and Edmond Halley had seized his observation books and, without his consent or knowledge, had prepared them for publication."
  source: "Francis Baily, An Account of the Revd John Flamsteed (1835), https://archive.org/stream/anaccountrevdjo00bailgoog/anaccountrevdjo00bailgoog_djvu.txt ; https://www.royalobservatorygreenwich.org/articles.php?article=1319"
  note: "Wrong on date and on mechanism. Flamsteed was not informed in spring 1712 that his books had been seized. Under the Prince George of Denmark printing scheme (referees Newton, Wren, Arbuthnot, Gregory, Roberts, appointed end of 1704) Newton demanded the catalogue sealed up, and it was sealed in Wrens presence and delivered to Newton in 1706; on 20 March 1707/8 Flamsteed left a further 175 sheets of mural-arc observations with Newton. Flamsteed learned the sealed catalogue was in the press from Arbuthnots letter of 14 March 1710/11, having already been privately informed before that. Halley edited the volume that appeared in 1712."

- id: ch05-002
  type: date
  status: corrected
  text: "When the legitimate three-volume Historia Coelestis Britannica appeared thirteen years later in 1725, it bore Flamsteed's name alone and embodied not a collection of raw sightings but a rigorously reduced catalog of stellar positions, the product of computational work that would occupy him until his death."
  source: "Royal Observatory Greenwich, https://www.royalobservatorygreenwich.org/articles.php?article=932 ; Royal Museums Greenwich, https://www.rmg.co.uk/stories/space-astronomy/who-was-john-flamsteed-first-astronomer-royal"
  note: "Year (1725), three volumes and thirteen-year gap are correct. Wrong that the work occupied him until his death and bore his name alone as sole product of his own labour: the 1725 edition was completed posthumously by his widow Margaret Flamsteed with his former assistants Joseph Crosthwait and Abraham Sharp. Catalogue contains 2,935 star entries (Baily; 22 duplicates, at least 61 non-existent)."

- id: ch05-003
  type: date
  status: verified
  text: "From 1676 until his death in 1719, Flamsteed conducted continuous telescopic observations at Greenwich."
  source: "Francis Baily, An Account of the Revd John Flamsteed (1835), https://archive.org/stream/anaccountrevdjo00bailgoog/anaccountrevdjo00bailgoog_djvu.txt ; Royal Museums Greenwich, https://www.rmg.co.uk/stories/space-astronomy/who-was-john-flamsteed-first-astronomer-royal"
  note: "Flamsteed entered the Observatory 10 July 1676 and began measuring distances with the sextant 19 September 1676; he died 31 December 1719. Note appendix H gives the span as 1675-1719 (44 years) against this chapters 1676-1719 (43 years)."

- id: ch05-004
  type: superlative
  status: unverified
  text: "This vast accumulation of data posed an unprecedented problem: how to reduce raw measurements to meaningful astronomical information."
  source: ""
  note: "Rhetorical superlative, not a sourceable claim. Reduction of large observational data sets was not unprecedented in 1700 - Tycho and Hevelius faced the same problem at smaller scale. Recommend softening rather than sourcing."

- id: ch05-005
  type: quotation
  status: unverified
  text: "Every observation was a two-dimensional measurement—a time recorded by Tompion's clock and an altitude recorded from the mural arc's graduated scale."
  source: ""
  note: "Partly wrong as a general statement. Abraham Sharps mural arc was not erected until 1689 (this books own ch22 dates it 1689-1712), so observations from 1676 to 1689 were sextant distances, not arc altitudes. Could not source the claim that the clock readings were in mean solar time; Flamsteeds Tompion regulators had 13-foot pendulums beating 2 seconds and the worked example later multiplies by 1.0027379, which is only valid for a mean-solar clock."

- id: ch05-006
  type: superlative
  status: unverified
  text: "The first step is to account for variations in Tompion's clocks."
  source: ""
  note: "Procedural statement, not independently checkable. Left as is."

- id: ch05-007
  type: attribution
  status: verified
  text: "The observed altitude $h_ obs $ must be corrected for atmospheric refraction before it yields declination."
  source: "src/appendices/appendix-a.tex and src/chapters/04.tex, which use R = 58.3 arcsec cot(h); scripts/verify/derivations.py checks this formula"
  note: "Correct physics and correct order of operations."

- id: ch05-008
  type: measurement
  status: verified
  text: "For an intermediate altitude like $60^ $, a typical refraction correction is 30–50 arcseconds."
  source: "R = 58.3 arcsec cot(h), the formula used in ch04 and appendix A of this book"
  note: "Computed: 58.3 cot(60 deg) = 33.7 arcsec, inside the stated 30-50 arcsec band. The band is loose but not wrong."

- id: ch05-009
  type: quotation
  status: verified
  text: "The cause was precession—the slow wobble of Earth's axis caused by the gravitational torque of the Sun and Moon on Earth's equatorial bulge."
  source: "Standard result; consistent with the books own treatment in ch12 and appendix A"
  note: "Correct as stated."

- id: ch05-010
  type: measurement
  status: verified
  text: "By Flamsteed's time, it was established at approximately 50 arcseconds per year."
  source: "IAU general precession 50.29 arcsec per year"
  note: "Correct to the precision claimed."

- id: ch05-011
  type: date
  status: corrected
  text: "A star at $ = 0^ h 0^ m 0^ s $ and $ = 0^ $ in 1680 will be at $ 0^ h 0^ m 3.3^ s $ and $ 0^ 0' 15''$ in 1700, a shift of $3.3^ s $ (50 arcseconds) in right ascension and 15 arcseconds in declination."
  source: "Recomputed: annual precession in RA m = 3.075 s of time = 46.1 arcsec, in dec n = 20.04 arcsec"
  note: "WRONG by a factor of 20. Over 1680 to 1700 (20 years) a star at alpha = 0h, delta = 0 moves 61.5 s of time in RA (922 arcsec) and 401 arcsec in declination. The printed 3.3 s and 15 arcsec are roughly ONE-year values (one year gives 3.07 s and 20.0 arcsec). The internal equivalence 3.3 s = 50 arcsec is itself fine (3.3 x 15 = 49.5)."

- id: ch05-012
  type: quotation
  status: corrected
  text: "The formula he used (derived from spherical trigonometry) relates coordinates at epoch $t_1$ to coordinates at epoch $t_2$: MATH MATH where $m 46.1''$ is the precession in right ascension and $n 20.0''$ is the precession in declination per century."
  source: "Recomputed; standard precession constants for the epoch"
  note: "Units wrong. m = 46.1 arcsec and n = 20.0 arcsec are ANNUAL values, not per century; per century they are about 4610 arcsec and 2004 arcsec. As printed the constants are inconsistent with the divisor 36525 days, which is one Julian century. Separately, attributing this rigorous-precession approximation to Flamsteed needs a source; could not find one."

- id: ch05-013
  type: date
  status: verified
  text: "By applying this correction, Flamsteed could reduce all observations to a common epoch—he chose the year 1690—allowing observations from 1676 through 1719 to be meaningfully averaged and compared."
  source: "Francis Baily, An Account of the Revd John Flamsteed (1835), https://archive.org/stream/anaccountrevdjo00bailgoog/anaccountrevdjo00bailgoog_djvu.txt"
  note: "Correct. Baily records Flamsteed reducing positions to the epoch 1690 throughout, and reduced Bradleys catalogue to 1690 to match."

- id: ch05-014
  type: quotation
  status: corrected
  text: "The transformation between equatorial and ecliptic coordinates involves a rotation by the obliquity of the ecliptic $ 23^ 27'$, the angle between Earth's equatorial plane and orbital plane."
  source: "Computed mean obliquity (IAU expression): 23 deg 28 arcmin 46 arcsec at 1690; 23 deg 26 arcmin 21 arcsec at J2000"
  note: "For Flamsteeds epoch the mean obliquity was about 23 deg 29 arcmin, not 23 deg 27 arcmin. The printed value sits between the 1690 and the modern figure and matches neither. The transformation equations themselves are correct."

- id: ch05-015
  type: date
  status: corrected
  text: "From astronomical tables, the sidereal time at midnight on 1690 June 12 was $ _0 = 17^ h 58^ m 42^ s $."
  source: "Computed GMST from the IAU expression"
  note: "Could not reproduce. GMST at 0h UT on 1690 June 12 (Gregorian) is 17h 22m 50s; for the Julian-calendar (Old Style) 12 June, which is 22 June Gregorian, it is 18h 02m 16s. The printed 17h 58m 42s matches neither. The chapter also does not say whether the date is Old or New Style, which matters by 10 days in 1690."

- id: ch05-016
  type: measurement
  status: corrected
  text: "Subtracting 24 hours (since we've gone beyond a full rotation): $ = 13^ h 51^ m 20^ s $."
  source: "Recomputed from the chapters own inputs"
  note: "WRONG. 19h 48m 15.8s x 1.0027379 = 19h 51m 31s, not 19h 52m 38s. Adding the printed alpha_0 gives 37h 50m 13s, so alpha = 13h 50m 13s, not 13h 51m 20s. More seriously, this result is then abandoned: the section headed Final catalog position prints alpha = 18h 36m 41s, which does not follow from any step shown."

- id: ch05-017
  type: date
  status: verified
  text: "The observation was taken on 1690 June 12, so no precession correction is needed (we're already at epoch 1690)."
  source: "Trivially true given the stated epoch"
  note: "Correct as stated."

- id: ch05-018
  type: date
  status: corrected
  text: "The differences reflect precession from 1690 to 2000 and proper motion of Vega itself."
  source: "SIMBAD alpha Lyr, https://simbad.u-strasbg.fr/simbad/sim-id?Ident=vega ; position at 1690 recomputed by rigorous precession plus proper motion"
  note: "Both the modern values and the inference are wrong. Vega J2000 is RA 18h 36m 56.34s, Dec +38 deg 47 arcmin 01.3 arcsec, not 18h 36m 55.8s / +38 deg 47 arcmin 05.3 arcsec. Vega at epoch 1690 was RA 18h 26m 28s, Dec +38 deg 31 arcmin 18 arcsec, so precession plus proper motion from 1690 to 2000 amounts to about 10.5 minutes of time in RA and 16 arcmin in declination - not the 15 s and 5 arcsec the chapter shows. The claim that Flamsteeds values align precisely with modern measurements is not supported by anything in the example."

