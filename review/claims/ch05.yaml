- id: ch05-029
  type: measurement
  status: corrected
  text: "where phi = 51 deg 28 arcmin 40 arcsec is the latitude of Greenwich."
  source: "IAU/Minor Planet Center observatory code 000 Greenwich, https://www.minorplanetcenter.net/iau/lists/ObsCodes.html"
  note: "The standard latitude of the Royal Observatory (Airy Transit Circle) is 51 deg 28 arcmin 38 arcsec. 51 deg 28 arcmin 40 arcsec is acceptable for Flamsteed House but should be stated as such. Flamsteeds own determination was 51 deg 28 arcmin 10 arcsec in 1676, revised to 51 deg 28 arcmin 30 arcsec by 1690, so using a modern value in a reconstruction of his reduction is itself questionable."

- id: ch05-030
  type: measurement
  status: corrected
  text: "delta = 51 deg 28 arcmin 40 arcsec - 33 deg 18 arcmin 35 arcsec = +38 deg 10 arcmin 5 arcsec"
  source: "Arithmetic; Vega position from SIMBAD, https://simbad.u-strasbg.fr/simbad/sim-id?Ident=vega"
  note: "ARITHMETIC ERROR. 51 deg 28 arcmin 40 arcsec minus 33 deg 18 arcmin 35 arcsec is +18 deg 10 arcmin 05 arcsec, not +38 deg 10 arcmin 05 arcsec. Beyond the subtraction, the input altitude is impossible: Vega at epoch 1690 had declination +38 deg 31 arcmin, so its meridian altitude at Greenwich was 77 deg 03 arcmin, not the 56 deg 42 arcmin the example assumes. The entire Vega worked example needs rebuilding from a real ephemeris."
