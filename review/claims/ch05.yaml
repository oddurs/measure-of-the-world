- id: ch05-020
  type: quotation
  status: corrected
  text: "The typical precision achieved in the final Historia was $ 10$–$20$ arcseconds in both coordinates—a threefold improvement over Tycho Brahe's 1 to 3 arcminute errors, despite Tycho's innovations."
  source: "Verbunt and van Gent, Astronomy and Astrophysics 516 A28 (2010), https://arxiv.org/pdf/1003.3836 ; Verbunt and Schrimpf (2021), https://arxiv.org/pdf/2103.10801"
  note: "The multiplier is wrong and contradicts this books own ch02. Modern statistical work puts Tycho at about 1 to 2 arcmin (rms 2 arcmin). On the chapters own numbers, 1-3 arcmin down to 10-20 arcsec is a 3-fold to 18-fold improvement; ch02 line 83 calls the same comparison an order of magnitude improvement. The +/-10-20 arcsec figure for Flamsteed is itself unsourced - no modern Hipparcos-comparison study of Flamsteeds catalogue was found."

- id: ch05-021
  type: date
  status: verified
  text: "The bitter dispute over the pirated 1712 publication illuminates a fundamental tension in scientific practice: data ownership and scientific credit."
  source: "Royal Observatory Greenwich, https://www.royalobservatorygreenwich.org/articles.php?article=932 ; https://www.royalobservatorygreenwich.org/articles.php?article=1319"
  note: "The 1712 Historia Coelestis was printed in 400 copies with an unsigned preface by Halley, over Flamsteeds objection. Note Newton was President of the Royal Society at the time; Halley was Savilian Professor at Oxford and did not become Secretary of the Royal Society until 13 November 1713 (see ch05-026)."

- id: ch05-022
  type: attribution
  status: corrected
  text: "Newton and Halley published their imperfect version; Flamsteed burned copies and proceeded with his own publication."
  source: "Francis Baily, An Account of the Revd John Flamsteed (1835), https://archive.org/stream/anaccountrevdjo00bailgoog/anaccountrevdjo00bailgoog_djvu.txt ; Royal Observatory Greenwich, https://www.royalobservatorygreenwich.org/articles.php?article=932 ; https://www.lindahall.org/about/news/new-acquisition-john-flamsteed-historia-coelestis/"
  note: "Wrong on date, quantity and what was burned. After the deaths of Queen Anne (1714) and the Earl of Halifax (May 1715) Flamsteed got a royal order for 300 of the 400 copies; his letter to Sharp of 29 March 1715/16 says they had just been delivered. In late April 1716 he burned the SHEETS he objected to - Halleys preface, the catalogue of fixed stars and the mural-arc observations, about 13,500 sheets - after first extracting the sextant observations, which he kept and reused in the 1725 edition. He described it as a Sacrifice to Heavenly Truth. The chapters page by page in his fireplace in 1712 is not supported."

- id: ch05-023
  type: date
  status: unverified
  text: "When the Historia appeared in 1725, it superseded the pirated edition entirely."
  source: ""
  note: "The 1725 three-volume publication is verified (ch05-002). Superseded the pirated edition entirely is an interpretive claim; no source found. It is also loosely worded given that Flamsteed had already destroyed three quarters of the 1712 print run in 1716."

- id: ch05-024
  type: date
  status: corrected
  text: "The pirated 1712 edition faded from use within decades, leaving Flamsteed's authorized catalog as the definitive work."
  source: "Royal Observatory Greenwich, https://www.royalobservatorygreenwich.org/articles.php?article=932 ; Francis Baily, An Account of the Revd John Flamsteed (1835), https://archive.org/stream/anaccountrevdjo00bailgoog/anaccountrevdjo00bailgoog_djvu.txt"
  note: "Wrong mechanism. The 1712 edition did not fade from use within decades: 300 of the 400 copies were destroyed by Flamsteed in 1716, nine years before the authorised edition appeared, leaving roughly 100 copies in circulation."

- id: ch05-025
  type: attribution
  status: corrected
  text: "Bradley discovered stellar aberration and precession by comparing his observations against Flamsteed's, detecting systematic shifts that revealed previously unknown phenomena."
  source: "Bradley, Philosophical Transactions 35 (1728) 637-661, https://doi.org/10.1098/rstl.1727.0064 ; Bradley, Philosophical Transactions 45 (1748) 1-41, https://doi.org/10.1098/rstl.1748.0002"
  note: "Wrong on both the phenomena and the method. Bradley discovered the aberration of light (announced 1728/29) and nutation (1748). He did not discover precession, which was known from Hipparchus and is discussed as long-established earlier in this same chapter. Both discoveries came from his own zenith-sector observations of gamma Draconis with Samuel Molyneux at Kew and Wanstead from 1725, not from comparison against Flamsteeds catalogue. This chapter therefore contradicts ch12 and appendix H, which give the aberration story correctly."

- id: ch05-026
  type: attribution
  status: corrected
  text: "Halley, as Secretary of the Royal Society, had facilitated the appropriation."
  source: "Dictionary of National Biography, Halley; Royal Society records, https://en.wikisource.org/wiki/Dictionary_of_National_Biography,_1885-1900/Halley,_Edmund"
  note: "Anachronism. Halley became Secretary of the Royal Society on 13 November 1713, more than a year after the 1712 publication. In 1712 he was Savilian Professor of Geometry at Oxford. It was Newton who held office at the Royal Society, as President."

