- id: ch05-020
  type: quotation
  status: unverified
  text: "The typical precision achieved in the final Historia was $ 10$–$20$ arcseconds in both coordinates—a threefold improvement over Tycho Brahe's 1 to 3 arcminute errors, despite Tycho's innovations."
