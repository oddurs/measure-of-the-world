- id: ch10-001
  type: date
  status: unverified
  text: "In the parlor of a country house at Ludlow, Shropshire, in the year 1767, a woman named Mary Edwards sat at a wooden table with pen, ink, and freshly printed ephemerides."
  source: ""
  note: ""

- id: ch10-002
  type: superlative
  status: unverified
  text: "This was how the greatest navigational tool of the 18th century was built—not by a single genius, but by a distributed network of human minds, each working in isolation, each checked against the others."
  source: ""
  note: ""

- id: ch10-003
  type: date
  status: unverified
  text: "The Nautical Almanac, published annually starting in 1767, was the first computational enterprise of its kind: a machine built of people."
  source: ""
  note: ""

- id: ch10-004
  type: quotation
  status: unverified
  text: "Before Harrison's final vindication (which would come in the 1770s, and even then reluctantly), the Board of Longitude had placed substantial resources behind a different approach: determining longitude from the Moon's position in the sky."
  source: ""
  note: ""

- id: ch10-005
  type: measurement
  status: unverified
  text: "The Moon orbits the Earth with a period of approximately 27.3 days, and its apparent motion across the background stars is roughly 13.2 degrees per day (or 0.55 degrees per hour)."
  source: ""
  note: ""

- id: ch10-006
  type: quotation
  status: unverified
  text: "If the observer knew the exact time when the Moon should be at a particular position (as given by the tables, calibrated to Greenwich mean time), and observed the Moon's actual angular distance from a bright star or the Sun, the difference in observed versus tabulated positions would reveal the observer's longitude."
  source: ""
  note: ""

- id: ch10-007
  type: quotation
  status: unverified
  text: "The angle between the Moon's observed position and its tabulated position depends not only on the observer's time error but also on numerous small corrections: parallax (because the observer is not at the Earth's center), refraction (atmospheric bending of light), and several perturbation terms in lunar theory."
  source: ""
  note: ""

- id: ch10-008
  type: date
  status: unverified
  text: "In 1765, Maskelyne was appointed Astronomer Royal, succeeding John Flamsteed's successor James Bradley."
  source: ""
  note: ""

- id: ch10-009
  type: measurement
  status: unverified
  text: "To compute positions for every 3 hours throughout a year would require thousands of person-hours of labor."
  source: ""
  note: ""

- id: ch10-010
  type: superlative
  status: unverified
  text: "The computations returned would be checked against other results, and the best versions incorporated into the Almanac."
  source: ""
  note: ""

- id: ch10-011
  type: date
  status: unverified
  text: "The Nautical Almanac, first published in 1767 for the year 1768, contained several types of tables:"
  source: ""
  note: ""

- id: ch10-012
  type: quotation
  status: unverified
  text: "The navigator recorded the ship's chronometer reading (or, if no chronometer was available, the best estimate of time based on the rate of a marine clock or the Sun's altitude)."
  source: ""
  note: ""

- id: ch10-013
  type: measurement
  status: unverified
  text: "Time was critical: an error of 1 minute in the assumed time would produce an error of about 15 minutes of arc in the Moon's position—far larger than the observational uncertainty."
  source: ""
  note: ""

- id: ch10-014
  type: quotation
  status: unverified
  text: "The navigator used the Nautical Almanac tables to find the Moon's and star's positions as they would appear from the Earth's center, correcting for the observer's geographic location (parallax), atmospheric refraction, and the Moon's and star's motions."
  source: ""
  note: ""

- id: ch10-015
  type: quotation
  status: unverified
  text: "The result was the ``cleared distance''—the angle between Moon and star as measured from the Earth's center at the assumed time."
  source: ""
  note: ""

- id: ch10-016
  type: measurement
  status: unverified
  text: "For an educated navigator with training in mathematics, this might take 30 minutes to an hour."
  source: ""
  note: ""

- id: ch10-017
  type: measurement
  status: unverified
  text: "Specifically, the Moon moves at roughly 0.55 degrees per hour, so a 0.55-degree error in the Moon's position corresponds to a 1-hour error in time, which corresponds to 15 degrees of longitude (or about 900 nautical miles at the equator)."
  source: ""
  note: ""

- id: ch10-018
  type: measurement
  status: unverified
  text: "The entire procedure, from observation to final result, might occupy 2–3 hours of the navigator's time, assuming competence and access to the necessary tables."
  source: ""
  note: ""

- id: ch10-019
  type: date
  status: unverified
  text: "Logarithms (recently popularized by John Napier's 1617 work and improved by subsequent mathematicians) allowed multiplication and division to be replaced by table lookups and addition/subtraction."
  source: ""
  note: ""

- id: ch10-020
  type: measurement
  status: unverified
  text: "If the Nautical Almanac provided lunar positions at 12-hour intervals, and a navigator needed the position at, say, 13 hours, the navigator could interpolate."
  source: ""
  note: ""

- id: ch10-021
  type: superlative
  status: unverified
  text: "The structure of difference tables made certain types of errors apparent: if the first differences were not approximately linear, it suggested an error in the underlying data or in the difference calculation."
  source: ""
  note: ""

- id: ch10-022
  type: quotation
  status: unverified
  text: "To speak of Maskelyne's Nautical Almanac is to invite a misunderstanding; it would be more accurate to speak of the Nautical Almanac as an institution that Maskelyne founded and led.'')"
  source: ""
  note: ""

- id: ch10-023
  type: date
  status: unverified
  text: "The Nautical Almanac, first published in 1767, continues to be published today."
  source: ""
  note: ""

- id: ch10-024
