- id: ch10-013
  type: measurement
  status: corrected
  text: "Time was critical: an error of 1 minute in the assumed time would produce an error of about 15 minutes of arc in the Moon's position—far larger than the observational uncertainty."
  source: "recomputed from the chapter's own lunar rate; scripts/verify/derivations.py"
  note: "MUST FIX, off by a factor of about 27. The Moon moves 0.549 deg/hour, which is 0.55 ARCMINUTES per minute of time. An error of one minute in the assumed time therefore displaces the Moon by about half an arcminute, not fifteen. The fifteen-arcminutes figure is Earth's rotation rate (15 arcmin of LONGITUDE per minute of time) and has been attached to the wrong body. The correct statement of the sensitivity runs the other way: an error of one arcminute in the cleared lunar distance costs about two minutes of time, and so about half a degree of longitude."

