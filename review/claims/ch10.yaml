- id: ch10-010
  type: superlative
  status: corrected
  text: "The computations returned would be checked against other results, and the best versions incorporated into the Almanac."
  source: "Mary Croarken, Providing longitude for all: the eighteenth century computers of the Nautical Almanac, Journal for Maritime Research 4(1) (2002); Croarken, Tabulating the Heavens, IEEE Annals 25(3) (2003), 48-61"
  note: "MUST FIX. The mechanism the chapter describes, Maskelyne sorting all submissions and rejecting outliers and reassigning to a third computer, is not what happened. Each month's work was computed independently by TWO computers, and a third man, the COMPARER, reconciled the two sets and prepared copy for the press. Richard Dunthorne and then Malachy Hitchins (comparer from 1767 until his death in 1809) held that post. Maskelyne administered and paid; he did not personally adjudicate every number. The chapter's opening vignette repeats the same invented procedure."

