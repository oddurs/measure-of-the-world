- id: ch16-001
  type: date
  status: unverified
  text: "On a winter afternoon in 1833, at precisely 1:00 PM, a ball rose to the top of a mast on the Greenwich Observatory dome."
  source: ""
  note: ""

- id: ch16-002
  type: quotation
  status: unverified
  text: "( describes the inauguration of the Greenwich time ball: ``The ball rises a minute before the hour, remains at the top for about half a minute, then drops exactly at one o'clock, and remains at the bottom until nearly two o'clock.'') Ships moored on the Thames trained telescopes on the ball."
  source: ""
  note: ""

- id: ch16-003
  type: superlative
  status: unverified
  text: "For the first time in history, accurate time was distributable."
  source: ""
  note: ""

- id: ch16-004
  type: superlative
  status: unverified
  text: "Yet broadcasting Greenwich time to the Thames was only the first step."
