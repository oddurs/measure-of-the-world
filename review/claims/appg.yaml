- id: appg-001
  type: date
  status: corrected
  text: "From Flamsteed's introduction to Historia Coelestis Britannica (1725):"
  source: "John Flamsteed, Historiae Coelestis Britannicae Volumen ..., 3 vols., London, 1725 (Latin). Scan: https://archive.org/details/historia-coelestis-britannica-vol.-1 ; vol. 3: https://archive.org/details/historia-coelestis-britannica-vol-3 . English preface: Allan Chapman (ed.), The Preface to John Flamsteed's Historia Coelestis Britannica, trans. Alison Dione Johnson, National Maritime Museum, Maritime Monographs and Reports No. 52, Greenwich, 1982."
  note: "Work exists and 1725 is correct, but the description does not. Historia Coelestis Britannica is in Latin throughout, and its preface is the Prolegomena at the front of volume 3, not an English 'introduction'. Cite the Chapman/Johnson 1982 translation if an English text is quoted, and label it as a translation."

- id: appg-002
  type: superlative
  status: corrected
  text: "I have therefore applied myself with the greatest diligence to the observation of the motions and positions of the fixed stars, as they appear from this place [Greenwich Observatory], that I might provide the necessary materials for accurate tables of the moon's place, and thereby contribute to the solution of that great problem of finding the longitude at sea."
  source: "John Flamsteed, Historiae Coelestis Britannicae Volumen ..., 3 vols., London, 1725 (Latin). Scan: https://archive.org/details/historia-coelestis-britannica-vol.-1 ; vol. 3: https://archive.org/details/historia-coelestis-britannica-vol-3 . English preface: Allan Chapman (ed.), The Preface to John Flamsteed's Historia Coelestis Britannica, trans. Alison Dione Johnson, National Maritime Museum, Maritime Monographs and Reports No. 52, Greenwich, 1982."
  note: "FABRICATED. This sentence does not appear in Historia Coelestis Britannica, which is a Latin work. Searches for its distinctive phrasing return no match in the scanned original or in any secondary literature. Remove the quotation."

- id: appg-003
  type: superlative
  status: corrected
  text: "This work has occupied my astronomical studies for more than forty years, and I have endeavoured to bring every observation to that degree of accuracy which the human senses, aided by the best instruments available, could possibly attain.'' quote"
  source: "John Flamsteed, Historiae Coelestis Britannicae Volumen ..., 3 vols., London, 1725 (Latin). Scan: https://archive.org/details/historia-coelestis-britannica-vol.-1 ; vol. 3: https://archive.org/details/historia-coelestis-britannica-vol-3 . English preface: Allan Chapman (ed.), The Preface to John Flamsteed's Historia Coelestis Britannica, trans. Alison Dione Johnson, National Maritime Museum, Maritime Monographs and Reports No. 52, Greenwich, 1982."
  note: "FABRICATED. Same finding as appg-002: no such passage exists in the 1725 work. The phrase 'that degree of accuracy which the human senses' has no attestation anywhere. Remove the quotation."

- id: appg-004
  type: date
  status: verified
  text: "His 44-year tenure at Greenwich (1675–1719) set the standard for continuous, careful observation that characterized the Observatory for centuries (Chapter 2)."
  source: "Royal Museums Greenwich, John Flamsteed biography: https://www.rmg.co.uk/stories/space-astronomy/who-was-john-flamsteed-first-astronomer-royal ; Britannica: https://www.britannica.com/biography/John-Flamsteed"
  note: "Dates correct. Flamsteed was appointed the King's astronomical observator on 4 March 1675 and held the post until his death on 31 December 1719, so 44 years is right. Nuance: the Greenwich building was inaugurated in 1676 and Flamsteed moved in that July, so his tenure at Greenwich itself is a year shorter. Prefer '44 years as Astronomer Royal (1675-1719)'."

- id: appg-005
  type: date
  status: corrected
  text: "From Bradley's Letter on a New Discovered Motion of the Fixed Stars (1728):"
  source: "James Bradley, 'IV. A Letter from the Reverend Mr. James Bradley Savilian Professor of Astronomy at Oxford, and F.R.S. to Dr. Edmond Halley Astronom. Reg. &c. giving an Account of a new discovered Motion of the Fix'd Stars', Philosophical Transactions of the Royal Society of London, vol. 35, no. 406 (1727-1728), pp. 637-661. Scan: https://archive.org/details/philtrans02540261 ; issue: https://royalsocietypublishing.org/rstl/issue/35/406"
  note: "Title is wrong. The work exists but is titled 'A Letter from the Reverend Mr. James Bradley ... to Dr. Edmond Halley ... giving an Account of a new discovered Motion of the Fix'd Stars', Phil. Trans. vol. 35, no. 406 (1727-1728), pp. 637-661. Replace the invented short title with the real one, or cite it in short form as Bradley's 1728 letter to Halley."

- id: appg-006
  type: date
  status: corrected
  text: "quote ``In the year 1725, in December, I observed with a zenith-sector, placed in the vertical to the star $ $ Draconis, which passed almost through my Zenith."
  source: "James Bradley, 'IV. A Letter from the Reverend Mr. James Bradley Savilian Professor of Astronomy at Oxford, and F.R.S. to Dr. Edmond Halley Astronom. Reg. &c. giving an Account of a new discovered Motion of the Fix'd Stars', Philosophical Transactions of the Royal Society of London, vol. 35, no. 406 (1727-1728), pp. 637-661. Scan: https://archive.org/details/philtrans02540261 ; issue: https://royalsocietypublishing.org/rstl/issue/35/406"
  note: "FABRICATED, and factually wrong. The letter opens 'SIR, YOU having been pleafed to exprefs your Satisfaction with what I had an Opportunity fometime ago, of telling you in Converfation...'. The December 1725 observations were made with Samuel Molyneux's zenith sector at Kew, not Bradley's own: 'Mr. Molyneux's Apparatus was compleated and fitted for obferving about the End of November 1725, and on the third Day of December following, the bright Star in the Head of Draco (marked gamma by Bayer) was for the firft Time obferved'. Bradley's own sector at Wanstead dates from August 1727."

- id: appg-007
  type: quotation
  status: corrected
  text: "After many observations, I found that the changes in the star's position corresponded exactly to the annual changes in the Earth's velocity in its orbit; and this could not be otherwise than the result of the finite velocity of light combined with the Earth's orbital motion.'' quote"
  source: "James Bradley, 'IV. A Letter from the Reverend Mr. James Bradley Savilian Professor of Astronomy at Oxford, and F.R.S. to Dr. Edmond Halley Astronom. Reg. &c. giving an Account of a new discovered Motion of the Fix'd Stars', Philosophical Transactions of the Royal Society of London, vol. 35, no. 406 (1727-1728), pp. 637-661. Scan: https://archive.org/details/philtrans02540261 ; issue: https://royalsocietypublishing.org/rstl/issue/35/406"
  note: "FABRICATED. Bradley's actual statement is 'At laft I conjectured, that all the Phaenomena hitherto mentioned, proceeded from the progreffive Motion of Light and the Earth's annual Motion in its Orbit.' He reached it only after ruling out observational error, instrumental change, nutation, the plumb-line and refraction. The printed text also misstates the physics: the displacement follows the direction of the Earth's velocity, not changes in its magnitude."

- id: appg-008
  type: date
  status: corrected
  text: ": Bradley's 1725 discovery of stellar aberration proved heliocentrism through direct observational evidence and simultaneously determined the speed of light via parallactic displacement."
  source: "James Bradley, 'IV. A Letter from the Reverend Mr. James Bradley Savilian Professor of Astronomy at Oxford, and F.R.S. to Dr. Edmond Halley Astronom. Reg. &c. giving an Account of a new discovered Motion of the Fix'd Stars', Philosophical Transactions of the Royal Society of London, vol. 35, no. 406 (1727-1728), pp. 637-661. Scan: https://archive.org/details/philtrans02540261 ; issue: https://royalsocietypublishing.org/rstl/issue/35/406"
  note: "Two errors. December 1725 is when the anomalous motion was first noticed; Bradley did not identify it as aberration until 1728. And 'parallactic displacement' is the wrong mechanism, which was Bradley's own central point. He derived a light travel time from Sun to Earth of 8 min 12 s, between Roemer's about 11 min and the about 7 min others had inferred."

- id: appg-009
  type: quotation
  status: verified
  text: "The aberration amplitude of 20.5 arcseconds provided both a proof of Earth's motion and a measurement of light's finite velocity (Chapter 12)."
  source: "James Bradley, 'IV. A Letter from the Reverend Mr. James Bradley Savilian Professor of Astronomy at Oxford, and F.R.S. to Dr. Edmond Halley Astronom. Reg. &c. giving an Account of a new discovered Motion of the Fix'd Stars', Philosophical Transactions of the Royal Society of London, vol. 35, no. 406 (1727-1728), pp. 637-661. Scan: https://archive.org/details/philtrans02540261 ; issue: https://royalsocietypublishing.org/rstl/issue/35/406"
  note: "Acceptable as the modern constant of aberration (20.4955 arcsec), but it is not Bradley's figure. He measured a total annual range of 40.4 arcsec for gamma Draconis, giving a semi-amplitude of 20.2 arcsec. If the sentence describes Bradley's result, use 20.2."

- id: appg-010
  type: date
  status: verified
  text: "From Maskelyne's preface to the first Nautical Almanac (1767):"
  source: "The Nautical Almanac and Astronomical Ephemeris, for the Year 1767, published by order of the Commissioners of Longitude, London: W. Richardson and S. Clark, 1766. Preface signed 'NEVIL MASKELYNE, Astronomer Royal'. Scan: https://archive.org/details/the-nautical-almanac-and-astronomical-ep"
  note: "Source exists and the attribution is sound: the preface to the Almanac for 1767 is signed 'NEVIL MASKELYNE, Astronomer Royal'. Note for the bibliography that the Almanac for 1767 was published in 1766. The quotation attached to this citation is fabricated; see appg-011 and the critique."

- id: appg-011
  type: date
  status: corrected
  text: ": Maskelyne's 1767 publication of the Nautical Almanac represented the first systematic application of astronomical observations to a practical navigation problem."
  source: "The Nautical Almanac and Astronomical Ephemeris, for the Year 1767, published by order of the Commissioners of Longitude, London: W. Richardson and S. Clark, 1766. Preface signed 'NEVIL MASKELYNE, Astronomer Royal'. Scan: https://archive.org/details/the-nautical-almanac-and-astronomical-ep"
  note: "Overstated superlative. Lunar-distance and Jovian-satellite methods were applied systematically to longitude well before 1766, and the preface itself presents the Almanac as removing the computational obstacle to an existing method, not as inventing the application. Suggest 'the first sustained, state-funded ephemeris produced specifically for navigators'."

- id: appg-012
  type: date
  status: corrected
  text: "From Airy's On the Determination of the Differential Refraction at Different Altitudes (1842):"
  source: "Royal Society, Catalogue of Scientific Papers (1800-1863), vol. 1, Airy entries nos. 44-59: https://archive.org/details/catalogueofscien01royarich . Airy's actual work on error analysis: George Biddell Airy, On the Algebraical and Numerical Theory of Errors of Observations and the Combination of Observations, London: Macmillan, 1861: https://archive.org/details/onalgebraicalnum00airyrich"
  note: "FABRICATED: this work does not exist. The Royal Society Catalogue of Scientific Papers lists Airy's output exhaustively; entries 44-59 cover 1839-1845 and contain no refraction paper. Searching Airy's whole entry for 'refract' returns only three hits, all 1830-1833 and all on the double refraction of quartz. Delete the citation. Use the 1861 Errors of Observations treatise instead."

- id: appg-013
  type: quotation
  status: corrected
  text: "I have found that different observers exhibit different systematic biases in their perception of the instant of transit; this I term the 'personal equation.' By comparing observations of the same celestial objects made by different observers, one may determine each observer's personal equation and thereby correct observations to a common standard."
  source: "Royal Society, Catalogue of Scientific Papers (1800-1863), vol. 1, Airy entries nos. 44-59: https://archive.org/details/catalogueofscien01royarich . Airy's actual work on error analysis: George Biddell Airy, On the Algebraical and Numerical Theory of Errors of Observations and the Combination of Observations, London: Macmillan, 1861: https://archive.org/details/onalgebraicalnum00airyrich"
  note: "FABRICATED, and misattributes the concept. Airy neither coined 'personal equation' nor discovered the effect: it was identified at Greenwich in 1796 when Maskelyne found his assistant David Kinnebrook recording transits late, and established as a measurable observer constant by F. W. Bessel in 1823. The passage is also anachronistic, since 'standard deviation' was coined by Karl Pearson in 1894."

- id: appg-014
  type: date
  status: verified
  text: "His Airy transit circle (1851) embodied these principles through carefully designed mechanics to minimize systematic errors."
  source: "Royal Museums Greenwich, Airy Transit Circle: https://www.rmg.co.uk/royal-observatory/attractions/airy-transit-circle-telescope"
  note: "Correct. The Airy Transit Circle was designed by Airy and its first observation was taken on 4 January 1851."

- id: appg-015
  type: date
  status: verified
  text: "From the Proceedings of the International Meridian Conference (1884, Washington, DC):"
  source: "International Conference Held at Washington for the Purpose of Fixing a Prime Meridian and a Universal Day. October, 1884. Protocols of the Proceedings, Washington: Gibson Bros., 1884. Full text: https://www.gutenberg.org/ebooks/17759"
  note: "Conference and proceedings confirmed: the International Meridian Conference met in Washington, DC in October 1884, and its Final Act was adopted on 22 October 1884. The resolution text attributed to it in the appendix is fabricated; see appg-016 and appg-017."

- id: appg-016
  type: superlative
  status: corrected
  text: "quote ``RESOLVED: That the following ten meridians be designated as the basis for the reckoning of longitude and as the first meridians of the respective countries:"
  source: "International Conference Held at Washington for the Purpose of Fixing a Prime Meridian and a Universal Day. October, 1884. Protocols of the Proceedings, Washington: Gibson Bros., 1884. Full text: https://www.gutenberg.org/ebooks/17759"
  note: "FABRICATED. The Final Act contains seven resolutions, none resembling this. Resolution II reads: 'That the Conference proposes to the Governments here represented the adoption of the meridian passing through the centre of the transit instrument at the Observatory of Greenwich as the initial meridian for longitude.' No resolution mentions ten meridians, and the printed text then lists only two items. The phrases 'geographic work' and 'can be made immediately' do not occur anywhere in the proceedings."

- id: appg-017
  type: quotation
  status: corrected
  text: "Furthermore, recognizing the close relationship between longitude and time, the conference recommends the adoption of a 'universal day' of twenty-four hours, beginning at midnight on the mean solar time of the prime meridian, and extending eastward, with the boundary lines of time zones following, as closely as possible, meridians at intervals of 15°.'' quote"
  source: "International Conference Held at Washington for the Purpose of Fixing a Prime Meridian and a Universal Day. October, 1884. Protocols of the Proceedings, Washington: Gibson Bros., 1884. Full text: https://www.gutenberg.org/ebooks/17759"
  note: "FABRICATED, and the most consequential error in the appendix. The conference adopted no time-zone resolution. Resolution V reads: 'That this universal day is to be a mean solar day; is to begin for all the world at the moment of mean midnight of the initial meridian, coinciding with the beginning of the civil day and date of that meridian; and is to be counted from zero up to twenty-four hours.' Searching the full proceedings for '15 degrees', 'fifteen degrees', 'time zone' and 'time-zone' yields only four hits, all in delegates' speeches, none in an adopted resolution."

- id: appg-018
  type: date
  status: corrected
  text: ": The 1884 Meridian Conference established global standards for both geographic and temporal measurement."
  source: "International Conference Held at Washington for the Purpose of Fixing a Prime Meridian and a Universal Day. October, 1884. Protocols of the Proceedings, Washington: Gibson Bros., 1884. Full text: https://www.gutenberg.org/ebooks/17759"
  note: "The claim as worded is defensible, but the next sentence in the same context paragraph is false: the conference did not define 24 hourly time zones. Suggested repair for the paragraph: 'By adopting Greenwich as the prime meridian and defining a universal day counted from mean midnight at that meridian, the conference created the framework on which national time-zone systems were subsequently built.'"

