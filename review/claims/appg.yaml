- id: appg-020
  type: date
  status: corrected
  text: "quote ``We observed the positions of stars near the Sun's disk during the total solar eclipse of May 29, 1919, from two sites: Príncipe Island (Gulf of Guinea) and Sobral, Brazil."
  source: "F. W. Dyson, A. S. Eddington and C. Davidson, 'IX. A Determination of the Deflection of Light by the Sun's Gravitational Field, from Observations made at the Total Eclipse of May 29, 1919', Philosophical Transactions of the Royal Society of London, Series A, vol. 220 (1920), pp. 291-333. Scan: https://archive.org/details/philtrans06337895 ; publisher: https://royalsocietypublishing.org/rsta/article/220/571-581/291/40498"
  note: "FABRICATED wording, and the method is misdescribed. The two sites are correct. But comparison plates were taken after the eclipse only at Sobral, where the party returned on 9 July; the Principe comparison photographs were taken at Oxford by F. A. Bellamy before the instrument was dismounted and shipped, that is, before the eclipse."

- id: appg-021
  type: quotation
  status: corrected
  text: "The mean displacements of star positions, as observed during eclipse, agreed closely with Einstein's prediction of light deflection: approximately 1.75 arc-seconds for stars at the solar limb, compared to Einstein's theoretical prediction of 1.745 arc-seconds."
  source: "F. W. Dyson, A. S. Eddington and C. Davidson, 'IX. A Determination of the Deflection of Light by the Sun's Gravitational Field, from Observations made at the Total Eclipse of May 29, 1919', Philosophical Transactions of the Royal Society of London, Series A, vol. 220 (1920), pp. 291-333. Scan: https://archive.org/details/philtrans06337895 ; publisher: https://royalsocietypublishing.org/rsta/article/220/571-581/291/40498"
  note: "FABRICATED, and the numbers are inverted. The paper reports three determinations: 1.98 +/- 0.12 arcsec (Sobral 4-inch), 1.61 +/- 0.305 arcsec (Principe), and 0.93 arcsec (Sobral astrographic, set aside as discordant). None is 1.75. Einstein's prediction is given in the paper as 1.75 arcsec, stated three times; '1.745' appears nowhere. The appendix reports the prediction as the measurement and invents a spuriously precise prediction beside it."

- id: appg-022
  type: date
  status: corrected
  text: ": The 1919 eclipse observations provided the first direct experimental evidence for Einstein's general relativity."
  source: "F. W. Dyson, A. S. Eddington and C. Davidson, 'IX. A Determination of the Deflection of Light by the Sun's Gravitational Field, from Observations made at the Total Eclipse of May 29, 1919', Philosophical Transactions of the Royal Society of London, Series A, vol. 220 (1920), pp. 291-333. Scan: https://archive.org/details/philtrans06337895 ; publisher: https://royalsocietypublishing.org/rsta/article/220/571-581/291/40498"
  note: "Overstated. General relativity's first empirical success was the 1915 explanation of the anomalous perihelion precession of Mercury. The 1919 eclipse was the first confirmation of a novel prediction and the first direct measurement of gravitational light deflection. Suggest rewording to that effect."
