- id: apph-001
  type: date
  status: verified
  text: "This appendix presents three parallel chronologies: (H.1) Master timeline of key astronomical, navigational, and timekeeping events (1675–present); (H.2) Timeline of major instruments; (H.3) Tenures of the Astronomers Royal."
  source: "Royal Museums Greenwich, 'History of the Royal Observatory', https://www.rmg.co.uk/stories/space-astronomy/history-royal-observatory"
  note: "Scope statement matches the sections as written. Observatory founded by royal warrant 22 June 1675, so 1675 is the correct start."

- id: apph-002
  type: measurement
  status: corrected
  text: "Tenure Data: 15 Astronomers Royal spanning 350 years."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Sixteen, not fifteen. Michele Dougherty was appointed Astronomer Royal in July 2025, succeeding Martin Rees. Span 1675-2026 is 351 years. UK government press release 30 July 2025: https://www.gov.uk/government/news/astronomer-royal-30th-july-2025"

- id: apph-003
  type: measurement
  status: verified
  text: "Longest single tenure: Maskelyne and Airy (46 years each)."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Maskelyne 1765-1811 and Airy 1835-1881 are both 46 years; no other tenure reaches 46."

- id: apph-004
  type: measurement
  status: corrected
  text: "Most astronomers served 15–30 years, allowing long-term observational program continuity."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Eight of sixteen fall in 15-30 years (Halley 22, Bradley 20, Pond 24, Christie 29, Dyson 23, Spencer Jones 22, Woolley 15, Rees 30). That is exactly half, not 'most'."

- id: apph-005
  type: measurement
  status: verified
  text: "Three served over 40 years, providing stable institutional leadership across major scientific transitions."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct: Flamsteed 44, Maskelyne 46, Airy 46. Average tenure recomputed over 16 holders is 21.6 years, so the companion claim of 'approximately 23 years' should read approximately 22 years."

- id: apph-006
  type: chronology
  status: verified
  text: "1675: King Charles II establishes Greenwich Observatory; John Flamsteed appointed first Astronomer Royal. Mission: improve lunar theory for navigation; develop star catalog."
  source: "Royal Museums Greenwich, 'History of the Royal Observatory', https://www.rmg.co.uk/stories/space-astronomy/history-royal-observatory"
  note: "Flamsteed appointed 4 March 1675; founding warrant 22 June 1675; foundation stone 10 August 1675."

- id: apph-007
  type: chronology
  status: corrected
  text: "1689: Flamsteed mural arc installed at Greenwich (diameter 2.1 m); becomes tool for systematic star position measurements."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045"
  note: "Year correct: built by Abraham Sharp from 1688, first observation 11 September 1689. But 2.0 m is the RADIUS (79.5 inches), not the diameter, and the instrument is a graduated arc of about 140 degrees, so 'diameter' is the wrong term. Read: 'radius 2.0 m'."

- id: apph-008
  type: chronology
  status: corrected
  text: "1725: James Bradley discovers stellar aberration using zenith sector observations of Draconis; proves heliocentrism and measures light's finite velocity ( 20.5 arcseconds displacement)."
  source: "J. Bradley, letter to Edmond Halley read to the Royal Society 9 and 16 January 1729, Philosophical Transactions; https://repository.ou.edu/uuid/3e237eea-d8dc-5bd3-8412-6d41e34f45a0"
  note: "Wrong year. December 1725 is when Bradley BEGAN the gamma Draconis observations, at Samuel Molyneux's house at Kew. He explained the effect as aberration in 1728 and announced it to the Royal Society in January 1729. Date the discovery 1728 (announced 1729). Constant of aberration 20.5 arcsec is correct. Chapter 12 already places the 1725 observations at Kew, so the appendix contradicts it."

- id: apph-009
  type: chronology
  status: corrected
  text: "1727: Bradley constructs zenith sector at Greenwich; achieves unprecedented ±1 arcsecond accuracy in positional measurements."
  source: "Royal Observatory Greenwich, \"Telescope: Bradley's 12.5-foot Zenith Sector (1727)\", https://www.royalobservatorygreenwich.org/articles.php?article=1065"
  note: "Wrong location. The 12.5-foot zenith sector was made by George Graham in 1727 for Bradley's use at his uncle's private observatory at Wanstead, not at Greenwich. Bradley bought it for Greenwich in 1749 for 45 pounds, seven years after becoming Astronomer Royal. He was not at Greenwich in 1727."

- id: apph-010
  type: chronology
  status: verified
  text: "1748: Bradley discovers nutation (18.6-year wobble of Earth's rotational axis); refines precession constant from Hipparchus-era estimates."
  source: "MacTutor, 'James Bradley', https://mathshistory.st-andrews.ac.uk/Biographies/Bradley/"
  note: "Bradley announced nutation in 1748 after a full 18.6-year lunar nodal cycle of observation, and received the Copley Medal for it that year."

- id: apph-011
  type: chronology
  status: corrected
  text: "1750: John Bird constructs 8-foot quadrant at Oxford; portable instrument design allows observations from multiple sites for parallax measurements."
  source: "Royal Observatory Greenwich, \"Telescope: Bradley's 8-foot Brass Mural Quadrant (1750)\", https://www.royalobservatorygreenwich.org/articles.php?article=1054"
  note: "Wrong place and wrong instrument type. Bird's 8-foot brass quadrant of 1750 was made for Bradley at GREENWICH, mounted 16 February 1750, and it is a MURAL quadrant fixed to a wall. It was not portable and was not used for multi-site parallax work. The portability and parallax clauses should be struck."

- id: apph-012
  type: chronology
  status: verified
  text: "1767: Nevil Maskelyne establishes Nautical Almanac; first systematic publication of lunar distances and ephemerides for maritime navigation. Enables longitude determination without mechanical chronometer."
  source: "HM Nautical Almanac Office, 'The Nautical Almanac and its Superintendents', https://astro.ukho.gov.uk/nao/history/nao_1767.html"
  note: "Substantially right, with a nuance worth a footnote: the first volume was The Nautical Almanac and Astronomical Ephemeris for the Year 1767; it carries an imprint date of 1766 and copies arrived from the printer on 6 January 1767. Note that chapter 10 says 'first published in 1767 for the year 1768', which is wrong and should be fixed there."

- id: apph-013
  type: chronology
  status: corrected
  text: "1770: John Harrison develops marine chronometer H5; achieves ±0.4 seconds/day rate stability; validates chronometric longitude determination method."
  source: "Royal Museums Greenwich / National Maritime Museum, 'John Harrison and the Longitude Problem'; Kew trial May-July 1772"
  note: "The rate figure is attached to the wrong year and is not the book's own figure. H5 was completed in 1770 but was not trialled until May-July 1772, at the King's Observatory at Kew, where George III recorded a loss of about one-third of a second per day. Chapter 9 states the trial error as 4.5 seconds over ten weeks, which is 0.06 s/day. The appendix's 0.4 s/day matches neither. Pick one figure, cite the 1772 trial, and reconcile with chapter 9."

- id: apph-014
  type: chronology
  status: verified
  text: "1783: William Herschel constructs 20-foot reflector telescope; begins systematic survey of stellar positions and motion."
  source: "Herschel's large 20-foot reflector, completed 1783; sweeps began 23 October 1783"
  note: "Year correct. Herschel completed the large 20-foot reflector in 1783 and began his systematic sweeps on 23 October 1783. The survey was of nebulae and double stars rather than 'stellar positions and motion'; his solar apex result also dates from 1783."

- id: apph-015
  type: chronology
  status: corrected
  text: "1789: Herschel completes 40-foot reflector (490 mm aperture); largest telescope of the era; extends observational reach for faint objects."
  source: "Science Museum Group, 'Original mirror for William Herschel's forty-foot telescope, 1785', https://collection.sciencemuseumgroup.org.uk/objects/co56770"
  note: "Aperture wrong by a factor of 2.5. The 40-foot telescope's speculum mirror was 48 inches across, that is 1220 mm, not 490 mm. Year 1789 is correct: it was functional that year and found Enceladus on 28 August 1789."

- id: apph-016
  type: chronology
  status: corrected
  text: "1821: Hipparcos introduces systematic parallax measurement method; establishes framework for determining stellar distances."
  source: "ESA, 'Hipparcos Fact Sheet', https://sci.esa.int/web/hipparcos/-/47357-fact-sheet"
  note: "Anachronism; this entry describes nothing real. Hipparcos is an ESA astrometric satellite launched 8 August 1989. There is no 1821 Hipparcos and no 1821 event of this kind. Delete the entry or replace it with a real 1820s milestone, for example Bessel's Fundamenta Astronomiae (1818) or the founding of the Royal Astronomical Society (1820)."

- id: apph-017
  type: chronology
  status: verified
  text: "1838: Friedrich Wilhelm Bessel measures first stellar parallax (61 Cygni, 0.3 arcseconds); confirms heliocentric model and determines stellar distances."
  source: "F. W. Bessel, Astronomische Nachrichten, 1838; announced December 1838"
  note: "Correct. Bessel's 61 Cygni parallax was 0.314 arcsec (modern value 0.286 arcsec), so 'approximately 0.3 arcseconds' is fair."

- id: apph-018
  type: chronology
  status: corrected
  text: "1840: Friedrich Wilhelm Struve measures proper motions of 3,000 stars; establishes kinematic structure of stellar neighborhood."
  source: "Britannica, 'Friedrich Georg Wilhelm von Struve', https://www.britannica.com/biography/Friedrich-Georg-Wilhelm-von-Struve"
  note: "Conflates two different results. The 3,000-star figure is Struve's DOUBLE STAR count: 3,112 binaries in Stellarum Duplicium Mensurae Micrometricae (1837), from a survey of 120,000 stars. Struve did not publish proper motions of 3,000 stars in 1840. His 1840 result of note is the Vega parallax. Rewrite or delete."

- id: apph-019
  type: chronology
  status: verified
  text: "1842: Christian Doppler predicts wavelength shift for moving sources (Doppler effect); theoretical foundation for spectroscopic determination of radial velocities."
  source: "C. Doppler, 'Ueber das farbige Licht der Doppelsterne', 1842"
  note: "Correct."

- id: apph-020
  type: chronology
  status: verified
  text: "1845: John Couch Adams and Urbain Le Verrier predict Neptune's position from gravitational perturbations on Uranus; discovery (September 1846) validates gravitational theory and demonstrates predictive power of Newtonian mechanics."
  source: "Discovery by Galle and d'Arrest, 23 September 1846, from Le Verrier's prediction"
  note: "Correct. Adams' first solution September 1845, Le Verrier's memoir 31 August 1846, discovery 23 September 1846."

- id: apph-021
  type: chronology
  status: verified
  text: "1851: George Airy completes Airy transit circle at Greenwich; achieves ±0.5 arcsecond accuracy via micrometer refinements. Becomes gold standard for positional astronomy for 100+ years."
  source: "Royal Observatory Greenwich, \"Telescope: Airy's Transit Circle (1850)\", https://www.royalobservatorygreenwich.org/articles.php?article=1234"
  note: "First observation 4 January 1851. Note the instrument was INSTALLED in 1850 and first used in 1851; chapter 17 says 'installed in 1850' and chapter 22 says 'completed in 1851'. Both are defensible but the book should say the same thing in both places."

- id: apph-022
  type: chronology
  status: unverified
  text: "1858: Airy introduces systematic error analysis methods; develops personal equation corrections for observer bias; establishes statistical uncertainty quantification in observational astronomy."
  source: ""
  note: "No event corresponds to 1858. Airy's personal-equation work at Greenwich runs from the 1830s onwards and cannot be pinned to this year. Either supply a citation for a specific 1858 publication or delete the entry. Chapter 13 dates the personal-equation episode to December 1851."

- id: apph-023
  type: chronology
  status: verified
  text: "1868: Pierre Janssen and Norman Lockyer independently discover helium in the solar spectrum; first element identified in stellar spectrum before terrestrial discovery."
  source: "Janssen, solar eclipse of 18 August 1868 (India); Lockyer, 20 October 1868"
  note: "Correct."

- id: apph-024
  type: chronology
  status: verified
  text: "1881: George Airy retires after 46 years as Astronomer Royal; leaves legacy of systematic observational protocols and error analysis methods."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Airy was Astronomer Royal 1835-1881, which is 46 years."

- id: apph-025
  type: chronology
  status: verified
  text: "1884: International Meridian Conference (Washington, DC) establishes Greenwich as Prime Meridian (0° longitude); defines 24 hourly time zones; adopts Greenwich Mean Time (GMT) as international standard. Enables global timekeeping coordination."
  source: "Proceedings of the International Meridian Conference, Washington DC, October 1884"
  note: "Year, place and prime-meridian resolution correct. Two overstatements: the conference adopted a universal day counted from Greenwich mean midnight, it did not itself define the 24 time zones (those came from national legislation over following decades), and it did not make GMT a binding international standard. Soften the wording."

- id: apph-026
  type: chronology
  status: verified
  text: "1887: Michelson-Morley experiment fails to detect ``luminiferous ether,'' contradicting expected light propagation model; seeds doubts about absolute spacetime framework."
  source: "Michelson and Morley, American Journal of Science, 1887"
  note: "Correct."

- id: apph-027
  type: chronology
  status: unverified
  text: "1888: Jacobus Kapteyn catalogs 24,865 bright stars; initiates modern large-scale stellar surveys."
  source: "Britannica, 'Cape Photographic Durchmusterung', https://www.britannica.com/topic/Cape-Photographic-Durchmusterung"
  note: "The figures match no known Kapteyn result. Kapteyn measured David Gill's Cape plates from 1886 to 1896; the Cape Photographic Durchmusterung contains 454,875 stars and was published 1896-1900. There is no 1888 catalogue of 24,865 bright stars. Rewrite with the CPD figures or delete."

- id: apph-028
  type: chronology
  status: corrected
  text: "1900: Photographic zenith tube introduced at Greenwich; automates star position recording; reduces personal observation errors compared to visual methods."
  source: "Royal Observatory Greenwich, 'Telescope: Photographic Zenith Tube (1955)', https://www.royalobservatorygreenwich.org/articles.php?article=1071"
  note: "Wrong by 55 years and wrong place. The photographic zenith tube was invented by Frank Elmore Ross in 1911. The Royal Greenwich Observatory's PZT began operating in 1955, at HERSTMONCEUX, not at Greenwich, and ceased on 30 June 1984. Nothing of this kind existed at Greenwich in 1900."

- id: apph-029
  type: chronology
  status: verified
  text: "1905: Albert Einstein publishes special theory of relativity; predicts time dilation and E = mc^2; reshapes understanding of space, time, and matter."
  source: "A. Einstein, Annalen der Physik, 1905"
  note: "Correct."

- id: apph-030
  type: chronology
  status: corrected
  text: "1910: William Henry Mahoney Christie becomes Astronomer Royal; initiates transition to photographic techniques; coordinates international Astrographic Catalogue project (21 observatories)."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Wrong man and wrong direction. Christie was Astronomer Royal from 1881 to 1910; 1910 is when he LEFT. Frank Watson Dyson became Astronomer Royal in 1910. The appendix's own tenure table (1881-1910 Christie) and chapter 14 ('William Henry Mahoney Christie (1881--1910)') both contradict this line. The Astrographic Catalogue congress met in 1887 and 18 observatories agreed to take part, not 21."

- id: apph-031
  type: chronology
  status: verified
  text: "1913: Henry Norris Russell correlates stellar spectral types with luminosities; establishes Hertzsprung-Russell diagram framework for stellar classification."
  source: "H. N. Russell, presented 1913, published Popular Astronomy 1914"
  note: "Broadly correct, though the diagram is jointly Hertzsprung's (1911) and Russell's (1913)."

- id: apph-032
  type: chronology
  status: verified
  text: "1915: Albert Einstein publishes general theory of relativity; predicts gravitational lensing and light deflection near massive objects."
  source: "A. Einstein, 'Die Feldgleichungen der Gravitation', November 1915"
  note: "Correct."

- id: apph-033
  type: chronology
  status: verified
  text: "1919: Arthur Eddington leads solar eclipse expedition; measures star position shifts near Sun during totality. Results confirm Einstein's light deflection prediction (±1.75 arcseconds), validating general relativity and demonstrating observational astronomy's role in fundamental physics. Major paradigm shift."
  source: "Dyson, Eddington and Davidson, Philosophical Transactions A 220 (1920), 291-333"
  note: "Event correct but the number is misused. 1.75 arcsec is the PREDICTED deflection at the solar limb, not an uncertainty; writing it as plus-or-minus 1.75 arcseconds is wrong. The measured values were 1.98 +/- 0.16 arcsec (Sobral) and 1.61 +/- 0.40 arcsec (Principe). Note also that Astronomer Royal Dyson organised the expeditions; Eddington led the Principe party."

- id: apph-034
  type: chronology
  status: verified
  text: "1923: Edwin Hubble identifies Andromeda as separate galaxy (Cepheid variable distance measurements); extends observable universe beyond Milky Way."
  source: "Hubble's Cepheid plate of M31, 5-6 October 1923; announced 1 January 1925"
  note: "Correct as a date of identification; the public announcement was January 1925."

- id: apph-035
  type: chronology
  status: verified
  text: "1929: Edwin Hubble discovers cosmic expansion (Hubble's law: recession velocity proportional to distance); suggests Big Bang origin of universe."
  source: "E. Hubble, PNAS 15 (1929), 168"
  note: "Correct."

- id: apph-036
  type: chronology
  status: verified
  text: "1933: Harold Hemley Spencer Jones becomes Astronomer Royal; discovers decade-scale variations in Earth's rotation rate; introduces correction terms to astronomical ephemerides."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Spencer Jones was Astronomer Royal 1933-1955."

- id: apph-037
  type: chronology
  status: verified
  text: "1938: Hans Bethe and Charles Critchfield explain stellar energy generation via nuclear fusion; foundation for stellar structure theory."
  source: "Bethe and Critchfield, Physical Review 54 (1938), 248"
  note: "Correct."

- id: apph-038
  type: chronology
  status: verified
  text: "1945: End of World War II; Greenwich Observatory survives bombing campaign; time service continues supporting military operations."
  source: "Royal Observatory Greenwich, 'The Herstmonceux years 1948-1990', https://www.royalobservatorygreenwich.org/articles.php?article=5"
  note: "Broadly correct. Greenwich took bomb damage in 1940 and V-weapon damage in 1944 and the time service continued. Chapter 23 covers the same period and does not conflict."

- id: apph-039
  type: chronology
  status: corrected
  text: "1955: Cesium beam atomic clock becomes international standard for the second; frequency defined as 9,192,631,770 Hz cesium transition. Atomic time (TAI) replaces rotational-based time standards."
  source: "BIPM, Resolution 1 of the 13th CGPM (1967); NPL, Essen and Parry caesium clock 1955"
  note: "Three separate dates collapsed into one. 1955 is when Essen and Parry built the first practical caesium clock at NPL. The SI second was redefined as 9,192,631,770 caesium periods by the 13th CGPM in 1967. International Atomic Time was defined by the CIPM in 1970 and recognised by the 14th CGPM in 1971. Split the entry."

- id: apph-040
  type: chronology
  status: verified
  text: "1957: Soviet Union launches Sputnik; begins space age; enables satellite-based timekeeping and navigation systems."
  source: "Sputnik 1 launched 4 October 1957"
  note: "Correct."

- id: apph-041
  type: chronology
  status: corrected
  text: "1960: Greenwich Observatory celebrates 285 years of continuous observation; Airy transit circle still operational despite mechanical age; photographic zenith tube complements visual observations."
  source: "Royal Observatory Greenwich, 'The Herstmonceux years 1948-1990', https://www.royalobservatorygreenwich.org/articles.php?article=5"
  note: "Three errors. By 1960 the observatory had moved to Herstmonceux (move begun 1948, completed 1957), so there was no continuous observation at Greenwich. The Airy Transit Circle's last observation was 30 March 1954, which the appendix's own instrument entry states, so it was not 'still operational' in 1960. The photographic zenith tube was at Herstmonceux, not Greenwich. Delete or rewrite entirely."

- id: apph-042
  type: chronology
  status: corrected
  text: "1972: Coordinated Universal Time (UTC) defined; replaces Greenwich Civil Time (GCT). UTC maintains 0.9-second connection to UT1 (Earth rotation) via leap seconds, inserted as needed."
  source: "ITU-R / BIPM history of UTC; IAU 1928 resolution replacing Greenwich Civil Time with Universal Time"
  note: "Year correct, details wrong. The leap-second form of UTC began 1 January 1972. UTC did not replace 'Greenwich Civil Time': GCT was superseded in name by Universal Time at the IAU in 1928. The UT1 tolerance in 1972 was 0.7 s; the CCIR widened it to 0.9 s in 1974."

- id: apph-043
  type: chronology
  status: corrected
  text: "1981: Royal Greenwich Observatory relocates to Herstmonceux, Sussex (from Greenwich) for darker skies and astrophysical research. Isaac Newton Telescope (98 cm reflector) installed; marks shift toward modern astrophysics alongside traditional astrometry."
  source: "Royal Observatory Greenwich, 'A Brief History', https://www.royalobservatorygreenwich.org/articles.php?article=1 ; and 'Telescope: Isaac Newton Telescope (1967/1984)', https://www.royalobservatorygreenwich.org/articles.php?article=1335"
  note: "Wrong by decades, and a unit error. The move to Herstmonceux began in 1948 and was completed in 1957; nothing relocated there in 1981. The Isaac Newton Telescope is 98 INCHES (2.5 m), not 98 cm; it was inaugurated at Herstmonceux in 1967 and moved to La Palma in 1984. In 1981 the RGO was still at Herstmonceux and moved to Cambridge in 1990. This entry also contradicts the appendix's own Woolley tenure line, which correctly credits the move to Woolley (1956-1971)."

- id: apph-044
  type: chronology
  status: corrected
  text: "1983: International Committee for Weights and Measures officially redefines the meter in terms of light speed (299,792,458 m/s, defined exactly); establishes length measurement on atomic time standards."
  source: "BIPM, Resolution 1 of the 17th CGPM (1983), https://www.bipm.org/en/committees/cg/cgpm/17-1983/resolution-1"
  note: "Right year, wrong body. The metre was redefined by the 17th Conference Generale des Poids et Mesures (CGPM), not the International Committee for Weights and Measures (CIPM)."

- id: apph-045
  type: chronology
  status: verified
  text: "1986: Multi-wavelength astronomical observations become standard; Halley's Comet observed simultaneously by optical telescopes, radio interferometers, and space probes; demonstrates coordinated global astronomy."
  source: "Halley's Comet perihelion 9 February 1986; Giotto, Vega 1 and 2, Suisei, Sakigake"
  note: "Correct."

- id: apph-046
  type: chronology
  status: unverified
  text: "1992: Royal Greenwich Observatory receives 318-year collection of photographic plates; digitization project begins, preserving archival observations for modern analysis."
  source: "Royal Observatory Greenwich, 'A Brief History', https://www.royalobservatorygreenwich.org/articles.php?article=1"
  note: "Unsupported and internally inconsistent. No source found for a 1992 transfer of a plate collection. The RGO had already moved to Cambridge in April 1990. The '318-year' figure does not work either: 1675 plus 318 is 1993, and photographic plates only date from the 1880s. Supply a citation or delete."

- id: apph-047
  type: chronology
  status: verified
  text: "1995: Martin Rees appointed Astronomer Royal, the fifteenth holder of the office. The Royal Greenwich Observatory, by then in Cambridge, closes in 1998."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct on both counts. Rees was the fifteenth Astronomer Royal, appointed 1995. The Royal Greenwich Observatory, by then in Cambridge, closed at the end of October 1998."

- id: apph-048
  type: chronology
  status: corrected
  text: "2000: IAU adopts J2000.0 epoch (January 1, 2000, 12:00 UT) as standard reference for stellar coordinates; replaces older Besselian epoch systems."
  source: "IAU resolutions, Grenoble 1976; FK5/J2000.0 system effective 1 January 1984"
  note: "Wrong by 24 years. The IAU adopted the J2000.0 epoch and the associated system of constants in 1976 at Grenoble; it came into force on 1 January 1984 with the FK5 catalogue, replacing FK4/B1950.0. Nothing was adopted in the year 2000."

- id: apph-049
  type: chronology
  status: unverified
  text: "2001: International services standardize Earth orientation parameters (polar motion, UT1 variations) via Very Long Baseline Interferometry (VLBI) and lunar laser ranging; accuracies reach microarcsecond level."
  source: ""
  note: "No specific 2001 event identified. The IERS has produced Earth orientation parameters since 1988. 'Microarcsecond level' also overstates it: VLBI polar motion and UT1 are good to tens of microarcseconds. Supply a citation or delete."

- id: apph-050
  type: chronology
  status: corrected
  text: "2009: National Maritime Museum formally recognizes Greenwich Observatory as heritage site and active research facility; balance between historical preservation and contemporary astronomy."
  source: "UNESCO World Heritage List, Maritime Greenwich, inscribed 1997, https://unesco.org.uk/our-network/world-heritage-sites/maritime-greenwich"
  note: "Wrong body and wrong year. Maritime Greenwich, which includes the Royal Observatory, was inscribed as a UNESCO World Heritage Site in 1997. The National Maritime Museum is a sibling institution within Royal Museums Greenwich and does not designate heritage sites. No 2009 event of this kind found."

- id: apph-051
  type: chronology
  status: verified
  text: "2012: Timekeeping debate: International bodies consider abolishing leap second to maintain UTC without discontinuous jumps; Greenwich Observatory contributes historic Earth rotation data to decision-making."
  source: "ITU-R World Radiocommunication Conference, Geneva, January 2012 (decision deferred)"
  note: "Broadly correct: WRC-12 considered and postponed the suppression of the leap second in January 2012. The clause about the Greenwich Observatory contributing data to that decision is unsourced; the RGO had closed in 1998."

- id: apph-052
  type: chronology
  status: corrected
  text: "2016: Gravitational wave detection (LIGO); confirms Einstein's prediction and opens new observational window on universe. Demonstrated the power of precise measurement and coordinated global observations---legacy of Greenwich Observatory's founding mission."
  source: "LIGO Scientific Collaboration, Physical Review Letters 116, 061102 (2016); GW150914 detected 14 September 2015"
  note: "Off by one, and in the classic way: GW150914 was DETECTED on 14 September 2015 and ANNOUNCED on 11 February 2016. Give the detection as 2015, or say '2015 detection, announced 2016'."

- id: apph-053
  type: chronology
  status: verified
  text: "2020: COVID-19 pandemic; National Maritime Museum closes temporarily; remote research and education initiatives expand. Greenwich Observatory archives remain accessible digitally."
  source: "Royal Museums Greenwich closures, March 2020"
  note: "Correct."

- id: apph-054
  type: chronology
  status: corrected
  text: "2024: 350th anniversary of Greenwich Observatory; celebrates continuous observation tradition; archives contain 350 years of systematic astronomical data available for modern reanalysis."
  source: "Royal Museums Greenwich, 'Royal Observatory Greenwich Celebrates 350th Anniversary', https://www.rmg.co.uk/press-release/royal-observatory-greenwich-celebrates-350th-anniversary"
  note: "Off by one year. The Observatory was founded by warrant of 22 June 1675, so the 350th anniversary fell on 22 June 2025 and was marked by Royal Museums Greenwich throughout 2025, not 2024."

- id: apph-055
  type: chronology
  status: corrected
  text: "1689: Flamsteed mural arc (2.1 m diameter), Greenwich. Precision: ±10 arcseconds."
  source: "Royal Observatory Greenwich, \"Telescope: Flamsteed's Mural Arc (1689)\", https://www.royalobservatorygreenwich.org/articles.php?article=1045"
  note: "Year correct (first observation 11 September 1689, made principally by Abraham Sharp). 2.1 m is the RADIUS, not the diameter, and the instrument is an arc of about 140 degrees. The plus-or-minus 10 arcsecond precision figure is not confirmed by any source found; supply a citation."

- id: apph-056
  type: chronology
  status: corrected
  text: "1727: Bradley zenith sector, Greenwich. Precision: ±1 arcsecond. Enables aberration discovery and nutation detection."
  source: "Royal Observatory Greenwich, \"Telescope: Bradley's 12.5-foot Zenith Sector (1727)\", https://www.royalobservatorygreenwich.org/articles.php?article=1065"
  note: "Wrong location. Made by George Graham in 1727 for Wanstead; it came to Greenwich only in 1749 and was used there until 1837. It is a 12.5-foot instrument, which is worth stating. Aberration and nutation were both found with it, but at Wanstead."

- id: apph-057
  type: chronology
  status: corrected
  text: "1750: Bird 8-foot quadrant, Oxford. Precision: ±8 arcseconds. Portable design enables multi-site parallax observations."
  source: "Royal Observatory Greenwich, \"Telescope: Bradley's 8-foot Brass Mural Quadrant (1750)\", https://www.royalobservatorygreenwich.org/articles.php?article=1054"
  note: "Wrong location and wrong description. Bird's 1750 8-foot brass quadrant was a MURAL quadrant mounted at GREENWICH on 16 February 1750 for Bradley. It was wall-mounted and not portable, so the multi-site parallax claim is wrong. The plus-or-minus 8 arcsecond figure is uncited."

- id: apph-058
  type: chronology
  status: corrected
  text: "1783: Herschel 20-foot reflector (190 mm aperture). Speculum metal; enables bright nebulae observation."
  source: "Herschel's large 20-foot reflector, 18.7-inch (475 mm) speculum mirror, completed 1783"
  note: "Aperture wrong by a factor of 2.5. The large 20-foot reflector of 1783 had an 18.7-inch mirror, that is about 475 mm, not 190 mm. Herschel used it for his nebula sweeps from 23 October 1783."

- id: apph-059
  type: chronology
  status: corrected
  text: "1789: Herschel 40-foot reflector (490 mm aperture). Largest telescope of era; structural challenges require significant support."
  source: "Science Museum Group, 'Original mirror for William Herschel's forty-foot telescope, 1785', https://collection.sciencemuseumgroup.org.uk/objects/co56770"
  note: "Aperture wrong by a factor of 2.5. The 40-foot telescope's mirror was 48 inches, that is 1220 mm, not 490 mm. First mirror cast 1785, second and heavier mirror used from 1787, telescope functional 1789."

- id: apph-060
  type: chronology
  status: verified
  text: "1851: Airy transit circle, Greenwich. Precision: ±0.5 arcseconds. Micrometers enable unprecedented precision. Operational until 1954."
  source: "Royal Observatory Greenwich, \"Telescope: Airy's Transit Circle (1850)\", https://www.royalobservatorygreenwich.org/articles.php?article=1234"
  note: "Correct. Installed 1850, first observation 4 January 1851, final observation 30 March 1954. This entry is the reason the 1960 master-timeline entry must be corrected."

- id: apph-061
  type: chronology
  status: corrected
  text: "1900: Photographic zenith tube, Greenwich. Automated star position recording; reduces personal observation bias. Precision: ±0.3 arcseconds."
  source: "Royal Observatory Greenwich, 'Telescope: Photographic Zenith Tube (1955)', https://www.royalobservatorygreenwich.org/articles.php?article=1071"
  note: "Wrong year and wrong site. The RGO's photographic zenith tube was a 10-inch instrument by Grubb Parsons that began operating in 1955 at HERSTMONCEUX and ceased on 30 June 1984. The PZT design dates from Frank Ross in 1911. Nothing of the kind existed at Greenwich in 1900."

- id: apph-062
  type: chronology
  status: corrected
  text: "1967: Isaac Newton Telescope (98 cm reflector), initially Herstmonceux, later La Palma. Computerized pointing and data recording; bridges mechanical and electronic eras."
  source: "Royal Observatory Greenwich, 'Telescope: Isaac Newton Telescope (1967/1984)', https://www.royalobservatorygreenwich.org/articles.php?article=1335"
  note: "Unit error of a factor of 25. The Isaac Newton Telescope is 98 INCHES, that is 2.5 m, and was the largest telescope ever sited in the British Isles. 98 cm would be an unremarkable instrument. Inaugurated at Herstmonceux 1967, observing there ceased 1979, re-erected on La Palma with a 100-inch mirror, second first light 1984."

- id: apph-063
  type: chronology
  status: corrected
  text: "1980: Astrometric satellite Hipparcos launched (ESA); measures 100,000 stellar parallaxes and proper motions with ±1 milliarcsecond precision. Replaces ground-based parallax measurements; establishes modern astrometric reference frame."
  source: "ESA, 'Hipparcos Fact Sheet', https://sci.esa.int/web/hipparcos/-/47357-fact-sheet"
  note: "Wrong by nine years. Hipparcos launched on 8 August 1989, operated November 1989 to March 1993, and the Hipparcos Catalogue holds 118,218 stars at about 1 milliarcsecond. 1980 is not close to any milestone of the mission."

- id: apph-064
  type: chronology
  status: verified
  text: "2013: Gaia satellite (ESA) launched; observes 1 billion stars with microarcsecond accuracy; creates most comprehensive stellar map ever; measures proper motions, distances, and velocities."
  source: "ESA, Gaia launched 19 December 2013"
  note: "Correct. Launched 19 December 2013; about 1.8 billion sources; astrometry at tens of microarcseconds for bright stars."

- id: apph-065
  type: chronology
  status: verified
  text: "1675--1719 (44 years): John Flamsteed. Founding director. Establishes observation protocols; catalogs 3,000 stars. Foundation of modern positional astronomy."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Flamsteed 1675-1719, 44 years. He measured close to 3,000 stars with the mural arc."

- id: apph-066
  type: chronology
  status: verified
  text: "1720--1742 (22 years): Edmond Halley. Continues Flamsteed program; southern star catalog; discovers proper motion. Validates gravitational theory via comet prediction."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Halley 1720-1742, 22 years. He died 14 January 1742."

- id: apph-067
  type: chronology
  status: verified
  text: "1742--1762 (20 years): James Bradley. Discovers aberration and nutation. Makes 60,000+ stellar observations with ±1 arcsecond accuracy. Fundamental validation of heliocentrism."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Bradley 1742-1762, 20 years. He died 13 July 1762. Chapter 12 gives the same dates."

- id: apph-068
  type: chronology
  status: verified
  text: "1762--1764 (2 years): Nathaniel Bliss. Custodian era; maintains Bradley's protocols. Brief tenure during transition."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Bliss 1762-1764, 2 years; he died 2 September 1764. This is the shortest tenure, as the aggregate line says."

- id: apph-069
  type: chronology
  status: verified
  text: "1765--1811 (46 years): Nevil Maskelyne. Longest tenure. Establishes Nautical Almanac (1767); introduces Greenwich Mean Time. Transforms Observatory into practical navigation support institution."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Maskelyne 1765-1811, 46 years. Chapters 7 and 10 both give 1765 for his appointment. The Nautical Almanac date of 1767 carries the nuance noted at apph-012."

- id: apph-070
  type: chronology
  status: verified
  text: "1811--1835 (24 years): John Pond. Maintains Almanac; expands observational programs. Detects early evidence for polar motion."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Pond 1811-1835, 24 years."

- id: apph-071
  type: chronology
  status: verified
  text: "1835--1881 (46 years): George Airy. Second-longest tenure. Designs Airy transit circle; introduces error analysis methods. Establishes modern observational standards; links Greenwich time to telegraph networks."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Airy 1835-1881, 46 years. Chapter 14 gives the same dates."

- id: apph-072
  type: chronology
  status: verified
  text: "1881--1910 (29 years): William Henry Mahoney Christie. Transitions to photographic techniques; coordinates Astrographic Catalogue. Photographic methods reduce personal equation errors."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Christie 1881-1910, 29 years. Chapter 14 agrees. This entry is what the 1910 master-timeline entry contradicts."

- id: apph-073
  type: chronology
  status: verified
  text: "1910--1933 (23 years): Frank Watson Dyson. Famous for 1919 eclipse expedition confirming relativity. Equips Observatory for spectroscopic work; integrates theoretical physics."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Dyson 1910-1933, 23 years. He organised the 1919 eclipse expeditions."

- id: apph-074
  type: chronology
  status: corrected
  text: "1933--1955 (22 years): Harold Hemley Spencer Jones. Discovers Earth rotation variations; improves AU determination. Establishes Greenwich Civil Time (GCT) for coordinated timekeeping."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Dates correct: Spencer Jones 1933-1955, 22 years. But he did not establish Greenwich Civil Time. GCT was a naming convention in use from 1925 and the IAU replaced the term with Universal Time in 1928, five years before he took office. Strike that clause."

- id: apph-075
  type: chronology
  status: verified
  text: "1956--1971 (15 years): Richard van der Riet Woolley. Relocates Observatory from Greenwich to Herstmonceux (darker skies). Transitions toward astrophysics research. Installs Isaac Newton Telescope."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct. Woolley 1956-1971, 15 years. He was the last Astronomer Royal to also direct the Observatory, and the Isaac Newton Telescope was inaugurated in his time (1967). The move to Herstmonceux was begun under Spencer Jones in 1948 and completed in 1957, so 'relocates' is fair for the completion but the move was not solely his."

- id: apph-076
  type: chronology
  status: verified
  text: "1972--1982 (10 years): Martin Ryle. First holder of the title as an honorary appointment separate from the Observatory directorship. Pioneer of aperture-synthesis radio astronomy; Nobel Prize in Physics (1974)."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "Correct on every point. Ryle 1972-1982, 10 years. He was the first Astronomer Royal under the honorary arrangement, the Observatory directorship having passed to a separate director in 1972 after Woolley retired in 1971. Nobel Prize in Physics 1974, shared with Antony Hewish, cited for aperture synthesis: https://www.nobelprize.org/prizes/physics/1974/summary/"

- id: apph-077
  type: chronology
  status: corrected
  text: "1982--1990 (8 years): Francis Graham-Smith. Radio astronomer; earlier Director of the Royal Greenwich Observatory (1975--1981) and of Jodrell Bank (1981--1988). Pulsar research."
  source: "Royal Astronomical Society obituary, 'Sir Francis Graham-Smith, 1923-2025', https://ras.ac.uk/news-and-press/news/sir-francis-graham-smith-1923-2025"
  note: "Astronomer Royal dates 1982-1990 (8 years) are correct, as is Jodrell Bank 1981-1988. The Royal Greenwich Observatory directorship is given variously as 1975-1981 and 1976-1981; most sources say he was appointed in 1976. Verify against the RAS obituary or Who's Who before print and prefer 1976-1981."

- id: apph-078
  type: chronology
  status: verified
  text: "1991--1995 (4 years): Arnold Wolfendale. Cosmic-ray physicist at Durham. President of the Institute of Physics; advocate for science education."
  source: "Institute of Physics obituary, 'Professor Sir Arnold Wolfendale (1927-2020)', https://www.iop.org/physics-community/obituaries/professor-sir-arnold-wolfendale"
  note: "Correct. Wolfendale was Astronomer Royal 1991-1995, 4 years; cosmic-ray physicist at Durham; President of the Institute of Physics 1994-1996. He was also President of the Royal Astronomical Society 1981-1983, which is worth adding."

- id: apph-079
  type: chronology
  status: corrected
  text: "1995--present: Martin Rees. Cosmologist; Master of Trinity College, Cambridge (2004--2012); President of the Royal Society (2005--2010). Longest tenure since Airy."
  source: "Royal Museums Greenwich, 'The Astronomer Royal', https://www.rmg.co.uk/stories/space-astronomy/astronomer-royal"
  note: "No longer current. Rees served 1995-2025, thirty years, and was succeeded by Michele Dougherty, appointed July 2025, the sixteenth Astronomer Royal and the first woman to hold the office. Add a sixteenth entry. UK government press release 30 July 2025: https://www.gov.uk/government/news/astronomer-royal-30th-july-2025 ; Royal Astronomical Society: https://www.ras.ac.uk/news-and-press/news/michele-dougherty-becomes-first-female-astronomer-royal . Trinity 2004-2012 and Royal Society 2005-2010 are correct, and 'longest tenure since Airy' holds at 30 years."
