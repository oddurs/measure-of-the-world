  note: "Correct: general precession completes a cycle in about 25,772 years, so 26,000 is right to the precision given."

- id: ch12-024
  type: measurement
  status: corrected
  text: "The nutation amplitude, derived from perturbation theory, is: MATH where $ = 2 / (18.6 years )$ is the angular frequency of lunar nodal regression, and the amplitude of 9.2 arcseconds results from the relative magnitudes of Earth's moment of inertia, the equatorial bulge, and the lunar mass."
  source: "Encyclopaedia Britannica, Nutation; IERS Conventions (2010)"
  note: "MUST FIX, the two nutation amplitudes are swapped and mislabelled. The principal nutation is 17.2 arcseconds in LONGITUDE and 9.2 arcseconds in OBLIQUITY. The chapter's bullet list says roughly 9.2 arcseconds in longitude and 7.5 arcseconds in obliquity: the 9.2 belongs to obliquity and the 7.5 is not a nutation amplitude at all. The derivation here then attaches 9.2 to a quantity written Delta alpha (nutation), described as longitude, which repeats the same swap. The figure caption and the table row (ch12-043) carry it too. Bradley's own announced figure was about 9 arcseconds, which is the obliquity term, so getting the labels right also gets the history right."

