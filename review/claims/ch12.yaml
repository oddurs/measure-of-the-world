- id: ch12-001
  type: date
  status: unverified
  text: "On a December evening in 1725 at Kew, in the house of Samuel Molyneux, James Bradley lowered his eye to the telescope of a zenith sector and awaited the moment when the star $ $ Draconis would cross the vertical wire."
  source: ""
  note: ""

- id: ch12-002
  type: quotation
  status: unverified
  text: "He had planned this observation with mathematical precision. $ $ Draconis passes nearly overhead at Kew's latitude; if any star would reveal stellar parallax—the tiny shift in position caused by Earth's orbital motion—this should be the one."
  source: ""
  note: ""

- id: ch12-003
  type: measurement
  status: unverified
  text: "For a star 10 parsecs away (a moderate distance by modern standards), the parallax is 0.1 arcsecond—small but potentially measurable with careful observation."
  source: ""
  note: ""

- id: ch12-004
  type: superlative
  status: unverified
  text: "The brightest stars, being relatively nearby, should show the largest parallaxes."
  source: ""
  note: ""

- id: ch12-005
  type: date
  status: unverified
  text: "By 1725, James Bradley and Samuel Molyneux decided to mount a systematic campaign."
  source: ""
  note: ""

- id: ch12-006
  type: attribution
  status: unverified
  text: "When $ $ Draconis crossed the meridian at its highest altitude, Bradley measured its angular distance from the zenith using the sector."
  source: ""
  note: ""

- id: ch12-007
  type: measurement
  status: unverified
  text: "The expected parallax for $ $ Draconis was estimated at roughly 0.3 arcsecond, assuming the star was within a few parsecs."
  source: ""
  note: ""

- id: ch12-008
  type: measurement
  status: unverified
  text: "This was small but detectable: the zenith sector, with its radius of about 12 feet and carefully graduated scale, could resolve motions of a few arcseconds."
  source: ""
  note: ""

- id: ch12-009
  type: date
  status: unverified
  text: "Bradley's observations began in December 1725."
  source: ""
  note: ""

- id: ch12-010
  type: measurement
  status: unverified
  text: "Its north-south position changed by roughly 20 arcseconds over the course of a year."
  source: ""
  note: ""

- id: ch12-011
  type: quotation
  status: unverified
  text: "The pennant was moving not because the wind changed but because the boat's motion combined with the wind's direction to produce a new apparent direction."
  source: ""
  note: ""

- id: ch12-012
  type: quotation
  status: unverified
  text: "Bradley realized that light must work the same way: Earth's motion combines with the direction from which starlight arrives to produce an apparent shift in the star's position."
  source: ""
  note: ""

- id: ch12-013
  type: quotation
  status: unverified
  text: "If light travels at angle $ _0$ to Earth's velocity in the reference frame of the star, then in Earth's reference frame the light appears to come from a different angle $ $."
  source: ""
  note: ""

- id: ch12-014
  type: quotation
  status: unverified
  text: "In Earth's moving reference frame, the photon's velocity is not $ c $ (in Earth's frame light moves at speed $c$ regardless of observer motion, according to special relativity), but the apparent direction from which the photon arrives is shifted due to Earth's motion."
  source: ""
  note: ""

- id: ch12-015
  type: superlative
  status: unverified
  text: "Bradley's measurements confirmed the value to roughly this precision, making his discovery one of the earliest precision verifications of celestial physics."
