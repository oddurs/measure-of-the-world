- id: ch12-008
  type: measurement
  status: corrected
  text: "This was small but detectable: the zenith sector, with its radius of about 12 feet and carefully graduated scale, could resolve motions of a few arcseconds."
  source: "Royal Observatory Greenwich, Bradley's 12.5-foot Zenith Sector (1727), https://www.royalobservatorygreenwich.org/articles.php?article=1065; MacTutor, James Bradley"
  note: "MUST FIX, two instruments conflated. Molyneux's sector at Kew, the one used in December 1725, was made by GEORGE GRAHAM and its telescope was about 24 feet long. It was not built by John Hadley (that error is in the preceding paragraph and must go too), and it is not the 12-foot instrument. The 12.5-foot sector is a DIFFERENT instrument, also by Graham, made in 1727 for Bradley's own use at Wanstead; Bradley later sold it to the Government for 45 pounds when he came to Greenwich in 1742. Appendix G has already established this distinction; the chapter still contradicts it. Also fix the same paragraph's telescope of short focal length: 24 feet is not short."

