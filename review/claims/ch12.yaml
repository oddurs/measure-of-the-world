- id: ch12-019
  type: measurement
  status: unverified
  text: "The cause is gravitational: the Moon orbits Earth in a plane inclined by roughly 5 degrees to Earth's orbital plane (the ecliptic)."
  source: ""
  note: ""

- id: ch12-020
  type: quotation
  status: unverified
  text: "This inclined lunar orbit exerts a torque on Earth's equatorial bulge, causing Earth's rotational axis to wobble."
  source: ""
  note: ""

- id: ch12-021
  type: quotation
  status: unverified
  text: "The wobble has a period of 18.6 years—the period of the Moon's nodal regression (the time it takes for the Moon's ascending and descending nodes to return to the same position relative to the stars)."
