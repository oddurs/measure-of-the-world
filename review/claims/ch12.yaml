- id: ch12-010
  type: measurement
  status: corrected
  text: "Its north-south position changed by roughly 20 arcseconds over the course of a year."
  source: "MacTutor History of Mathematics, James Bradley"
  note: "MUST FIX, and it is the hinge of the chapter's narrative. Theory predicted the star would culminate farthest SOUTH in December and farthest NORTH in June. What Bradley saw was that after December it kept moving south, reaching its most southerly point in MARCH and its most northerly in SEPTEMBER: three months out of phase with parallax, not opposite to it. The chapter's account, that it moved south in December as expected and continued moving south even in June, is wrong in both halves. By June the star was back near its December position and heading north. The total swing over six months was about one hundredth of a degree, roughly 36 to 40 arcseconds peak to peak, so the amplitude is 20 arcseconds but the range is 40, and changed by roughly 20 arcseconds over the course of a year understates it. Note that the figure caption at line 128 already states the correct phasing, so the body text now contradicts its own caption."

- id: ch12-011
  type: quotation
  status: verified
  text: "The pennant was moving not because the wind changed but because the boat's motion combined with the wind's direction to produce a new apparent direction."
