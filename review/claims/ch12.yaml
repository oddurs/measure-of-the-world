- id: ch12-001
  type: date
  status: verified
  text: "On a December evening in 1725 at Kew, in the house of Samuel Molyneux, James Bradley lowered his eye to the telescope of a zenith sector and awaited the moment when the star $ $ Draconis would cross the vertical wire."
  source: "MacTutor History of Mathematics, James Bradley, https://mathshistory.st-andrews.ac.uk/Biographies/Bradley/"
  note: "Correct as now written. Bradley was invited by Samuel Molyneux in December 1725 to Molyneux's estate at Kew to assist with observations of gamma Draconis; the first observation was made on 3 December 1725. This matches the Appendix G finding that the December 1725 series used Molyneux's sector at Kew."

- id: ch12-002
  type: quotation
  status: corrected
  text: "He had planned this observation with mathematical precision. $ $ Draconis passes nearly overhead at Kew's latitude; if any star would reveal stellar parallax—the tiny shift in position caused by Earth's orbital motion—this should be the one."
  source: "MacTutor History of Mathematics, James Bradley"
  note: "The attribution is backwards. It was MOLYNEUX who was interested in measuring annual stellar parallax, who commissioned the sector from George Graham, and who invited Bradley to assist. Bradley did not plan it. The choice of gamma Draconis was also not Bradley's initiative: it culminates almost overhead at Kew, which is why Robert Hooke had chosen the same star for his 1669 attempt. Recast the vignette so Molyneux is the principal and Bradley the invited observer."

