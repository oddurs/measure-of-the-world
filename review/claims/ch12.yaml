- id: ch12-025
  type: measurement
  status: unverified
  text: "The zenith sector achieved a precision of roughly 2–3 arcseconds for individual observations."
  source: ""
  note: ""

- id: ch12-026
  type: quotation
  status: unverified
  text: "Over a year's worth of data (perhaps 50–100 observations), systematic errors in the instrument's calibration or orientation could easily be identified and corrected, allowing the mean position to be determined to perhaps 1 arcsecond."
  source: ""
  note: ""

- id: ch12-027
  type: measurement
  status: unverified
  text: "With such precision, both aberration (amplitude 20 arcseconds) and nutation (amplitude 9 arcseconds) were easily detectable."
  source: ""
  note: ""

- id: ch12-028
  type: measurement
  status: unverified
  text: "But parallax—the expected shift for $ $ Draconis—was predicted to be roughly 0.3 arcseconds, based on rough distance estimates."
  source: ""
  note: ""

- id: ch12-029
  type: quotation
  status: unverified
  text: "More fundamentally, parallax requires distinguishing the annual shift due to Earth's orbital motion from proper motion (the star's actual motion through space) and systematic instrument errors."
  source: ""
  note: ""

- id: ch12-030
  type: measurement
  status: unverified
  text: "He designed an experiment to detect parallax (amplitude 0.3 arcsec) and instead detected aberration (amplitude 20 arcsec)—a phenomenon entirely unsuspected before his observations."
  source: ""
  note: ""

- id: ch12-031
  type: superlative
  status: unverified
  text: "First, it provided an independent confirmation that Earth indeed moves in an orbit around the sun—a fact known from Copernican theory and Newton's physics, but never before demonstrated directly by stellar observation."
  source: ""
  note: ""

- id: ch12-032
  type: quotation
  status: unverified
  text: "This value agrees closely with the speed of light measured by other methods (such as Roemer's determination from the eclipses of Jupiter's moons, which gave $c 2.75 10^5$ km/s)."
  source: ""
  note: ""

- id: ch12-033
  type: quotation
  status: unverified
  text: "This was confirmation of Newton's gravitational law at a level of precision that would have been impossible without Bradley's instruments and persistence."
  source: ""
  note: ""

- id: ch12-034
  type: measurement
  status: unverified
  text: "Refraction: Near the zenith, refraction is minimal (less than 1 arcsecond), but it must still be corrected."
  source: ""
  note: ""

- id: ch12-035
  type: superlative
  status: unverified
  text: "The fit yielded not only confirmation of the aberration phenomenon but also the first quantitative determination of the constant of aberration."
  source: ""
  note: ""

- id: ch12-036
  type: attribution
  status: unverified
  text: "Following Flamsteed's cataloging effort and building on the precision methods of the mural arc, Bradley demonstrated that careful observation with refined instruments could reveal phenomena unanticipated by theory."
  source: ""
  note: ""

- id: ch12-037
  type: date
  status: unverified
  text: "His contributions were recognized: in 1742, he was appointed Astronomer Royal, a position he held until his death in 1762."
