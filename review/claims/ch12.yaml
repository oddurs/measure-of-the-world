- id: ch12-022
  type: quotation
  status: unverified
  text: "The torque on Earth's equatorial bulge due to the Moon is: MATH where $a_ E $ is Earth's equatorial bulge parameter, $m_ Moon $ is the Moon's mass, $r_ Moon $ is the Earth-Moon distance, and $ $ is the angle between the Moon's orbital plane and Earth's rotational axis."
  source: ""
  note: "The printed torque expression is not a standard result and appears garbled. It multiplies by e_Moon, the lunar eccentricity, for no stated reason; it calls a_E an equatorial bulge parameter without defining it; and the standard expression for the lunisolar torque on the Earth depends on the dynamical ellipticity (C - A)/C, which does not appear. Replace it with a sourced form or cut it. The footnote's citation is also broken: Vallado2013, Revisiting Spacetrack Report 3, is a 2006 AIAA conference paper by Vallado and others about SGP4 orbit propagation, not a 2013 American Astronautical Society book, and it contains no chapter on nutation physics. Vallado's actual textbook is Fundamentals of Astrodynamics and Applications."

- id: ch12-023
  type: measurement
