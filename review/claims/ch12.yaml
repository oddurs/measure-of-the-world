- id: ch12-015
  type: superlative
  status: corrected
  text: "Bradley's measurements confirmed the value to roughly this precision, making his discovery one of the earliest precision verifications of celestial physics."
  source: "MacTutor History of Mathematics, James Bradley; scripts/verify/derivations.py"
  note: "Overstated. Bradley's own result was not 20.4955 arcseconds. From his aberration measurement he derived a light-time from the Sun of 8 minutes 12 seconds against the modern 8 minutes 20, which implies a constant of aberration of about 20.2 arcseconds, roughly 1.5 per cent low. Say that Bradley's value was about 20.2 arcseconds, within a couple of per cent of the modern 20.4955, rather than that he confirmed the value to roughly this precision. SEPARATE POINT: the footnote cites Feingold1984, The Newtonian Moment. Feingold's book of that title is 2004, not 1984, and it is a cultural history of Newton's reception with nothing on the constant of aberration. That citation should be replaced by Bradley's own 1729 paper."

- id: ch12-016
  type: date
  status: corrected
  text: "He observed $ $ Draconis on multiple nights over the period December 1725 to December 1726, measuring its angular distance from the zenith."
  source: "MacTutor History of Mathematics, James Bradley"
  note: "The Kew series ran from December 1725 through 1726, so December 1725 to December 1726 is right for it, but the chapter's opening paragraph says the next eighteen months, which does not match. Bradley's broader survey of other stars began in August 1727 with his own instrument at Wanstead. Pick one span and make the opening agree with the worked example. MUST ALSO FIX the four data points in this section: they are inverted in phase. As printed they put the star farthest NORTH in March (+17.26) and farthest SOUTH in December (-20.47). History and the chapter's own figure caption put it farthest SOUTH in March and farthest NORTH in September. The September value printed here (-7.06, south) is where the caption says the northern maximum belongs, and Appendix I's reconstruction gives +20.5 for the northern maximum in autumn. The three files now disagree with one another."

- id: ch12-017
  type: date
  status: corrected
  text: "Fitting this sinusoidal model to Bradley's data: MATH with $t$ measured from some reference date (say, the beginning of 1726)."
  source: "recomputed with the chapter's own model; scripts/verify/derivations.py, Bradley fit checks"
  note: "MUST FIX, every number in this fit is wrong and the conclusion is false. With the chapter's own z(t) = 20.5 sin(2 pi t + phi) and phi = -1.06 rad, the model gives June 1 = +20.5 arcsec (the chapter needs +10.1), December 1 = -17.9 arcsec (the chapter claims -20.5), and March 1 = +0.17 arcsec (the chapter claims +17.3). So phi = -1.06 does not even satisfy the June equation it was derived from. The two phases that DO satisfy sin(2.64 + phi) = 0.492 are phi = -0.013 and phi = -2.124, and neither reproduces the other three data points either, which means the four printed observations are not consistent with any single sinusoid of amplitude 20.5. The sentence These predictions match the observations almost exactly is false as printed. Note that scripts/verify/derivations.py independently flags the related fit in the appendices: it computes phi = -0.634 rad against the book's -1.05, an offset of -1.02 against the book's -0.2, and residuals of 3.15 arcsec RMS against the book's claimed 1 to 2."

