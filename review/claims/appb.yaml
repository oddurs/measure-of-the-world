# Claim ledger for src/appendices/appendix-b.tex
# Generated by scripts/claims/extract_claims.py; re-running preserves
# status/source/note for claims whose text is unchanged.
# status: unverified | verified | corrected | removed | stale

- id: appb-001
  type: superlative
  status: corrected
  text: "Refractors and reflectors used for both positional astronomy and spectroscopy, ranging from small refractors to the largest reflectors of the 20th century."
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1335 ; https://en.wikipedia.org/wiki/Isaac_Newton_Telescope"
  note: "False superlative. The largest reflector in the table is the Isaac Newton Telescope at 2.54 m. The largest reflectors of the 20th century were far larger (Hale 5 m, 1949; BTA-6 6 m, 1976; Keck 10 m, 1993). Correct to: ranging from small refractors to the largest reflector ever sited in the British Isles."

- id: appb-002
  type: date
  status: corrected
  text: "Note that speculum metal (copper-tin alloy) mirrors required regular re-polishing; modern aluminum and silver coatings (post-1900) eliminate this maintenance burden."
  source: "https://guysmathastro.com/2021/05/11/silvering-a-mirror-vs-aluminizing/ ; https://www.sciencedirect.com/science/article/abs/pii/0083665687900158"
  note: "Speculum as copper-tin alloy is correct (about two-thirds copper, one-third tin). The coating date is wrong. Silvered glass mirrors were introduced by Steinheil and Foucault in 1856-57, not post-1900; vacuum-deposited aluminium was developed by John Strong in the 1930s. Silver also tarnishes and needs re-silvering, so it does not eliminate maintenance. Correct to: silvered glass from the 1850s and aluminised glass from the 1930s."

- id: appb-003
  type: measurement
  status: corrected
  text: "Table summarizes the dramatic improvement in accuracy: from seconds per day (17th century) to seconds per million years (20th century)—a factor of $ 10^ 10 $ improvement over 350 years."
  source: "internal arithmetic against tab:clocks ; https://www.nist.gov/pml/time-and-frequency-division/time-services/brief-history-atomic-clocks-nist"
  note: "Internally inconsistent. One second per day to one second per million years is a factor of 3.7e8, not 1e10. The 1e10 factor requires the caesium row (1 s in 30M years). Also the span 1676 to 1999 is 323 years, not 350. Either say seconds per 30 million years, or restate the factor as about 4e8."

- id: appb-004
  type: tabular
  status: corrected
  text: "Flamsteed mural arc — Date: 1689; Maker: Sharp; Aperture: 130 mm; Circle: 2.1 m; Grad.: 1'; Accuracy: ±10''; Notes: Greenwich; sighted to zenith"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1045 ; https://www.rmg.co.uk/collections/objects/rmgc-object-10184"
  note: "Date 1689 correct (first observation 11 September 1689). Maker correct: built by Abraham Sharp under Flamsteed's direction, 1688-89. The 2.1 m is the RADIUS (79.5 in, or 6 ft 9 in, which Flamsteed rounded to 7 ft), not a circle diameter as the column header implies; the arc spans about 130-140 degrees, not a full circle. Aperture 130 mm is not documented in any source reached and is implausible: a 5-inch objective on a 1689 sighting telescope would have been among the largest lenses in England. Accuracy of ±10 arcsec could not be sourced."

- id: appb-005
  type: tabular
  status: corrected
  text: "Halley transit instr. — Date: 1710; Maker: Instrument maker; Aperture: 100 mm; Circle: 1.5 m; Grad.: 1'; Accuracy: ±15''; Notes: Greenwich; equatorial mounting"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1076"
  note: "Four errors. Date should be 1721, not 1710: Halley only became Astronomer Royal in 1720 and the instrument came into use in 1721. Maker is a placeholder; the maker is unknown (Lalande's 1759 attribution to Hooke is disputed, as Hooke died in 1702). Aperture is 1.75 inches (44 mm), not 100 mm. The 1.5 m appears to be the tube, which was 5 ft 6.5 in (1.69 m); there is no graduated circle, only a setting circle that does not survive. Equatorial mounting is impossible for a transit instrument: it was mounted on a horizontal axis 3 ft 6 in long, 13 inches off-centre, fixed in the meridian."

- id: appb-006
  type: tabular
  status: corrected
  text: "Bradley zenith sector — Date: 1727; Maker: George Graham; Aperture: 80 mm; Accuracy: ±1''; Notes: Greenwich; discovery of aberration"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1065"
  note: "Date, maker and aperture correct: erected 19 August 1727, by George Graham, objective about 3 inches (76 mm), enlarged to 3.5 in by Dollond in 1801. Location is wrong. The sector was at Bradley's uncle's observatory at Wanstead, and aberration was discovered there and announced in 1729; the instrument only came to Greenwich in 1749. Correct the note to: Wanstead; discovery of aberration. Accuracy of ±1 arcsec is defensible and conservative; the source reckons the instrument good to about 0.1 arcsec."

- id: appb-007
  type: tabular
  status: corrected
  text: "Bradley transit instr. — Date: 1750; Maker: Graham; Aperture: 120 mm; Circle: 2.0 m; Grad.: 1'; Accuracy: ±5''; Notes: Greenwich; precise RA determination"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1296"
  note: "Maker is wrong: John Bird, not Graham. Ordered 1749, in use September 1750. Aperture is 2.7 inches (69 mm), further stopped to 1.5 in (38 mm) by the wire-illumination screen, not 120 mm. The 2.0 m is presumably the 8 ft tube, which is 2.44 m; a transit instrument has no graduated circle, so the Circle and Grad. columns do not apply. Date, Greenwich and RA determination are correct: it defined the Greenwich Meridian from 1750 to 1816. Accuracy of ±5 arcsec could not be sourced."

- id: appb-008
  type: tabular
  status: corrected
  text: "Bird 8-ft quadrant — Date: 1750; Maker: John Bird; Aperture: 240 mm; Circle: 2.4 m radius; Grad.: 1'; Accuracy: ±8''; Notes: Oxford; portable design"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1054 ; https://www.mhs.ox.ac.uk/students/96to97/mquad.html"
  note: "Two instruments conflated. Bird's 8-ft brass mural quadrant of 1750 was Bradley's, at Greenwich, not Oxford. Bird's 8-ft quadrants for the Radcliffe Observatory, Oxford, date from 1772-73. Either fix the location to Greenwich or the date to 1772. Portable design is wrong in both cases: a mural quadrant is bolted to a wall in the plane of the meridian and cannot be moved. Aperture 240 mm is wrong; the 1773 Radcliffe quadrant has a 3-inch (76 mm) object glass. Radius 2.4 m (8 ft) is correct. Graduation: the Greenwich quadrant carried a 90-degree scale subdivided into 5-arcminute parts plus a 96-part scale, read to about 1 arcsec with vernier and later micrometer, so 1 arcmin misstates the division."

- id: appb-009
  type: tabular
  status: corrected
  text: "Airy transit circle — Date: 1851; Maker: Troughton & Simms; Aperture: 170 mm; Circle: 1.37 m; Grad.: 1'; Accuracy: ±0.5''; Notes: Greenwich; micrometers for readings"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1233 ; https://www.royalobservatorygreenwich.org/articles.php?article=1234"
  note: "sentence no longer present; was corrected"

- id: appb-010
  type: tabular
  status: corrected
  text: "Photographic ZT — Date: 1900; Maker: Various; Aperture: 150 mm; Grad.: digital; Accuracy: ±0.3''; Notes: Greenwich; automated recording"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1071 ; https://scientificinstrumentsociety.org/eliminating-errors-automating-observation-the-photographic-zenith-tube-of-the-neuchatel-observatory-in-switzerland/"
  note: "Date is wrong by 55 years. The Royal Observatory photographic zenith tube came into use in 1955, took over time determination from Small Transit C on 16 October 1957, and ran until 30 June 1984. Maker is a placeholder; Grubb Parsons built it, one of three (Neuchatel 1954, Greenwich 1955, Mount Stromlo 1956). Location is wrong: it stood at Herstmonceux, not Greenwich. Graduation digital is doubly wrong: it is anachronistic, and a PZT has no graduated circle at all, since it records star images photographically. Aperture 150 mm and accuracy ±0.3 arcsec could not be sourced."

- id: appb-011
  type: tabular
  status: verified
  text: "Newton's reflector — Aperture: 30 mm; Focal Length: 160 mm; Type: Newtonian; Maker/Era: Newton 1668; Location: Cambridge"
  source: "https://en.wikipedia.org/wiki/Newton%27s_reflector ; https://pictures.royalsociety.org/image-rs-8462"
  note: "Substantially correct. Newton completed the first reflector in late 1668 at Cambridge, primary mirror about 1.3 inches, focal ratio f/5. The documented aperture is 33 mm rather than 30 mm and the focal length about 150 mm rather than 160 mm; both are within rounding of the sources. The 1668 instrument was later lost; the surviving instrument is the 1672 replacement presented to the Royal Society."

- id: appb-012
  type: tabular
  status: corrected
  text: "Herschel 20-ft reflect. — Aperture: 190 mm; Focal Length: 6.1 m; Type: Speculum metal; Maker/Era: Herschel 1783; Location: Slough"
  source: "https://datchethistory.org.uk/datchet-people/herschels/ ; https://en.wikisource.org/wiki/Sir_William_Herschel,_his_life_and_works/Life_at_Datchet,_Clay_Hall,_and_Slough;_1782-1822"
  note: "Aperture is wrong by a factor of 2.5. The large 20-foot of 1783 had an 18.7-inch mirror, 475 mm, not 190 mm. (Herschel's other 20-foot, the small one, had a 12-inch mirror, 305 mm; neither is 190 mm.) Location is wrong: it was built and used at Datchet, where Herschel lived 1782-85; he moved to Clay Hall in June 1785 and to Slough on 3 April 1786. Focal length 6.1 m, speculum metal and the 1783 date are correct."

- id: appb-013
  type: tabular
  status: corrected
  text: "Herschel 40-ft reflect. — Aperture: 490 mm; Focal Length: 12.2 m; Type: Speculum metal; Maker/Era: Herschel 1789; Location: Slough"
  source: "https://en.wikipedia.org/wiki/40-foot_telescope ; https://collection.sciencemuseumgroup.org.uk/objects/co56770/original-mirror-for-william-herschels-forty-foot-telescope-1785"
  note: "Aperture is wrong by a factor of about 2.5, apparently a unit slip from the 49.5-inch mirror blank. The primary was 48 inches, about 1.22 m, not 490 mm. Focal length 12.2 m (40 ft), speculum metal, Slough and the 1789 completion date are correct; construction ran 1785-1789 at Observatory House."

- id: appb-014
  type: tabular
  status: corrected
  text: "Grubb 28-inch refract. — Aperture: 710 mm; Focal Length: 10.4 m; Type: Achromatic; Maker/Era: Grubb 1893; Location: Greenwich (Great Equatorial)"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1174 ; https://en.wikipedia.org/wiki/Greenwich_28-inch_refractor"
  note: "Focal length is wrong: 27 ft 10 in, about 8.48 m, not 10.4 m. Aperture 710 mm (28 in), achromatic, Howard Grubb of Dublin, ordered 1885 and brought into use 1893, Greenwich Great Equatorial: all correct. Glass discs were supplied by Chance Brothers; the mounting dates from the 1850s and was designed by Airy with Ransomes and Simms."

- id: appb-015
  type: tabular
  status: corrected
  text: "Isaac Newton Telescope — Aperture: 980 mm; Focal Length: 13.7 m; Type: Reflector; Maker/Era: Grubb/RGO 1967; Location: Herstmonceux, then La Palma"
  source: "https://www.royalobservatorygreenwich.org/articles.php?article=1335 ; https://en.wikipedia.org/wiki/Isaac_Newton_Telescope"
  note: "Aperture is wrong by a factor of 2.6, apparently from reading the 98-inch designation as 98 cm. The primary is 2.54 m (98 inches). Focal length 13.7 m matches no documented focus: the primary is 7.475 m, f/2.94. Grubb Parsons was commissioned in 1959, first light 1965, inaugurated at Herstmonceux 1967, moved to La Palma where it reopened in 1984 with a new 100-inch mirror. Aperture and focal length both need correcting."

- id: appb-016
  type: tabular
  status: corrected
  text: "Hadley octant — Era: 1730--1780; Makers: Various; Arc Range: 0^ – 90^; Reading Precision: 2–3'; Notes: Double reflection; portable"
  source: "https://www.hsm.ox.ac.uk/octant ; https://en.wikipedia.org/wiki/Octant_(instrument)"
  note: "Arc range and double reflection are correct: a 45-degree physical arc reads to 90 degrees because paired mirrors double the reflection angle. Hadley presented the octant to the Royal Society in 1731, so an era starting 1730 is a year early, and the 1780 end date is far too early: octants stayed in common use through the 19th century. Makers Various is a placeholder; named makers are well documented. Reading precision of 2-3 arcmin could not be sourced; contemporary verniers on engine-divided instruments read to 1 arcmin. See also appb-017, which duplicates this instrument."

- id: appb-017
  type: tabular
  status: corrected
  text: "Hadley quadrant — Era: 1740--1850; Makers: Various; Arc Range: 0^ – 90^; Reading Precision: 2–3'; Notes: Larger frame, improved steadiness"
  source: "https://www.hsm.ox.ac.uk/octant ; https://chsi.harvard.edu/node/1902223 ; https://www.britannica.com/technology/octant"
  note: "This row is not a real instrument. Hadley's quadrant and the octant are two names for the SAME instrument: it measures angles up to 90 degrees on an arc of only 45 degrees, and so was known both as an octant and as Hadley's quadrant. Presenting it as a separate, later, larger-framed device with its own date range is fabricated. The row should be deleted and appb-016 relabelled to give both names."

- id: appb-018
  type: tabular
  status: corrected
  text: "Ramsden sextant — Era: 1770--1900; Makers: Ramsden, others; Arc Range: 0^ – 120^; Reading Precision: 20–30''; Notes: Vernier scale; improved optics"
  source: "https://en.wikipedia.org/wiki/Jesse_Ramsden ; https://sextantbook.com/2010/09/01/jesse-ramsden-and-his-dividing-engine/"
  note: "Arc range 0-120 degrees and vernier scale are correct for a sextant (60-degree arc doubled by reflection). Era is overstated: Jesse Ramsden died in 1800, and his second dividing engine of about 1774-76 divided directly to 10 arcmin. An era ending in 1900 attributes a century of other makers' work to him. Reading precision of 20-30 arcsec is not the documented figure: Ramsden sextant verniers typically read to 1 arcmin, with the finest examples reading to 10 arcsec."

- id: appb-019
  type: tabular
  status: corrected
  text: "Troughton sextant — Era: 1800--1950; Makers: Troughton & Simms; Arc Range: 0^ – 120^; Reading Precision: 10–20''; Notes: Micrometer screw; marine standard"
  source: "https://en.wikipedia.org/wiki/Troughton_%26_Simms ; https://www.gracesguide.co.uk/Edward_Troughton ; https://augetimepieces.com/blogs/news/the-history-of-the-sextant"
  note: "sentence no longer present; was corrected"

- id: appb-020
  type: tabular
  status: corrected
  text: "20th-c. sextant — Era: 1900–present; Makers: Multiple; Arc Range: 0^ – 120^; Reading Precision: 10''; Notes: Bubble level; minimal maintenance"
  source: "https://en.wikipedia.org/wiki/Bubble_octant ; https://catalogs.marinersmuseum.org/object/CL26281"
  note: "Bubble level is wrong for a marine sextant. The bubble sextant is an aviation instrument, invented by Gago Coutinho in 1922, which substitutes an artificial horizon because an aircraft may have no usable sea horizon. The 20th-century marine sextant sights the true horizon; its defining change is the micrometer drum that replaced the vernier from about 1900. Arc range 0-120 degrees is correct and a reading precision of 10 arcsec is consistent with a micrometer drum reading to 0.2 arcmin. Makers Multiple is a placeholder."

- id: appb-021
  type: tabular
  status: corrected
  text: "Harrison H1 — Date: 1735; Escapement: Linked balance; Compensation: None; Rate/Day: ±5 s; Notes: Experimental; very accurate for land"
  source: "https://www.rmg.co.uk/collections/objects/rmgc-object-79139 ; https://redfernanimation.com/the-harrison-timekeepers/"
  note: "Compensation None is wrong and is the substantive error: H1 carries Harrison's gridiron of brass and steel, which compensates temperature by shifting the attachment point of the balance springs. Escapement is also wrong: H1 uses the grasshopper escapement; the two linked balances are the oscillator, not the escapement. Date 1735 is correct (made 1730-1735). Rate of ±5 s/day could not be sourced. The note is misleading: H1 was built expressly for sea and was sea-trialled to Lisbon in 1736."

- id: appb-022
  type: tabular
  status: corrected
  text: "Harrison H2 — Date: 1741; Escapement: Similar; Compensation: Temperature trim; Rate/Day: ±3 s; Notes: Improvement but heavy oscillation"
  source: "https://www.rmg.co.uk/collections/objects/rmgc-object-79140 ; https://redfernanimation.com/the-harrison-timekeepers/"
  note: "Date is wrong: H2 was made 1737-1739 and completed in 1739, not 1741. Escapement Similar and compensation Temperature trim are placeholders, not values: H2 uses the grasshopper escapement. Rate of ±3 s/day could not be sourced. H2 was never sea-tried; Harrison abandoned it on finding its balances vulnerable to a ship's yaw, which is the real content behind heavy oscillation."

- id: appb-023
  type: tabular
  status: corrected
  text: "Harrison H3 — Date: 1759; Escapement: Bi-metallic balance; Compensation: Integral; Rate/Day: ±1 s; Notes: Major breakthrough; complex"
  source: "https://en.wikipedia.org/wiki/John_Harrison ; https://redfernanimation.com/the-harrison-timekeepers/"
  note: "Escapement and Compensation columns are confused. H3 uses the grasshopper escapement; the bimetallic strip belongs in the Compensation column, where Integral says nothing. H3 introduced two lasting inventions, the bimetallic strip (which adjusts the balance spring's effective length with temperature) and the caged roller bearing. Date 1759 is correct: begun 1740, worked on for about 19 years. Rate of ±1 s/day could not be sourced."

- id: appb-024
  type: tabular
  status: corrected
  text: "Harrison H4 — Date: 1759; Escapement: Detent; Compensation: Diamond pallets; Rate/Day: ±0.2 s; Notes: Nearly watches; highly accurate"
  source: "https://www.rmg.co.uk/collections/objects/rmgc-object-79142 ; https://watchesbysjx.com/2019/09/john-harrison-marine-chronometer-h4-diamond-pallets.html ; https://www.tandfonline.com/doi/abs/10.1080/00033790701619675"
  note: "Escapement and Compensation columns are swapped and both wrong. H4 uses a heavily modified verge escapement with diamond pallets, not a detent escapement; the detent escapement is Arnold and Earnshaw's later invention. Diamond pallets are part of the escapement, not a compensation method; H4's compensation is a bimetallic curb. Date 1759 is correct. Rate of ±0.2 s/day could not be sourced. Notes Nearly watches is garbled: H4 IS a watch, about 5 inches across."

- id: appb-025
  type: tabular
  status: corrected
  text: "Harrison H5 — Date: 1772; Escapement: Detent; Compensation: Bi-metallic; Rate/Day: ±0.1 s; Notes: Final refinement; production model"
  source: "https://collection.sciencemuseumgroup.org.uk/objects/co8448183/marine-timekeeper-known-as-h5-by-john-harrison-and-son-1770 ; https://brewminate.com/the-h5-of-1770-unprecedented-accuracy-for-sailors-with-john-harrisons-marine-chronometer/"
  note: "Three errors. Date should be 1770 (completed by John Harrison and Son); 1772 is the year of the ten-week trial before George III. Escapement Detent is wrong: like H4, H5 uses a verge escapement with diamond pallets. Rate ±0.1 s/day contradicts the trial record, which reports a loss of about one-third of a second per day, so ±0.33 s. Production model is wrong: H5 was a one-off, never produced in series; commercial production came from Arnold and Earnshaw with a quite different escapement. Bi-metallic compensation is correct."

- id: appb-026
  type: tabular
  status: corrected
  text: "Kendall K1 — Date: 1769; Escapement: Copy of H4; Compensation: Diamond pallets; Rate/Day: ±0.3 s; Notes: Copy for naval testing"
  source: "https://www.rmg.co.uk/collections/objects/rmgc-object-79143 ; https://quillandpad.com/2020/07/05/larcum-kendall-and-k1-the-greatest-watchmaker-and-watch-you-have-probably-never-heard-of-reprise/"
  note: "Date 1769 is correct: begun May 1767, finished late 1769, presented to the Board of Longitude in 1770. Copy of H4 is a fair description of the escapement (verge with diamond pallets). Compensation Diamond pallets is wrong, the same column error as H4: diamond pallets are escapement components; K1's compensation is a bimetallic curb. Rate of ±0.3 s/day could not be sourced. Copy for naval testing is correct: K1 sailed with Cook on the second voyage, 1772-75."

- id: appb-027
  type: tabular
  status: corrected
  text: "Arnold marine chron. — Date: 1780+; Escapement: Chronometer; Compensation: Bi-metallic; Rate/Day: ±0.5 s; Notes: Commercial production; reliable"
  source: "https://redfernanimation.com/arnold-and-earnshaw/ ; https://en.wikipedia.org/wiki/Thomas_Earnshaw"
  note: "Escapement Chronometer is a placeholder, not a value. Arnold's is the spring detent escapement, which he patented in 1782 after earlier pivoted-detent work. Date 1780-plus and bimetallic compensation and commercial production are all supportable. Rate ±0.5 s/day is optimistic: sources give the spring detent escapement as capable of 1 to 2 seconds per day in service."

- id: appb-028
  type: tabular
  status: corrected
  text: "Earnshaw chron. — Date: 1790+; Escapement: Spring detent; Compensation: Bi-metallic; Rate/Day: ±0.5 s; Notes: Simpler design; widely used"
  source: "https://en.wikipedia.org/wiki/Thomas_Earnshaw ; https://redfernanimation.com/arnold-and-earnshaw/"
  note: "Escapement, compensation and the simpler-design note are correct. Date is late: Earnshaw devised the spring-mounted detent in 1780, roughly a decade before the stated 1790, though his Board of Longitude trials at Greenwich did run in the late 1790s and his award came in 1805. Rate ±0.5 s/day is optimistic against the 1-2 s/day given for spring detent chronometers in service."

- id: appb-029
  type: tabular
  status: corrected
  text: "Tompion regulators — Date: 1676; Escapement: Anchor; Compensation: Gridiron pendulum; Accuracy: ±1 s/day; Notes: Greenwich; set standard for precision"
  source: "https://www.rmg.co.uk/collections/objects/rmgc-object-202113 ; https://www.royalobservatorygreenwich.org/articles.php?article=1381"
  note: "Gridiron pendulum is a 50-year anachronism and the worst error in this table. The gridiron is Harrison's, from about 1726; Tompion's two year-going clocks of 1676 had no temperature compensation at all. Escapement Anchor is also wrong: Tompion used an early form of dead-beat escapement in 1675-76. Date 1676 and the Greenwich location are correct; the clocks were commissioned by Jonas Moore for Flamsteed and had 13-foot, two-second pendulums. Accuracy is optimistic: sources give about 2 s/day, improving after adjustment to within 8 seconds per month."

- id: appb-030
  type: tabular
  status: corrected
  text: "Graham regulator — Date: 1715; Escapement: Anchor; Compensation: Mercury comp.; Accuracy: ±2 s/week; Notes: Improved thermal stability"
  source: "https://en.wikipedia.org/wiki/George_Graham_(clockmaker) ; https://www.britannica.com/technology/dead-beat-escapement"
  note: "Escapement Anchor is wrong and erases the point of the entry: Graham's regulators use the dead-beat escapement, which he introduced in his precision regulators around 1715 (its invention is sometimes credited earlier to Towneley and Tompion). The date and compensation are inconsistent with each other: Graham invented the mercury-compensated pendulum in 1721, six years after the stated 1715 date. Either date the row 1721 or drop the mercury compensation. Accuracy of ±2 s/week could not be sourced."

- id: appb-031
  type: tabular
  status: corrected
  text: "Shepherd master — Date: 1880; Escapement: Spring detent; Compensation: Bi-metallic; Accuracy: ±0.1 s/day; Notes: Electric impulse drive; very stable"
  source: "https://www.rmg.co.uk/royal-observatory/attractions/shepherd-gate-clock ; https://www.royalobservatorygreenwich.org/articles.php?article=1085"
  note: "Date is wrong by 28 years. Charles Shepherd installed the master clock and its network of sympathetic clocks in 1852, the gate dial on 13 August 1852, and it remained the heart of Britain's time system until 1893. Escapement Spring detent is wrong: this is an electrically controlled clock system under Shepherd's 1849 galvanic patent, not a detent chronometer escapement. Electric impulse drive is correct. Bimetallic compensation and ±0.1 s/day could not be sourced."

- id: appb-032
  type: tabular
  status: corrected
  text: "Shortt free-pendulum — Date: 1920; Escapement: Free pendulum; Compensation: Vacuum chamber; Accuracy: ±1 s/month; Notes: Electromagnetic coupling; nearly ideal"
  source: "https://en.wikipedia.org/wiki/Shortt%E2%80%93Synchronome_clock ; https://theclockworks.org/collection-online/free-pendulum-and-subsidiary-no-47"
  note: "Accuracy understates the instrument by at least a factor of twelve. The Shortt-Synchronome kept time to about one second per year, not one second per month; a 1984 test at the US Naval Observatory found one second in ten years. Date should be 1921, when Shortt and Hope-Jones introduced it. Compensation Vacuum chamber is imprecise: the compensation is the Invar master pendulum, while the evacuated tank removes barometric and humidity effects. Free pendulum with electromagnetic coupling to a slave clock is correct."

- id: appb-033
  type: tabular
  status: corrected
  text: "Cesium-133 clock — Date: 1955+; Escapement: Hyperfine trans.; Compensation: Atomic resonance; Accuracy: ±1 s/30M years; Notes: NIST-F1; primary standard"
  source: "https://www.nist.gov/pml/time-and-frequency-division/time-services/brief-history-atomic-clocks-nist ; https://physicsworld.com/a/celebrating-louis-essen-and-the-birth-of-atomic-time/"
  note: "The row conflates two instruments 44 years apart. Essen's caesium standard at the National Physical Laboratory was unveiled in May 1955 and was accurate to about 1 millisecond a day, roughly 1 second in 300 years. NIST-F1 is a caesium fountain that began operating in 1999 and was accurate to 1 second in 20 million years, not 30 million. Pick one: 1955 with 1 s in 300 years, or NIST-F1 1999 with 1 s in 20M years. Primary standard is correct for caesium."

- id: appb-034
  type: tabular
  status: unverified
  text: "Hydrogen maser — Date: 1960+; Escapement: Maser resonance; Compensation: Cavity tuning; Accuracy: ±1 s/1M years; Notes: Secondary standard; portable"
  source: "https://link.aps.org/doi/10.1103/PhysRevLett.5.361 ; https://en.wikipedia.org/wiki/Hydrogen_maser"
  note: "Date and role confirmed: Goldenberg, Kleppner and Ramsey reported the atomic hydrogen maser in 1960, and it is correctly described as a secondary standard, since it drifts over long periods and is not a primary realisation of the second. Cavity tuning is a real and correct detail. The ±1 s per million years figure could not be sourced and is the wrong kind of number: masers are specified by short-term stability, better than 1 part in 1e15 over hours, not by long-term absolute accuracy. Portable is questionable for a laboratory maser."
