- id: ch04-010
  type: measurement
  status: verified
  text: "Over hundreds of observations, these errors averaged to near zero, but individual observations could carry errors of a second or more—equivalent to 15 arcseconds in right ascension."
  source: "One second of time equals fifteen arcseconds of right ascension"
  note: "The conversion is right. But note the internal contradiction in the surrounding sentence: here 'Flamsteed called the clock reading to the nearest second; the assistant recorded it', whereas the chapter opens with the assistant calling the time and Flamsteed reading the arc, and chapter 3 also has the assistant call the time. Fix one way or the other."

- id: ch04-011
  type: date
  status: corrected
  text: "Thomas Tompion's two regulators, commissioned by Jonas Moore in 1676 and delivered to Flamsteed in 1677, were among the finest timekeepers in the world."
  source: "Royal Museums Greenwich, 'Year-Going Clock', RMGC object 202113, https://www.rmg.co.uk/collections/objects/rmgc-object-202113 ; Royal Observatory Greenwich, 'Private Patronage', https://www.royalobservatorygreenwich.org/articles.php?article=961"
  note: "Dates wrong. Moore commissioned the two clocks from Tompion in late 1675, and they were delivered to the Octagon Room in the summer of 1676, probably on 7 July, in time for the Observatory's opening. Not commissioned 1676 and delivered 1677. Chapter 2's caption gives 1676 for the commission, so the book contradicts itself here too."

- id: ch04-012
  type: quotation
  status: corrected
  text: "Each clock embodied innovations that Tompion had developed and refined over a lifetime of work: the anchor escapement (a mechanism allowing the pendulum to regulate the escape of energy from the clock's falling weights, enabling precise control at moderate swing amplitudes), a thirteen-foot pendulum (providing a period of approximately two seconds per swing), and brass and steel construction (minimizing thermal effects—the clock's sensitivity to temperature changes—by employing differential expansion, where the metals' different rates of thermal expansion partially cancel out timing errors)."
  source: "Royal Museums Greenwich, 'Year-Going Clock', https://www.rmg.co.uk/collections/objects/rmgc-object-202113 ; Royal Observatory Greenwich, 'Decoding Flamsteed', https://www.royalobservatorygreenwich.org/articles.php?article=1381"
  note: "Two of the three specifications are wrong. (1) Escapement: Royal Museums Greenwich describes a prototype DEAD-BEAT escapement, not the anchor escapement. This also contradicts chapter 2's footnote, corrected earlier today to read dead-beat. The book now attributes four different escapements to the same two clocks: dead-beat in chapter 2, anchor here, remontoire at chapter 6 line 52 and constant-force in chapter 6's table. (2) Temperature compensation: there was NONE. Compensated pendulums begin with Graham's mercury pendulum of 1721 and Harrison's gridiron of about 1726, decades after these clocks; the claim that brass and steel construction cancelled thermal error 'by employing differential expansion' is an anachronism and directly contradicts chapter 2's corrected footnote. (3) The thirteen-foot pendulum and its two-second swing are correct."

- id: ch04-013
  type: measurement
  status: corrected
  text: "Temperature variations of 10–15 degrees Celsius could introduce errors of a second or more per day."
  source: "Coefficient of linear thermal expansion of steel, about 11.5 parts per million per kelvin; pendulum period varies as the square root of length"
  note: "Understated by roughly a factor of six. For an uncompensated steel-rod pendulum a 12 K change gives a fractional period change of about 6.9 parts in 100,000, which is about 6 seconds a day, not 'a second or more'. A wooden rod would be less but still several seconds. The rod material of these particular clocks is not documented in the sources I reached, so give the figure as an order of magnitude with the material stated."

