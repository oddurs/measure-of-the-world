- id: ch04-001
  type: date
  status: corrected
  text: "On a clear night in the winter of 1690, with the temperature dropping below freezing and frost forming on the brass arc, John Flamsteed stood at the eyepiece of the mural arc and waited for Polaris to cross the meridian wire."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045 ; 'Flamsteed House', https://www.royalobservatorygreenwich.org/articles.php?article=916"
  note: "The date is workable, the setting is not. The arc was in use from 11 September 1689 and Sharp was at Greenwich until autumn 1690, so a winter 1690 observation is possible, and Polaris culminates at about 54 degrees altitude from Greenwich, so it is observable. But the arc was NOT in Flamsteed House. It hung on the west wall of the Quadrant House, a small detached building aligned to the meridian in the south-east corner of the garden; the chapter says later in the same section that the arc was 'attached to the meridian wall of Flamsteed House', which is wrong, and the Octagon Room's walls were in any case not aligned to a meridian. Also in this paragraph: reading the altitude 'with a filar micrometer ... to perhaps one-tenth of a degree' is absurd. One tenth of a degree is six arcminutes, some twenty times coarser than the ten to fifteen arcsecond graduation the same chapter claims two paragraphs later."

- id: ch04-002
  type: date
  status: corrected
  text: "The mural arc that Flamsteed designed with Abraham Sharp between 1689 and 1691 was the principal instrument of the Greenwich Observatory."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045 ; 'People: Abraham Sharp', https://www.royalobservatorygreenwich.org/articles.php?article=1148"
  note: "Built 1688-1689, not 1689-1691. Construction began in 1688 with money Flamsteed inherited, Sharp worked at Greenwich from August 1688 to autumn 1690, and the first observation with the arc was on 11 September 1689. Chapter 2 gives yet another span, 1679-1691, for the same instrument."

- id: ch04-003
  type: measurement
  status: corrected
  text: "It consisted of a curved wall of iron, 140 degrees of arc, with a radius of approximately 6.75 feet."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045"
  note: "Wrong material, and the radius should be given as measured. The arc was BRASS, carried on iron support bands with wooden reinforcing pieces; describing it as 'a curved wall of iron' inverts that, and the same chapter later has Sharp 'cutting the lines into brass', contradicting itself. The measured radius is 79 and a half inches, that is 6 feet 7.5 inches or 6.63 feet, not 6.75 feet. The 140-degree angular extent could not be confirmed from the Royal Observatory Greenwich record or the Royal Museums Greenwich model entry, neither of which states the arc's span; treat it as unverified until a source is found."

- id: ch04-004
  type: measurement
  status: verified
  text: "If the clock loses or gains one second over the course of an observation, the right ascension will be in error by $1^ s 15 arcsec/s = 15$ arcseconds—a severe error."
  source: "One second of time equals fifteen seconds of arc in right ascension, by the definition of right ascension in hours"
  note: "Correct and exact."

- id: ch04-005
  type: quotation
  status: verified
  text: "Bessel's formula approximates it as: MATH to adequate accuracy for Flamsteed's purposes."
  source: "Standard mean refraction constant: about 58.3 arcseconds times the tangent of the zenith distance, i.e. 58.3 arcseconds at 45 degrees altitude"
  note: "The formula is right, but the chapter should say where it fails. It is a good approximation only above roughly 15 degrees altitude. At 1 degree it gives 55.7 arcminutes and at the horizon it diverges, whereas true horizon refraction is about 35 arcminutes. That matters because this chapter's own figure caption claims refraction 'exceeds five arcminutes' near the horizon, which its own formula contradicts."

