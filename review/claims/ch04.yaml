- id: ch04-101
  type: quotation
  status: corrected
  text: "Wait---I made an error. Refraction makes the star appear higher, so we subtract the refraction to get the true altitude. Let me correct:"
  source: "Internal reading of src/chapters/04.tex, section 'A Worked Example: The Observation of Aldebaran, 1680'"
  note: "EDITORIAL ARTIFACT LEFT IN THE MANUSCRIPT. A first-person self-correction, in the drafting voice, sits in the middle of the worked example, together with the wrong intermediate line it corrects (61 deg 24 arcmin 42 arcsec, which is the observed altitude plus 50 arcseconds rather than minus). This must not go to print. The whole example needs rebuilding in any case; see ch04-014 to ch04-020."

- id: ch04-102
  type: attribution
  status: corrected
  text: "the longitude correction accounts for the observer being at Greenwich rather than the Prime Meridian"
  source: "The Prime Meridian is defined at Greenwich"
  note: "Self-contradictory. Greenwich IS the prime meridian, so for a Greenwich observer the longitude correction is identically zero. The sentence should either be deleted or rewritten to explain that the term exists for observers elsewhere and vanishes at Greenwich. The preceding clause, that the clock reading is converted to sidereal time 'via the equation of time and the UT-to-sidereal conversion', is also confused: the equation of time relates apparent to mean solar time and plays no part in a mean-solar to sidereal conversion."

- id: ch04-103
  type: superlative
  status: corrected
  text: "Tompion's clocks achieved an accuracy of a few seconds per day---a performance that would not be surpassed until the 19th century."
  source: "George Graham's mercury-compensated regulator, 1721; John Harrison's wooden regulators of the later 1720s, reported to keep time to about one second a month"
  note: "Wrong by a century. Graham's mercury pendulum of 1721 and Harrison's wooden regulators of the later 1720s, which are credited with about a second a month, both surpassed Tompion's 1676 clocks well inside the eighteenth century, and Graham's dead-beat regulators became the observatory standard. The accuracy figure itself also conflicts with chapters 2, 3 and 6; see ch03-104."

- id: ch04-104
  type: attribution
  status: corrected
  text: "comparing them regularly against the Sun's noon transit (using a gnomon---a simple vertical stick casting a shadow---and a marked scale on the floor of Flamsteed House) was essential"
  source: "Royal Observatory Greenwich, 'Decoding Flamsteed: Flamsteed's modus operandi and the methods used to compare, regulate, rate and determine the errors of his clocks (1676-1719)', https://www.royalobservatorygreenwich.org/articles.php?article=1381"
  note: "Not how Flamsteed rated his clocks. He determined clock error from ALTITUDE observations of the Sun or of selected stars, taking three to five readings over about five minutes with a small quadrant in the Octagon Room, and published thirty to fifty such sets a year between 1676 and 1689; when he needed better accuracy he used equal-altitude observations before and after noon, on the reasoning that refraction would be the same at matching altitudes. No gnomon-and-floor-scale method appears in that account. Chapter 5 repeats the same claim and needs the same correction."

- id: ch04-105
  type: measurement
  status: corrected
  text: "Near the zenith, refraction is negligible; near the horizon, it exceeds five arcminutes."
  source: "Standard mean atmospheric refraction at the horizon, about 34 to 35 arcminutes; the chapter's own formula, 58.3 arcseconds times the cotangent of the altitude, gives 55.7 arcminutes at 1 degree altitude"
  note: "Figure caption understates horizon refraction by about a factor of seven. True horizon refraction is about 35 arcminutes, which is what chapter 3 and chapter 8 both say. The chapter's own Bessel formula, two paragraphs above the caption, gives 5.5 arcminutes at 10 degrees altitude and 55.7 arcminutes at 1 degree, so the caption contradicts the equation printed alongside it. The body text's 'several arcminutes at the horizon' has the same problem."

- id: ch04-106
  type: measurement
  status: corrected
  text: "The eye itself ... could resolve perhaps one or two arcseconds on a favorable night"
  source: "Human visual acuity is about one arcminute under good conditions; see chapter 3 of this book, which states the correct figure"
  note: "Wrong by a factor of thirty to sixty, and it contradicts chapter 3 of this book, which correctly gives about one arcminute. Note the distinction the passage needs: the eye cannot resolve one or two arcseconds ON THE SKY, but an observer estimating a fraction of a division on a 6.6-foot-radius arc is judging a linear distance on brass, where ten arcseconds corresponds to about a tenth of a millimetre. Rewrite to make that distinction rather than asserting arcsecond visual acuity."

- id: ch04-107
  type: attribution
  status: corrected
  text: "Clock reading at transit: 16h 58m 37s (in Greenwich Mean Time)"
  source: "Royal Observatory Greenwich, 'Decoding Flamsteed', https://www.royalobservatorygreenwich.org/articles.php?article=1381"
  note: "Anachronistic label. Greenwich Mean Time as a named standard does not exist in 1680; Flamsteed's clocks kept local mean solar time at Greenwich, which is what the reading should be called. Note also that chapter 3 says the clocks were set to SIDEREAL time, which is both wrong in itself and in direct contradiction with this chapter's treatment of the reading as mean solar. See ch03-013."
