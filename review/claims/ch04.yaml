- id: ch04-001
  type: date
  status: unverified
  text: "On a clear night in the winter of 1690, with the temperature dropping below freezing and frost forming on the brass arc, John Flamsteed stood at the eyepiece of the mural arc and waited for Polaris to cross the meridian wire."
  source: ""
  note: ""

- id: ch04-002
  type: date
  status: unverified
  text: "The mural arc that Flamsteed designed with Abraham Sharp between 1689 and 1691 was the principal instrument of the Greenwich Observatory."
  source: ""
  note: ""

- id: ch04-003
  type: measurement
  status: unverified
  text: "It consisted of a curved wall of iron, 140 degrees of arc, with a radius of approximately 6.75 feet."
  source: ""
  note: ""

- id: ch04-004
  type: measurement
  status: unverified
  text: "If the clock loses or gains one second over the course of an observation, the right ascension will be in error by $1^ s 15 arcsec/s = 15$ arcseconds—a severe error."
  source: ""
  note: ""

- id: ch04-005
  type: quotation
  status: unverified
  text: "Bessel's formula approximates it as: MATH to adequate accuracy for Flamsteed's purposes."
  source: ""
  note: ""

- id: ch04-006
  type: superlative
  status: unverified
  text: "The largest source of error here is refraction."
  source: ""
  note: ""

- id: ch04-007
  type: measurement
  status: unverified
  text: "For a declination near the zenith (close to the observer's latitude), refraction was minimal, typically a few arcseconds, and the declination could be determined to 10–20 arcseconds."
  source: ""
  note: ""

- id: ch04-008
  type: superlative
  status: unverified
  text: "Refraction uncertainty: As noted above, the refraction correction was the largest source of declination error, particularly at low altitudes."
  source: ""
  note: ""

- id: ch04-009
  type: measurement
  status: unverified
  text: "Flamsteed's refraction tables, derived from accumulated observations rather than from a well-developed theory, were accurate to perhaps 5–10 arcseconds."
  source: ""
  note: ""

- id: ch04-010
  type: measurement
  status: unverified
  text: "Over hundreds of observations, these errors averaged to near zero, but individual observations could carry errors of a second or more—equivalent to 15 arcseconds in right ascension."
  source: ""
  note: ""

- id: ch04-011
  type: date
  status: unverified
  text: "Thomas Tompion's two regulators, commissioned by Jonas Moore in 1676 and delivered to Flamsteed in 1677, were among the finest timekeepers in the world."
  source: ""
  note: ""

- id: ch04-012
  type: quotation
  status: unverified
  text: "Each clock embodied innovations that Tompion had developed and refined over a lifetime of work: the anchor escapement (a mechanism allowing the pendulum to regulate the escape of energy from the clock's falling weights, enabling precise control at moderate swing amplitudes), a thirteen-foot pendulum (providing a period of approximately two seconds per swing), and brass and steel construction (minimizing thermal effects—the clock's sensitivity to temperature changes—by employing differential expansion, where the metals' different rates of thermal expansion partially cancel out timing errors)."
  source: ""
  note: ""

- id: ch04-013
  type: measurement
  status: unverified
  text: "Temperature variations of 10–15 degrees Celsius could introduce errors of a second or more per day."
  source: ""
  note: ""

- id: ch04-014
  type: date
  status: unverified
  text: "On the night of November 8, 1680, Flamsteed observed the bright star Aldebaran (Alpha Tauri) crossing the meridian."
  source: ""
  note: ""

- id: ch04-015
  type: date
  status: unverified
  text: "From astronomical tables for 1680 November 8, $ _0 = 2^ h 18^ m 24^ s $."
  source: ""
  note: ""

- id: ch04-016
  type: attribution
  status: unverified
  text: "The observed altitude is $h_ obs = 61^ 24' 32''$."
  source: ""
  note: ""

- id: ch04-017
  type: quotation
  status: unverified
  text: "The refraction correction from Flamsteed's tables, for this altitude and the season, is approximately $R 50''$ (arcseconds)."
  source: ""
  note: ""

- id: ch04-018
  type: quotation
  status: unverified
  text: "Aldebaran's position in modern catalogs is $ = 4^ h 35^ m 55^ s $ and $ = +16^ 30' 33''$ (J2000.0 epoch)."
  source: ""
  note: ""

- id: ch04-019
  type: quotation
  status: unverified
  text: "Flamsteed's observation gives $ = 19^ h 20^ m 24^ s $ and $ = +22^ 52' 22''$, which differs by roughly 9 hours in right ascension and 6 degrees in declination."
  source: ""
  note: ""

- id: ch04-020
  type: quotation
  status: unverified
  text: "This disparity is not an error in Flamsteed's method but reflects precession (the slow wobble of Earth's axis causing a gradual shift in star positions over centuries) and the proper motion of Aldebaran itself."
  source: ""
  note: ""

- id: ch04-021
  type: measurement
  status: unverified
  text: "The combined typical error for a single high-altitude transit observation was thus on the order of 15–20 arcseconds."
  source: ""
  note: ""

- id: ch04-022
  type: measurement
  status: unverified
  text: "By observing each star many times over years, averaging the results to cancel random errors, and applying careful systematic corrections, Flamsteed achieved typical errors of 10 arcseconds in his final catalog—an improvement by a factor of 3 or more over the best prior work (Tycho Brahe's catalog, with its 1–3 arcminute errors)."
  source: ""
  note: ""

- id: ch04-023
  type: superlative
  status: unverified
  text: "Armed with this method, the Greenwich Observatory would accumulate a star catalog of unprecedented accuracy, a resource that would anchor positional astronomy for two centuries."
