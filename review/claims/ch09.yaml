  text: "At Richmond, on a winter morning in 1772, an old man placed a small watch in the palm of a king."
  source: ""
  note: ""

- id: ch09-002
  type: quotation
  status: unverified
  text: "The accumulated error: 4.5 seconds. ``By God, Harrison,'' the King declared, ``I will see you righted!'' Here was the final vindication of a forty-year quest that had consumed a craftsman, frustrated a Board, and challenged every assumption about how the problem of longitude should be solved."
  source: ""
  note: ""

- id: ch09-003
