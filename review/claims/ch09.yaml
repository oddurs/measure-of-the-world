  text: "Harrison recognized the problem empirically: H2's rate varied with its amplitude of swing, and this variation was significant enough to degrade performance below the Board's tolerance."
  source: "Royal Museums Greenwich, Longitude found; Oxford DNB entry for John Harrison"
  note: "MUST FIX. The chapter's account of why H2 was abandoned is wrong. The documented flaw is not amplitude-dependent centrifugal stiffening: Harrison found that the period of the BAR balances was disturbed by the ship's YAW, the rotation about its vertical axis when coming about while tacking. That is what made him adopt circular balances in H3. H2 also missed its trial because the war with Spain kept it ashore; the Board granted a further 500 pounds while he waited."

