- id: ch09-004
  type: date
  status: corrected
  text: "Then, in 1714, came the Act—and with it, the clear specification of the problem: produce a timekeeper that would not lose or gain more than two minutes over the course of a voyage to the West Indies and back."
  source: "Longitude Act 1714 (13 Anne c. 14); Royal Museums Greenwich, Longitude found"
  note: "The Act set a graded prize: 20,000 pounds for a method good to half a degree of longitude, 15,000 for two thirds of a degree, 10,000 for one degree, tested on a voyage to a port in the West Indies. Half a degree is two minutes of TIME, so the two-minute figure is right, but it is a derived equivalent, not the Act's wording, and the Act specifies the outward voyage, not a round trip. Recommend: not lose or gain more than two minutes of time (half a degree of longitude) on a voyage to the West Indies."

