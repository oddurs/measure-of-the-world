- id: ch02-001
  type: date
  status: unverified
  text: "On March 4, 1675, King Charles II appointed a 28-year-old self-taught astronomer from Derbyshire to an unprecedented position: ``Astronomical Observator to His Majesty.'' The title was invented for the occasion, the salary absurdly modest, the expectations revolutionary."
  source: ""
  note: ""

- id: ch02-002
  type: date
  status: unverified
  text: "John Flamsteed (1835), p. 7. The position was officially created by Royal Warrant, 22 June 1675."
  source: ""
  note: ""

- id: ch02-003
  type: date
  status: unverified
  text: "The founding of a royal observatory in 1675 was an act of strategic ambition."
  source: ""
  note: ""

- id: ch02-004
  type: superlative
  status: unverified
  text: "Yet such institutions were rare, and the investment was unprecedented."
  source: ""
  note: ""

- id: ch02-005
  type: date
  status: unverified
  text: "(The Observatoire de Paris had been founded eight years earlier, in 1667, under Louis XIV's patronage."
  source: ""
  note: ""

- id: ch02-006
  type: quotation
  status: unverified
  text: "The warrant, issued on 22 June 1675, was terse: the King had ``resolved to establish an observatory'' and to employ an ``astronomical observator'' charged with ``rectifying the tables of the motions of the heavens.'' The term was deliberate."
  source: ""
  note: ""

- id: ch02-007
  type: quotation
  status: unverified
  text: "Wren's brief was paradoxical: he was given a budget of 500 and asked to produce a structure that would house precision instruments, living quarters for an observer, and an assistant's rooms."
  source: ""
  note: ""

- id: ch02-008
  type: date
  status: unverified
  text: "The result was Flamsteed House, completed in 1676."
  source: ""
  note: ""

- id: ch02-009
  type: date
  status: unverified
  text: "When Flamsteed arrived at Greenwich in the summer of 1675, the Observatory was incomplete."
  source: ""
  note: ""

- id: ch02-010
  type: quotation
  status: unverified
  text: "Specifications: a 13-foot pendulum regulated each clock's swing; the mechanism incorporated Harrison's grasshopper escapement principles, though Harrison's work came later.) With these clocks, Flamsteed could time observations to a precision previously unimaginable."
  source: ""
  note: ""

- id: ch02-011
  type: superlative
  status: unverified
  text: "His great achievement was not to invent new principles, but to work within stringent constraints to produce instruments of unprecedented precision."
  source: ""
  note: ""

- id: ch02-012
  type: date
  status: unverified
  text: "Between 1679 and 1691, Flamsteed designed and constructed his greatest instrument: the mural arc."
  source: ""
  note: ""

- id: ch02-013
  type: superlative
  status: unverified
  text: "But Flamsteed's refinements to the design, and the precision he achieved, were unprecedented."
  source: ""
  note: ""

- id: ch02-014
  type: quotation
  status: unverified
  text: "As a star crossed the meridian (the north-south line), he could measure both its right ascension (the celestial coordinate measured along the celestial equator, determined from the time of transit across the meridian, which he recorded on Tompion's clocks) and its declination (from the arc's graduated scale)."
  source: ""
  note: ""

- id: ch02-015
  type: quotation
  status: unverified
  text: "( , p. 102–110, reproduces Flamsteed's detailed account of the mural arc's construction, including the costs incurred and the difficulties encountered.)"
  source: ""
  note: ""

- id: ch02-016
  type: attribution
  status: unverified
  text: "They observed circumpolar stars (near the north celestial pole), then stars at lower declinations, gradually building a comprehensive and precise catalog."
  source: ""
  note: ""

- id: ch02-017
  type: date
  status: unverified
  text: "By 1712, Flamsteed had completed observations of approximately 3,000 stars."
  source: ""
  note: ""

- id: ch02-018
  type: measurement
  status: unverified
  text: "The positions were accurate to typically 10–20 arc-seconds, an order of magnitude improvement over Tycho's century-old catalog."
  source: ""
  note: ""

- id: ch02-019
  type: date
  status: unverified
  text: "In 1709, Flamsteed petitioned the Admiralty, noting that his salary had never been increased in the 34 years since his appointment, while prices had risen and his assistants' wages had increased."
  source: ""
  note: ""

- id: ch02-020
  type: date
  status: unverified
  text: "He notes that the cost of living had roughly doubled since 1675, while his income remained fixed.) He requested an increase to 200."
  source: ""
  note: ""

- id: ch02-021
  type: superlative
  status: unverified
  text: "What emerged by the early 18th century was something unprecedented in the history of astronomy: a national institution dedicated to systematic observation, funded (albeit inadequately) by the state, staffed by capable observers, and directed toward a specific practical aim—furnishing the accurate stellar positions required for solving longitude."
  source: ""
  note: ""

- id: ch02-022
  type: attribution
