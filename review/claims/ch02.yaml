- id: ch02-101
  type: measurement
  status: corrected
  text: "It was a compact structure of brick and stone, four stories tall, with a distinctive octagonal turret rising from the northwest corner."
  source: "Royal Observatory Greenwich, 'Flamsteed House', https://www.royalobservatorygreenwich.org/articles.php?article=916"
  note: "Wrong on both counts. The original building had THREE storeys: basement, ground floor and first floor. And it had FOUR turrets, one at each corner, not a single one at the north-west; the eastern and western turrets later carried Maskelyne's camera obscura and the time ball."

- id: ch02-102
  type: attribution
  status: corrected
  text: "The Octagon Room, on the top floor, was designed to house long-focus telescopes and the great mural arc that would become Flamsteed's principal instrument."
  source: "Royal Observatory Greenwich, 'Flamsteed House', https://www.royalobservatorygreenwich.org/articles.php?article=916 ; Royal Museums Greenwich, 'Flamsteed House', https://www.rmg.co.uk/royal-observatory/attractions/flamsteed-house"
  note: "The mural arc was never in the Octagon Room and could not have been. The Octagon Room's walls are not aligned to a meridian, which is why it was largely useless for positional work; Flamsteed's meridian instruments lived in a small detached building in the south-east corner of the garden, the Quadrant House and Sextant House, and the arc hung on the Quadrant House's west wall. The Octagon Room did house the Tompion clocks and long telescopes. Chapter 4 repeats the same error, placing the arc on 'the meridian wall of Flamsteed House'."

- id: ch02-103
  type: superlative
  status: corrected
  text: "His assistant, Abraham Sharp (who would later become the second-best observational astronomer in Britain), was paid 20 pounds per year---leaving Flamsteed less than 80 pounds for his own subsistence."
  source: "Royal Observatory Greenwich, 'People: Abraham Sharp', https://www.royalobservatorygreenwich.org/articles.php?article=1148 ; 'Board of Ordnance Funding (1675-1818)', https://www.royalobservatorygreenwich.org/articles.php?article=957"
  note: "Three errors and an unsupportable superlative. (1) Sharp was not Flamsteed's assistant in 1675. He was at Greenwich in 1684-1685 and again from August 1688 to autumn 1690, and returned as a calculator from 1705. (2) The pay is wrong: the Observatory assistant was carried by the Ordnance as an extraordinary labourer at eighteen pence a day, about 27 pounds 4s 6d a year, and Sharp's later rate as calculator is estimated at 40 pounds. (3) The assistant was paid by the Board of Ordnance, not out of Flamsteed's 100 pound salary, so the subtraction leaving him 'less than 80 pounds' does not follow. (4) 'The second-best observational astronomer in Britain' is a ranking no source makes and cannot be supported; delete it."

- id: ch02-104
  type: measurement
  status: corrected
  text: "The final Historia Coelestis Britannica lists exactly 2,934 stars."
  source: "Royal Observatory Greenwich, 'Telescope: Flamsteed's Mural Arc (1689)', https://www.royalobservatorygreenwich.org/articles.php?article=1045 ; catalogue in volume 3 of the Historia Coelestis Britannica (1725)"
  note: "Off by one. The catalogue contains 2,935 stars. Given that the sentence says 'exactly', the digit matters."

- id: ch02-105
  type: attribution
  status: corrected
  text: "He also inherited a sextant of seven-foot radius, an instrument capable of measuring angles between celestial objects but ill-suited to the work of building a star catalog."
  source: "Royal Observatory Greenwich, 'Private Patronage', https://www.royalobservatorygreenwich.org/articles.php?article=961"
  note: "'Inherited' is misleading. The 7-foot equatorial sextant was newly made in 1676 at Jonas Moore's personal expense, along with Hooke's 10-foot mural quadrant and the two Tompion clocks; Flamsteed inherited nothing from a predecessor because there was none. The sextant was also the most used instrument at the Observatory until the mural arc came into service in 1689, so calling it 'ill-suited to the work of building a star catalog' understates its role."

- id: ch02-106
  type: attribution
  status: corrected
  text: "Abraham Sharp remained his indispensable assistant."
  source: "Royal Observatory Greenwich, 'People: Abraham Sharp', https://www.royalobservatorygreenwich.org/articles.php?article=1148"
  note: "Written in the context of the funding crisis of 1709, by which time Sharp had left Greenwich nineteen years earlier, in autumn 1690, for Portsmouth dockyard and then Yorkshire. He corresponded with Flamsteed and worked as a calculator from 1705, and he prepared material for the Atlas Coelestis, but he was not the resident assistant. Reword to reflect the correspondence relationship."
