- id: ch13-001
  type: date
  status: unverified
  text: "It was December 1851, and the newly installed transit circle at Greenwich Observatory had just completed its first full night of observations."
  source: ""
  note: ""

- id: ch13-002
  type: superlative
  status: unverified
  text: "The transit circle represented Airy's answer to a fundamental observational challenge: how to measure celestial coordinates with unprecedented precision, and how to make the measurement repeatable by different observers and different instruments at different observatories worldwide."
  source: ""
  note: ""

- id: ch13-003
  type: measurement
  status: unverified
  text: "The instrument consisted of a telescope of 6.7 inches aperture (170 mm) and 8 feet focal length (approximately 2.4 meters) mounted so that it could rotate only in the vertical plane containing the meridian."
  source: ""
  note: ""

- id: ch13-004
  type: measurement
  status: unverified
  text: "The five vertical wires served to eliminate the effect of the star's finite angular size (roughly 0.5 arcseconds for the best conditions)."
  source: ""
  note: ""

- id: ch13-005
  type: quotation
  status: unverified
  text: "The central wire's position relative to the star was used for the primary measurement, while the outer wires provided redundancy and allowed the observer to estimate the star's image diameter, which could indicate atmospheric turbulence or aberration."
  source: ""
  note: ""

- id: ch13-006
  type: measurement
  status: unverified
  text: "For stars observed near the zenith, the refraction correction was minimal (less than 1 arcsecond), rendering the declination determination very precise—often accurate to within 1 arcsecond or better."
  source: ""
  note: ""

- id: ch13-007
  type: measurement
  status: unverified
  text: "By taking repeated level observations and averaging, Airy could detect and correct for a tilt of the axis of as little as 0.1 arcsecond."
  source: ""
  note: ""

- id: ch13-008
  type: quotation
  status: unverified
  text: "If the instrument's meridian plane was not truly aligned with the astronomic meridian, then stars would be observed at transit times that differed from the true times by an amount depending on the star's declination and the azimuth error."
  source: ""
  note: ""

- id: ch13-009
  type: measurement
  status: unverified
  text: "When the two observed the same series of stars, Airy's times were consistently earlier by about 0.3 to 0.4 seconds."
  source: ""
  note: ""

- id: ch13-010
  type: measurement
  status: unverified
  text: "An observer's personal equation could then be determined—typically a constant offset of 0.1 to 0.5 seconds, depending on the individual."
  source: ""
  note: ""

- id: ch13-011
  type: date
  status: unverified
  text: "On the night of March 15, 1852, the bright star Arcturus ($ $ Boötis) was observed at transit."
  source: ""
  note: ""

- id: ch13-012
  type: attribution
  status: unverified
  text: "The observed times contain the observer's reaction time bias."
  source: ""
  note: ""

- id: ch13-013
  type: measurement
  status: unverified
  text: "Airy's correction is negative (he reacts early), so we add 0.32 seconds to his recorded time: MATH"
  source: ""
  note: ""

- id: ch13-014
  type: measurement
  status: unverified
  text: "The assistant's correction is positive (the assistant reacts late), so we subtract 0.18 seconds: MATH"
  source: ""
  note: ""

- id: ch13-015
  type: quotation
  status: unverified
  text: "Arcturus's position in modern catalogs is $ = 14^ h 29^ m 43.4^ s $ and $ = +19^ 10' 57''$ (J2000.0 epoch)."
  source: ""
  note: ""

- id: ch13-016
  type: measurement
  status: unverified
  text: "Airy's observed position differs by approximately 3 hours in right ascension and 5 degrees in declination."
  source: ""
  note: ""

- id: ch13-017
  type: quotation
  status: unverified
  text: "This discrepancy is not an error in Airy's method but reflects precession (the slow wobble of Earth's axis) and proper motion (Arcturus's intrinsic motion through space), which shift stellar positions over the 150+ years between Airy's observation and the modern J2000.0 epoch."
  source: ""
  note: ""

- id: ch13-018
  type: measurement
  status: unverified
  text: "For a single high-quality observation of a bright star observed near the zenith on a stable night, the typical error was on the order of 0.5 arcseconds in right ascension and 0.3 arcseconds in declination."
  source: ""
  note: ""

- id: ch13-019
  type: quotation
  status: unverified
  text: "However, by observing each star many times across its meridian passage and over many nights, with careful correction for all systematic effects, Airy achieved mean errors of roughly 0.2 arcseconds—a fourfold improvement over Bradley's instruments and a twentyfold improvement over Flamsteed's mural arc."
  source: ""
  note: ""

- id: ch13-020
  type: quotation
  status: unverified
  text: "( , Chapter 7, provides detailed analysis of the Airy transit circle's performance, including statistical analysis of residual errors in Airy's catalogs and discussion of the systematic differences between Airy's positions and those from other observatories.)"
  source: ""
  note: ""

- id: ch13-021
  type: date
  status: unverified
  text: "The transit circle became famous not for its technical excellence alone but for the role it played in the 1884 International Meridian Conference."
  source: ""
  note: ""

- id: ch13-022
  type: date
  status: unverified
  text: "In 1883, the nations of the world assembled in Washington to establish a single prime meridian—the reference line from which all longitude would be measured."
  source: ""
  note: ""

- id: ch13-023
  type: quotation
  status: unverified
  text: "The conference ultimately voted to adopt Greenwich, in large part because of Britain's dominance in maritime commerce and because Greenwich Observatory, under Airy's direction, possessed the finest meridian instrument in the world."
  source: ""
  note: ""

- id: ch13-024
  type: date
  status: unverified
  text: "In 1884, it was physically located at specific east-west coordinates on the Observatory grounds, and a brass line was laid into the floor to mark it."
  source: ""
  note: ""

- id: ch13-025
  type: measurement
  status: unverified
  text: "This modern prime meridian lies approximately 102 meters east of the brass line tourists straddle."
  source: ""
  note: ""

- id: ch13-026
  type: date
  status: unverified
  text: "( , Chapter 8, provides detailed discussion of the 1884 conference, the choice of Greenwich, and the later offset to WGS84. gives technical details on the offset's calculation and its implications for GPS.)"
  source: ""
  note: ""

- id: ch13-027
  type: date
  status: unverified
  text: "Yet it was precisely this achievement that made Greenwich Observatory and its transit circle the natural choice for the Prime Meridian in 1884."
  source: ""
