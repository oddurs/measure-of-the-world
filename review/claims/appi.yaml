- id: appi-001
  type: date
  status: unverified
  text: "This section illustrates the reduction of a historical observation using modern techniques, demonstrating how Bradley's 1725 zenith sector measurements of $ $ Draconis revealed stellar aberration."
  source: ""
  note: ""

- id: appi-002
  type: quotation
  status: unverified
  text: "The periodic pattern (September maximum of $+20.5''$, December maximum of $-20.5''$) contradicts parallax (which would show $+20.5''$ in December when Earth is farthest from star)."
  source: ""
  note: ""

- id: appi-003
  type: date
  status: unverified
  text: "Harrison's marine chronometer H5 underwent rigorous testing (1760–1770) to verify rate stability (deviation from constant rate)."
  source: ""
  note: ""

- id: appi-004
  type: measurement
  status: unverified
  text: ": A chronometer with $ 0.4$ s/day rate stability introduces $ 0.4 60 = 24$ second error over 60 days at sea."
  source: ""
  note: ""

- id: appi-005
  type: measurement
  status: unverified
  text: "Since 1 second of time corresponds to 15 arcseconds of longitude ($360^ /24$ hours per second), a 24-second error corresponds to $24 15 = 360$ arcseconds $= 6$ minutes of arc, enabling determination of longitude to within $ 1$ minute of arc (roughly 1 nautical mile at equator) after compensation."
  source: ""
  note: ""

